<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exception Handling — Mockup Gallery v3 (Photo-first Logistics)</title>
<style>
/* ================= BASE ================= */
*{box-sizing:border-box}
:root{--mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace}
body{margin:0;font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#dfe2e7;color:#1c2128;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
svg{display:block}
::selection{background:rgba(70,110,220,.25)}

/* ---- gallery chrome ---- */
.gbar{position:sticky;top:0;z-index:120;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:#15181d;color:#e6e9ee;box-shadow:0 3px 14px rgba(0,0,0,.35)}
.gb-t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8b93a1}
.gb-seg{display:flex;gap:4px;background:#22262d;padding:4px;border-radius:8px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.gb-seg::-webkit-scrollbar{display:none}
.gb-seg button{border:0;background:transparent;color:#9aa3b0;font-size:12px;font-weight:600;padding:7px 13px;border-radius:6px;white-space:nowrap}
.gb-seg button.on{background:#3a4150;color:#fff}
.gb-hint{font-size:11px;color:#6b7280;margin-left:auto}
.stage{padding:20px 16px 60px}
.note{max-width:1280px;margin:0 auto 14px;padding:11px 15px;border-radius:8px;background:#f4f5f7;border:1px solid #d8dce2;font-size:12.5px;line-height:1.6;color:#3c434d}
.note b{color:#15181d}
.device{max-width:1280px;margin:0 auto}
.device.mobile{max-width:414px}
.app{display:flex;min-height:720px;background:var(--bg);color:var(--tx);border:1px solid var(--edge);border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(10,14,20,.22);position:relative;font-size:13px}
.device.mobile .app{min-height:0;border:9px solid #191d24;border-radius:30px}

/* ================= THEME TOKENS ================= */
/* A — Bright Board (sáng, lọc trái) */
body.tA{--bg:#f6f7f8;--panel:#fff;--edge:#e2e5e9;--edge-soft:#eceef1;--tx:#191d23;--tx2:#5b6470;--tx3:#8a93a0;
--accent:#2f5fe0;--accent-soft:#eaf0fe;--brand:#2f5fe0;
--st-kho:#b45309;--st-kho-bg:#fdf3e3;--st-kho-bd:#f0dfbd;--st-res:#0f7b5f;--st-res-bg:#e7f5ef;--st-res-bd:#c6e6d8;--st-liq:#5b6470;--st-liq-bg:#eef0f2;--st-liq-bd:#dcdfe4;--danger:#c22f2f;--danger-bg:#fbeaea;
--side-bg:#fbfcfd;--side-w:224px;--rail:1;--ar:4/3;--gmin:236px;--r:8px;--cardsh:0 1px 2px rgba(16,24,40,.06),0 1px 6px rgba(16,24,40,.05);
--ring:0 0 0 3px rgba(47,95,224,.16)}
/* B — Scan Wall (dark, điều hành Ca đêm) */
body.tB{--bg:#0e1216;--panel:#161c23;--edge:#263038;--edge-soft:#1d252d;--tx:#d7dde4;--tx2:#8b96a3;--tx3:#5c6672;
--accent:#3fa9f5;--accent-soft:rgba(63,169,245,.13);--brand:#3fa9f5;
--st-kho:#e8a33d;--st-kho-bg:rgba(232,163,61,.13);--st-kho-bd:rgba(232,163,61,.35);--st-res:#4cc38a;--st-res-bg:rgba(76,195,138,.12);--st-res-bd:rgba(76,195,138,.32);--st-liq:#8a95a5;--st-liq-bg:rgba(138,149,165,.12);--st-liq-bd:rgba(138,149,165,.3);--danger:#f26d6d;--danger-bg:rgba(242,109,109,.13);
--side-bg:#10151a;--side-w:0px;--rail:0;--ar:1/1;--gmin:186px;--r:6px;--cardsh:0 1px 0 rgba(255,255,255,.03) inset,0 6px 18px rgba(0,0,0,.35);
--ring:0 0 0 3px rgba(63,169,245,.25)}
/* C — Photo Dossier (giấy, rail icon, ảnh to thoáng) */
body.tC{--bg:#f5f3ee;--panel:#fffdf8;--edge:#ddd7cb;--edge-soft:#e9e4da;--tx:#23262d;--tx2:#5c6069;--tx3:#8b8f97;
--accent:#1f4d3d;--accent-soft:#e8efeb;--brand:#1f4d3d;
--st-kho:#9a6b1f;--st-kho-bg:#f6eeda;--st-kho-bd:#e2d3ae;--st-res:#1f6b4f;--st-res-bg:#e3efe8;--st-res-bd:#c2dccd;--st-liq:#6a6e76;--st-liq-bg:#e9e8e4;--st-liq-bd:#d5d3cc;--danger:#b03a2e;--danger-bg:#f6e5e2;
--side-bg:#20242b;--side-w:64px;--rail:1;--ar:3/2;--gmin:300px;--r:3px;--cardsh:0 1px 3px rgba(40,35,20,.10);
--ring:0 0 0 3px rgba(31,77,61,.15)}

/* ================= SIDEBAR ================= */
.side{width:var(--side-w);flex:none;background:var(--side-bg);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:12px 10px;position:relative;z-index:20}
body:not(.tA) .side{padding:12px 8px;align-items:center}
body.tB .side{display:none}
body:not(.tA) .side .lbl,body:not(.tA) .side .side-sec,body:not(.tA) .side .kindtog,body:not(.tA) .side .flt-i,body:not(.tA) .side-brand>span:last-child,body:not(.tA) .side-reset,body:not(.tA) .side-foot{display:none}
body:not(.tA) .side .nav-i{justify-content:center;padding:10px 0;width:44px}
body:not(.tA) .side .nav-i svg{width:18px;height:18px}
body:not(.tA) .side .nav-i b{display:none}
.side-brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:13px;color:var(--tx);letter-spacing:.01em}
body:not(.tA) .side-brand{justify-content:center;padding:4px 0 14px}
.sb-mark{width:26px;height:26px;flex:none;border-radius:5px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;letter-spacing:.03em}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:14px 8px 6px}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:var(--tx2);font-size:12.5px;font-weight:600;padding:8px 9px;border-radius:var(--r);text-align:left}
.nav-i svg{width:15px;height:15px;flex:none}
.nav-i:hover{background:var(--edge-soft);color:var(--tx)}
.nav-i.on{background:var(--accent-soft);color:var(--accent)}
.flt-i{display:flex;align-items:center;gap:8px;width:100%;border:1px solid transparent;background:transparent;color:var(--tx2);font-size:12px;font-weight:600;padding:6px 9px;border-radius:var(--r);text-align:left}
.flt-i .dot{width:7px;height:7px;border-radius:50%;flex:none}
.flt-i b{margin-left:auto;font-weight:700;font-size:11px;color:var(--tx3)}
.flt-i.on{border-color:var(--edge);background:var(--panel);color:var(--tx)}
.kindtog{display:flex;gap:6px;padding:2px 8px}
.kindtog button{flex:1;border:1px solid var(--edge);background:var(--panel);color:var(--tx3);border-radius:var(--r);font-size:10.5px;font-weight:700;padding:6px 0;letter-spacing:.04em}
.kindtog button.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.side-reset{border:0;background:transparent;color:var(--tx3);font-size:11px;padding:8px 9px;text-align:left}
.side-foot{margin-top:auto;padding:10px 9px;border-top:1px solid var(--edge-soft);font-size:10.5px;color:var(--tx3);line-height:1.5}
.side-foot b{display:block;color:var(--tx2)}

/* ================= MAIN ================= */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.cmd{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--edge);background:var(--panel)}
body.tB .cmd{flex-wrap:wrap}
.cmd h1{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--tx)}
body:not(.mobile) body.tB .cmd h1{font-size:14px}
.cmd .crumbs{display:none}
body.tB .cmd{padding:10px 14px}
body.tB .cmd .brand-b{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--tx)}
body:not(.tB) .cmd .brand-b{display:none}
body.tB .cmd .nav-i{width:auto;padding:6px 10px;font-size:11.5px}
body.tB .cmd .nav-i svg{width:13px;height:13px}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);background:var(--bg);border-radius:var(--r);padding:7px 10px;min-width:170px;max-width:320px;flex:1}
.srch svg{width:14px;height:14px;color:var(--tx3);flex:none}
.srch input{border:0;outline:0;background:transparent;color:var(--tx);font-size:12.5px;width:100%;min-width:0}
.srch kbd{font-family:var(--mono);font-size:9.5px;color:var(--tx3);border:1px solid var(--edge);border-radius:4px;padding:1px 5px;background:var(--panel)}
.cmd-act{display:flex;gap:8px;align-items:center;margin-left:auto}
.ico-b{width:32px;height:32px;border:1px solid var(--edge);border-radius:var(--r);background:var(--panel);color:var(--tx2);display:flex;align-items:center;justify-content:center;position:relative}
.ico-b svg{width:15px;height:15px}
.ico-b .bdot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--edge);background:var(--panel);color:var(--tx);font-size:12px;font-weight:600;border-radius:var(--r);padding:8px 12px}
.btn svg{width:14px;height:14px}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--tx2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.who{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--tx2);font-weight:600}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
.kpistrip{display:none;gap:8px;padding:10px 14px;border-bottom:1px solid var(--edge);background:var(--panel)}
body.tB .kpistrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{border:1px solid var(--edge-soft);border-radius:var(--r);padding:9px 12px;background:var(--bg)}
.kpi .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.kpi .v{font-size:19px;font-weight:750;color:var(--tx);margin-top:2px}
.kpi .v em{font-style:normal;font-size:10.5px;color:var(--tx3);font-weight:600;margin-left:5px}
.kpi.warn .v{color:var(--danger)}
.toolbar{display:flex;align-items:center;gap:9px;padding:12px 18px;flex-wrap:wrap}
body.tB .toolbar{padding:10px 14px}
.seg{display:flex;background:var(--edge-soft);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--tx2);font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:5px;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button i{font-style:normal;color:var(--tx3);margin-left:5px;font-size:10.5px}
.seg button.on i{color:var(--accent)}
.tb-meta{font-size:11px;color:var(--tx3)}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
select.sort{border:1px solid var(--edge);background:var(--panel);color:var(--tx2);border-radius:var(--r);font-size:11.5px;padding:7px 9px;outline:0}

/* ================= PHOTO BOARD ================= */
.boardwrap{flex:1;overflow:auto;position:relative}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gmin),1fr));gap:16px;padding:4px 18px 24px;align-content:start}
body.tB .board{gap:10px;padding:2px 14px 20px}
body.tC .board{gap:22px;padding:8px 26px 30px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--cardsh);position:relative;transition:transform .12s,box-shadow .12s;min-width:0}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(10,14,20,.12)}
body.tB .card:hover{box-shadow:0 8px 22px rgba(0,0,0,.5)}
.card.sel{box-shadow:var(--ring);border-color:transparent}
.frame{position:relative;aspect-ratio:var(--ar);background:#d8d5d0;overflow:hidden}
.frame svg{width:100%;height:100%;display:block}
.ftag{position:absolute;top:8px;left:8px;font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#fff;background:rgba(15,18,22,.55);backdrop-filter:blur(2px);padding:3px 7px;border-radius:4px}
.fage{position:absolute;bottom:8px;right:8px;display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:rgba(15,18,22,.55);backdrop-filter:blur(2px);padding:3px 7px;border-radius:4px}
.fage svg{width:11px;height:11px}
.frame .ovd{position:absolute;bottom:8px;left:8px;display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--danger);padding:3px 8px;border-radius:4px;text-transform:uppercase}
.frame .ovd svg{width:11px;height:11px}
body.tB .frame::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px}
body.tB .card.s-kho .frame::after{background:var(--st-kho)}
body.tB .card.s-res .frame::after{background:var(--st-res)}
body.tB .card.s-liq .frame::after{background:var(--st-liq)}
.cinfo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;gap:8px;min-width:0}
.code{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
body.tC .code{font-size:11.5px}
.pill{margin-left:auto;flex:none;font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:2.5px 8px;border-radius:20px;border:1px solid}
body.tC .pill{border-radius:2px;text-transform:uppercase;letter-spacing:.1em;font-size:8.5px}
.p-kho{color:var(--st-kho);background:var(--st-kho-bg);border-color:var(--st-kho-bd)}
.p-res{color:var(--st-res);background:var(--st-res-bg);border-color:var(--st-res-bd)}
.p-liq{color:var(--st-liq);background:var(--st-liq-bg);border-color:var(--st-liq-bd)}
.desc{margin:0;font-size:11.5px;line-height:1.45;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.tC .desc{-webkit-line-clamp:1}
.cfoot{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx3);border-top:1px solid var(--edge-soft);padding-top:7px;margin-top:1px}
.cfoot .nphoto{display:flex;align-items:center;gap:3px}
.cfoot .nphoto svg{width:11px;height:11px}
.cfoot .go{margin-left:auto;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:2px}
.cfoot .go svg{width:12px;height:12px}
/* select mode */
.ck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.85);background:rgba(15,18,22,.4);z-index:3;display:flex;align-items:center;justify-content:center;color:transparent}
.ck svg{width:13px;height:13px}
.card.checked .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.batch{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;background:var(--tx);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:650;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap}
body.tB .batch{background:#e8edf3;color:#10151a}
.batch button{border:0;border-radius:7px;font-size:12px;font-weight:700;padding:7px 12px;background:var(--accent);color:#fff}
.batch .cx{background:transparent;color:inherit;opacity:.75;padding:7px 8px}
.empty{padding:60px 20px;text-align:center;color:var(--tx3);font-size:12.5px;grid-column:1/-1}

/* ================= DETAIL DRAWER ================= */
.scrim{display:none}
.drawer{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:92%;background:var(--panel);border-left:1px solid var(--edge);z-index:50;display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(10,14,20,.14);animation:slidein .18s ease-out}
body.tB .drawer{box-shadow:-14px 0 40px rgba(0,0,0,.55)}
body.tC .drawer{width:470px;border-left:1px solid var(--edge)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--edge)}
.dhead .code{font-size:13px;font-weight:700}
.dhead .x{margin-left:auto}
.dbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.hero{border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;position:relative;background:#d8d5d0}
.hero .frame{aspect-ratio:4/3}
.strip{display:flex;gap:8px}
.strip .th{width:64px;aspect-ratio:1;border-radius:var(--r);overflow:hidden;border:1px solid var(--edge);cursor:pointer;position:relative;background:#d8d5d0}
.strip .th.on{border-color:var(--accent);box-shadow:var(--ring)}
.strip .th svg{width:100%;height:100%}
.strip .th .tl{position:absolute;left:0;right:0;bottom:0;font-size:7.5px;font-weight:700;letter-spacing:.05em;text-align:center;color:#fff;background:rgba(15,18,22,.55);padding:2px 0}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:7px 12px;font-size:12px}
.kv dt{color:var(--tx3);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;color:var(--tx)}
.kv dd .mono{font-family:var(--mono);font-size:11px}
.sec-t{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin:2px 0 -4px}
.tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:1.5px;background:var(--edge)}
.tl .ev{position:relative;font-size:11.5px;line-height:1.5}
.tl .ev::before{content:"";position:absolute;left:-20px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--tx3)}
.tl .ev.k-kho::before{border-color:var(--st-kho)}
.tl .ev.k-res::before{border-color:var(--st-res)}
.tl .ev.k-liq::before{border-color:var(--st-liq)}
.tl .ev b{display:block;color:var(--tx);font-weight:650}
.tl .ev span{color:var(--tx3);font-size:10.5px}
.dfoot{border-top:1px solid var(--edge);padding:14px 16px;background:var(--bg)}
.dfoot .row-in{display:flex;gap:8px}
.dfoot input{flex:1;min-width:0;border:1px solid var(--edge);border-radius:var(--r);background:var(--panel);color:var(--tx);font-family:var(--mono);font-size:12px;padding:9px 11px;outline:0}
.dfoot input:focus{box-shadow:var(--ring);border-color:var(--accent)}
.done{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r);background:var(--st-res-bg);border:1px solid var(--st-res-bd);color:var(--st-res);font-size:12px;font-weight:650}
.done svg{width:14px;height:14px}
.hintline{font-size:10.5px;color:var(--tx3);margin-top:8px}

/* ================= TAB PLACEHOLDER ================= */
.tabph{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.tabph .box{max-width:420px;text-align:center;border:1px dashed var(--edge);border-radius:12px;padding:38px 30px;background:var(--panel)}
.tabph svg{width:26px;height:26px;color:var(--tx3);margin:0 auto 12px}
.tabph h3{margin:0 0 8px;font-size:14px;color:var(--tx)}
.tabph p{margin:0;font-size:12px;color:var(--tx2);line-height:1.6}

/* ================= MOBILE NAV ================= */
.mnav{display:none}
.device.mobile .mnav{display:flex;position:absolute;left:0;right:0;bottom:0;height:58px;background:var(--panel);border-top:1px solid var(--edge);z-index:40;align-items:center;justify-content:space-around;padding:0 8px}
.device.mobile .side{display:none}
.device.mobile .app{height:780px}
.device.mobile .cmd .nav-i{display:none}
.device.mobile .cmd h1{display:none}

/* ================= HELPERS ================= */
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ageTxt(h){if(h<24)return h+'h';return Math.floor(h/24)+'d '+(h%24)+'h'}
function overdue(it){return it.st==='kho'&&it.ageH>=72}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._x);toast._x=setTimeout(function(){t.classList.remove('show')},2200)}

/* ================= RENDER ================= */
function filtered(){
  var r=ITEMS.filter(function(it){
    if(S.flt!=='all'&&it.st!==S.flt)return false;
    if(!S.kind[it.kind])return false;
    if(S.q&&(it.code+it.desc).toLowerCase().indexOf(S.q.toLowerCase())<0)return false;
    return true;
  });
  r.sort(function(a,b){
    if(S.sort==='new')return a.ageH-b.ageH;
    if(S.sort==='old')return b.ageH-a.ageH;
    return (overdue(b)?1:0)-(overdue(a)?1:0)||b.ageH-a.ageH;
  });
  return r;
}

function board(list){

    });

    h+='<div class="hero"><div class="frame" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#8a93a0">'+ic('camera')+'<span style="font-size:11px;font-weight:600">Chưa có ảnh — chụp tại quầy</span></div></div>';

    h+='<div class="row-in"><input id="billIn" placeholder="SPXVN06000…" autofocus><button class="btn pri" data-confirm>'+ic('check')+'Xác nhận</button></div>'+

function render(){
  var app=document.getElementById('app');
  app.innerHTML='';
  if(S.tab==='danh sách'){
    if(document.body.classList.contains('tA')||document.body.classList.contains('tC'))app.appendChild(side());
    var main=el('<div class="main"></div>');
    main.appendChild(cmd());
    if(document.body.classList.contains('tB'))main.appendChild(kpistrip());
    var list=filtered();
    main.appendChild(toolbar(list.length));
    var bw=el('<div class="boardwrap"></div>');
    bw.appendChild(board(list));
    var bb=S.selMode?batchbar():null;
    if(bb)bw.appendChild(bb);
    main.appendChild(bw);
    if(S.sel!==null)main.appendChild(detail(S.sel));
    app.appendChild(main);
  }else{
    app.appendChild(side());
    var m2=el('<div class="main"></div>');
    m2.appendChild(cmd());
    var ph={backlog:['layers','Backlog','Danh sách đợi đầu ca — port từ tab Backlog hiện tại.'],
            'thanh lý':['recycle','Thanh lý','Lập lô thanh lý, đối soát biên bản — xem mẫu v2.'],
            'in mã':['printer','In Mã','Hàng đợi in mã dán, retry + status máy in.'],
            'góp ý':['chat','Góp ý','Khung góp ý nội bộ cho ca trực.'],
            'quyền':['shield','Quyền truy cập','Phân quyền ADMIN / Staff theo ca.']}[S.tab];
    m2.appendChild(tabph(ph[0],ph[1],ph[2]));

  }
  var mn=mnav();
  if(mn){app.appendChild(mn);app.appendChild(el('<button class="fab" data-new>'+ic('plus')+'</button>'))}
  if(S.sel!==null&&document.getElementById('device').classList.contains('mobile')){
    var d=app.querySelector('.drawer');
    if(d)app.appendChild(d);
  }
  bind();
}

var CRE={kind:'Box',step:1};
function bind(){
  document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;S.sel=null;render()}});
  document.querySelectorAll('[data-flt]').forEach(function(b){b.onclick=function(){S.flt=b.dataset.flt;render()}});
  document.querySelectorAll('[data-kind]').forEach(function(b){b.onclick=function(){S.kind[b.dataset.kind]=!S.kind[b.dataset.kind];render()}});
  var r=document.querySelector('[data-reset]');if(r)r.onclick=function(){S.flt='all';S.kind={Box:true,Item:true};S.q='';S.sort='new';render()};
  var q=document.getElementById('q');
  if(q){q.oninput=function(){S.q=q.value;var pos=q.selectionStart;render();var n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(pos,pos)}}}
  document.querySelectorAll('[data-sort]').forEach(function(s){s.onchange=function(){S.sort=s.value;render()}});
  var rf=document.querySelector('[data-refresh]');if(rf)rf.onclick=function(){toast('Đã cập nhật dữ liệu (mock)')};
  var sm=document.querySelector('[data-selmode]');if(sm)sm.onclick=function(){S.selMode=!S.selMode;S.picks={};render()};
  document.querySelectorAll('[data-card]').forEach(function(c){
    c.onclick=function(e){
      var i=+c.dataset.card;
      if(S.selMode){S.picks[i]=!S.picks[i];render();return}
      if(S.sel===i){S.sel=null;render();return}
      S.sel=i;S.resolving=false;S.hero=0;render();
    };
  });
  var bl=document.querySelector('[data-batchliq]');if(bl)bl.onclick=function(){var n=Object.keys(S.picks).filter(function(k){return S.picks[k]}).length;S.selMode=false;S.picks={};toast('Đã chuyển '+n+' đơn vào lô thanh lý L-24 (mock)');render()};
  var cs=document.querySelector('[data-clearsel]');if(cs)cs.onclick=function(){S.picks={};render()};
  document.querySelectorAll('[data-closed]').forEach(function(b){b.onclick=function(){S.sel=null;S.resolving=false;render()}});
  var hv=document.querySelector('[data-resolve]');if(hv)hv.onclick=function(){S.resolving=true;render();var bi=document.getElementById('billIn');if(bi)bi.focus()};
  var cf=document.querySelector('[data-confirm]');if(cf)cf.onclick=function(){
    var bi=document.getElementById('billIn');var v=(bi&&bi.value.trim())||'SPXVN9999000001A';
    var it=ITEMS[S.sel];it.st='res';it.bill=v;
    it.hist.push({ts:'11/10 '+(new Date()).toTimeString().slice(0,5),k:'res',ev:'Tìm thấy bill',who:'duc.nguyenvan05@spx',bill:v});
    S.resolving=false;toast('Resolve '+it.code);render();
  };
  document.querySelectorAll('[data-hero]').forEach(function(t){t.onclick=function(){S.hero=+t.dataset.hero;render()}});
  document.querySelectorAll('[data-new]').forEach(function(b){b.onclick=openCreate});
  var pr=document.querySelector('[data-print]');if(pr)pr.onclick=function(){toast('Đã xếp hàng in 3 mã dán (mock)')};
  var be=document.querySelector('[data-bell]');if(be)be.onclick=function(){toast('2 đơn vừa vượt quá hạn 72h')};
}

/* ================= GALLERY CHROME ================= */
var NOTES={
  tA:'<b>A — Bright Board.</b> Nền sáng, thẻ ảnh tỷ lệ 4:3 chiếm chủ đạo; mỗi thẻ chỉ hé mã đơn + trạng thái + tuổi tồn, mọi thông tin đầy đủ (ảnh chi tiết, lịch sử, bill, Resolve) hiện trong panel phải khi bấm vào đơn. Sidebar trái là bộ lọc nhanh — phù hợp quầy xử lý ban ngày.',
  tB:'<b>B — Scan Wall.</b> Dark mode cho phòng điều hành ca đêm: ảnh vuông lớn viền dưới màu theo trạng thái, KPI nổi trên cùng, chế độ <i>Chọn</i> tích nhiều đơn để đưa vào lô thanh lý bằng một nút. Panel chi tiết là sheet phủ giữa màn hình.',
  tC:'<b>C — Photo Dossier.</b> Phiếu hồ sơ ảnh: thẻ ảnh 3:2 khổ lớn, khoảng thoáng, nhãn trạng thái như con dấu; rail icon 64px tối giản chrome. Phù hợp xem trên màn 27" khi đối chiếu ảnh với bill giấy.'
};
document.getElementById('themeSeg').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  setTheme(b.dataset.t);
};
function setTheme(t){
  document.body.className=t;
  document.querySelectorAll('#themeSeg button').forEach(function(x){x.classList.toggle('on',x.dataset.t===t)});
  document.getElementById('themeNote').innerHTML=NOTES[t];
  render();
}
document.getElementById('devSeg').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#devSeg button').forEach(function(x){x.classList.toggle('on',x.dataset.d===b.dataset.d)});
  document.getElementById('device').classList.toggle('mobile',b.dataset.d==='mob');
  render();
};
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){var q=document.getElementById('q');if(q){e.preventDefault();q.focus()}}
  if(e.key==='Escape'){document.getElementById('mbg').classList.remove('open');if(S.sel!==null){S.sel=null;render()}}
});
(function init(){
  var hs=(location.hash||'').replace('#','').split('&');
  var t='tA',mob=false,sel=null;
  hs.forEach(function(h){if(/^t[ABC]$/.test(h))t=h;if(h==='mob')mob=true;if(/^sel=\d+$/.test(h))sel=+h.slice(4)});
  if(mob)document.getElementById('device').classList.add('mobile');
  document.querySelectorAll('#devSeg button').forEach(function(x){x.classList.toggle('on',(x.dataset.d==='mob')===mob)});
  if(sel!==null)S.sel=sel;
  setTheme(t);
})();
</script>
</body>
</html>
