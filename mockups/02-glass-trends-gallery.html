<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đơn mất bill — 10 mẫu xu hướng 2026 (Glass) · gallery test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* ============ CHROME CỦA GALLERY (không phải UI app) ============ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0c1220;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.gal{position:sticky;top:0;z-index:9999;background:#0c1220;color:#dce4f2;border-bottom:1px solid #22304a;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12px}
.gal-t{font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#8fd6c1;margin-right:4px;white-space:nowrap}
.gal-sep{width:1px;height:22px;background:#22304a}
.gal-vp{display:flex;gap:4px;background:#141d30;border:1px solid #22304a;border-radius:99px;padding:3px}
.gal-vp button{border:0;background:transparent;color:#9fb0c9;font:inherit;font-weight:700;font-size:11px;padding:5px 11px;border-radius:99px;cursor:pointer}
.gal-vp button.on{background:#2f6df6;color:#fff}
.gal-x{border:1px solid #22304a;background:#141d30;color:#9fb0c9;font:inherit;font-weight:700;font-size:11px;padding:6px 11px;border-radius:8px;cursor:pointer}
.gal-x:hover{color:#fff;border-color:#3a4d70}
.gal-x.on{background:#5b3df6;color:#fff;border-color:#5b3df6}
.gal-note{width:100%;color:#8496b1;font-size:11.5px;line-height:1.55;padding:2px 2px 0}
.gal-note b{color:#e6edf8}
.stage-wrap{padding:14px 14px 26px;display:flex;justify-content:center}
.stage{width:100%;max-width:1440px;height:calc(100vh - 118px);min-height:560px;background:#fff;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.stage[data-vp="tab"]{max-width:960px}
.stage[data-vp="phone"]{max-width:414px}
.stage[data-vp="phone"] .shell{--vp:phone}
.stage[data-vp="tab"] .shell{--vp:tab}
.picks{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 0;justify-content:center}
.pick{border:1px solid #22304a;background:#141d30;color:#c3d0e4;border-radius:10px;padding:8px 11px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;gap:7px;align-items:center;line-height:1.2;text-align:left}
.pick:hover{border-color:#3a4d70;color:#fff}
.pick.on{background:#2f6df6;border-color:#2f6df6;color:#fff}
.pick i{font-style:normal;font-size:14px;opacity:.9}
.pick s{text-decoration:none;display:block;font-weight:600;font-size:10px;opacity:.7}
@media (max-width:760px){.gal{font-size:11px}.stage{height:calc(100vh - 190px)}.picks{gap:6px}}
</style>
<style id="base">
/* ================= NỀN TẢNG LAYOUT (dùng chung 10 mẫu) ================= */
.stage{background:#0e1420}
.shell{
  --ff:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',monospace;
  --bg:#f5f6f9; --card:#fff; --ink:#22303f; --mut:#8d99a8; --line:#e9edf2; --soft:#f2f5f9;
  --pri:#ee4d2d; --pri-ink:#fff; --acc:#172b48; --green:#11b96a; --blue:#3274f7; --amber:#f79009; --red:#e34d4d;
  --navbg:#fff; --navw:250px; --dw:400px; --r:14px; --r-sm:10px; --pad:16px; --gap:12px; --fs:13.5px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --sh-lg:0 18px 48px rgba(16,24,40,.16); --chip:#eef1f6; --grid:repeat(auto-fill,minmax(210px,1fr));
  position:absolute; inset:0; display:flex; background:var(--bg); color:var(--ink); font:400 var(--fs)/1.5 var(--ff); overflow:hidden;
}
.shell *{scrollbar-width:thin}
.shell button:not(.btn){font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.shell input,.shell select,.shell textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;outline:none;min-width:0}
.shell input:focus,.shell select:focus,.shell textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.shell code,.mono{font-family:var(--fm);font-size:.94em}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.body{flex:1 1 auto;min-height:0;display:flex;gap:var(--gap);padding:0 var(--pad) var(--pad)}
.content{flex:1 1 auto;min-width:0;overflow:auto;padding-top:var(--gap);display:flex;flex-direction:column;gap:8px}
.side{flex:none;width:var(--navw);display:flex;flex-direction:column;gap:10px;background:var(--navbg);border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
.side.rail{width:66px;align-items:center;padding:12px 6px}
.drawer{flex:none;width:var(--dw);overflow:auto;background:var(--card);border-left:1px solid var(--line);box-shadow:var(--sh-lg)}
.drawer.wide{width:min(720px,62%)}
.drawer.empty-d{display:flex;align-items:center;justify-content:center;width:var(--dw)}
.dempty{text-align:center;color:var(--mut);padding:40px 24px;font-size:12.5px}
.dempty b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}

/* ---- nút ---- */
.btn{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:12.5px;color:var(--acc);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.16s;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--pri) 40%,var(--line))}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 34%,transparent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sec{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--mut)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--red) 12%,var(--card));border-color:color-mix(in srgb,var(--red) 40%,var(--line));color:var(--red)}
.btn.icon{padding:7px 9px;border-radius:var(--r-sm);font-size:13px}
.btn.mini{padding:4px 9px;font-size:11px;border-radius:8px}
.btn.big{padding:13px 20px;font-size:15px}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.wide{width:100%;justify-content:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}.btnrow.end{justify-content:flex-end}

/* ---- topbar ---- */
.top{flex:none;display:flex;align-items:center;gap:12px;padding:12px var(--pad);background:var(--navbg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ttl b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--acc);white-space:nowrap}
.dark .ttl b{color:var(--ink)}
.ttl s{text-decoration:none;display:block;font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.sbox{flex:1 1 340px;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:2px 6px 2px 12px;box-shadow:var(--sh);max-width:620px;margin:0 auto;transition:.18s}
.sbox:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 14%,transparent)}
.sbox i{color:var(--mut);font-style:normal;font-size:13px}
.sbox input{flex:1;border:0;background:transparent;padding:8px 0;font-weight:600}
.sbox input:focus{box-shadow:none;outline:none}
.sbox kbd{font:700 10px var(--fm);color:var(--mut);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.tacts{display:flex;align-items:center;gap:8px;margin-left:auto}
.me{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 11px var(--ff);flex:none}
.dark .me{background:var(--pri);color:#fff}
.bell{font-size:15px}
.topnav{flex:none;display:flex;gap:4px;padding:0 var(--pad);background:var(--navbg);border-bottom:1px solid var(--line);overflow-x:auto}
.tnv{padding:11px 14px;font-weight:700;font-size:12.5px;color:var(--mut);border-bottom:2.5px solid transparent;white-space:nowrap}
.tnv:hover{color:var(--ink)}
.tnv.on{color:var(--pri);border-bottom-color:var(--pri)}

/* ---- sidebar ---- */
.brand{display:flex;align-items:center;gap:9px;padding:2px 4px 8px;border-bottom:1px solid var(--line)}
.rail .brand{border:0;padding:0;flex-direction:column;gap:6px}
.brand .lg{width:26px;height:20px;color:var(--pri);flex:none}
.brand .bt{min-width:0}.brand b{display:block;font:800 12.5px/1.1 var(--ff);color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dark .brand b{color:var(--ink)}
.brand s{text-decoration:none;font:600 9.5px/1.3 var(--ff);letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}
.tg{margin-left:auto;font-size:11px}
.rail .tg{display:none}
.nav{display:flex;flex-direction:column;gap:3px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);font-weight:700;font-size:12.5px;color:var(--mut);transition:.14s;position:relative}
.nv i{font-style:normal;width:18px;text-align:center;font-size:14px;flex:none}
.nv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .nv span{display:none}
.rail .nv{justify-content:center;width:46px;height:44px}
.nv:hover{background:var(--soft);color:var(--ink)}
.nv.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.nv.on::before{content:'';position:absolute;left:0;top:22%;height:56%;width:3px;border-radius:0 3px 3px 0;background:var(--pri)}
.rail .nv.on::before{left:-6px;width:3px}
.nv .cnt{margin-left:auto;background:var(--pri);color:#fff;font:800 10px var(--fm);padding:1px 6px;border-radius:999px}
.rail .nv .cnt{position:absolute;top:2px;right:0;margin:0;padding:0 4px}
.navgrp{display:flex;flex-direction:column;gap:4px}
.navgrp h5{margin:8px 4px 2px;font:800 9.5px/1 var(--ff);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sfilter{display:flex;flex-direction:column;gap:2px}
.sf{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:12px;font-weight:700;color:var(--mut);text-align:left}
.sf i{width:8px;height:8px;border-radius:3px;background:var(--mut);flex:none}
.sf b{margin-left:auto;font:700 10.5px var(--fm);color:var(--mut)}
.sf:hover{background:var(--soft);color:var(--ink)}
.sf.on{background:var(--acc);color:#fff}.sf.on b{color:#fff}
.sf.c-all i{background:linear-gradient(135deg,var(--pri),var(--blue))}.sf.c-amber i{background:var(--amber)}
.sf.c-green i{background:var(--green)}.sf.c-grey i{background:#9aa5b4}.sf.c-blue i{background:var(--blue)}.sf.c-red i{background:var(--red)}
.sf.on{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pri) 45%,var(--line))}
.sfoot{margin-top:auto;padding:8px 4px;border-top:1px solid var(--line);font-size:11px;font-weight:700;color:var(--acc)}
.dark .sfoot{color:var(--ink)}
.sfoot s{display:block;text-decoration:none;color:var(--mut);font-weight:600;font-size:10.5px}
.railfly{margin-top:auto}

/* ---- tabhead + toolbar ---- */
.tabhead{flex:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 2px 6px;border-bottom:1px solid var(--line)}
.tabhead h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.015em;color:var(--acc)}
.dark .tabhead h2{color:var(--ink)}
.tabhead span{font:700 11px var(--fm);color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent);padding:2px 8px;border-radius:999px}
.tabhead s{text-decoration:none;font-size:11px;color:var(--mut);font-weight:600;margin-left:auto}
.tabhead .lotbadge{font-size:11px;font-weight:800;color:var(--pri)}
.tools{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.tleft{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tright{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:800;color:var(--mut);display:inline-flex;gap:6px;align-items:center;transition:.14s}
.chip b{font:800 10.5px var(--fm);opacity:.75}
.chip:hover{color:var(--ink);border-color:color-mix(in srgb,var(--pri) 40%,var(--line))}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on b{color:#fff}
.chip.c-chua_xu_ly.on{background:var(--amber);border-color:var(--amber);color:#1a1200}
.chip.c-da_tim_bill.on{background:var(--green);border-color:var(--green);color:#04170d}
.chip.c-thanh_ly.on{background:#69788c;border-color:#69788c;color:#fff}
.chip.k.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.clr{background:color-mix(in srgb,var(--pri) 10%,var(--card));border-color:color-mix(in srgb,var(--pri) 35%,var(--line));color:var(--pri)}
.upd{font-size:10.5px;color:var(--mut);font-weight:700;font-family:var(--fm)}
.sortlbl{font-size:11px;color:var(--mut);font-weight:700;display:flex;gap:5px;align-items:center}
.sortlbl select{padding:5px 7px;font-size:11.5px;border-radius:8px}

/* ---- dashboard ---- */
.dashwrap{flex:none}
.dash{display:flex;flex-direction:column;gap:10px;padding:4px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i t" "i v" "i s";gap:0 10px;transition:.16s;box-shadow:var(--sh)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}
.tile .ti{grid-area:i;font-size:0}
.tile .ti::before{content:'●';display:grid;place-items:center;width:30px;height:30px;border-radius:9px;font-size:12px;color:#fff;background:var(--acc)}
.tile.t-ca .ti::before{background:linear-gradient(135deg,var(--pri),#ff8a5c)}
.tile.t-hot .ti::before{content:'⚠';background:var(--red)}
.tile.t-in .ti::before{content:'↓';background:var(--blue)}
.tile.t-res .ti::before{content:'✓';background:var(--green)}
.tile.t-liq .ti::before{content:'⚖';background:#69788c}
.tile.t-print .ti::before{content:'🖨';font-size:13px;background:var(--acc)}
.tile.t-fb .ti::before{content:'💬';font-size:13px;background:#7c5cff}
.tile.t-bl .ti::before{content:'▤';background:#2a9d8f}
.tile b{grid-area:t;font-size:10.5px;font-weight:700;color:var(--mut);letter-spacing:.01em}
.tile strong{grid-area:v;font:800 19px/1.15 var(--fm);color:var(--acc);letter-spacing:-.02em}
.dark .tile strong{color:var(--ink)}
.tile s{grid-area:s;display:block;margin-top:2px;font-size:10px;color:var(--mut);font-weight:600;text-decoration:none}
.dbottom{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.chart,.live,.agesum{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh);overflow:hidden}
.ch-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ch-h b{font-size:12px;font-weight:800;color:var(--acc)}.dark .ch-h b{color:var(--ink)}
.ch-h span{margin-left:auto;font:700 10px var(--fm);color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:3px;height:64px}
.bar{flex:1;height:100%;display:flex;align-items:flex-end;background:var(--soft);border-radius:5px;overflow:hidden;transition:.14s}
.bar i{display:block;width:100%;background:linear-gradient(180deg,var(--pri),color-mix(in srgb,var(--pri) 40%,var(--card)));border-radius:4px 4px 0 0;transition:height .3s}
.bar:hover{transform:scaleY(1.06)}.bar:hover i{background:var(--acc)}
.bar.on i{background:var(--green)}
.axis{display:flex;justify-content:space-between;margin-top:4px;font:700 9px var(--fm);color:var(--mut)}
.live{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow:auto}
.lv{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:8px;font-size:11px;text-align:left;transition:.12s}
.lv:hover{background:var(--soft)}.lv i{font-style:normal;font:700 10px var(--fm);color:var(--mut)}
.lv b{color:var(--pri);font-size:10.5px}.lv span{font-family:var(--fm);font-size:10px;color:var(--ink);font-weight:700}
.lv em{margin-left:auto;font-style:normal;color:var(--mut);font-size:10px}
.kv{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv b{font:800 13px var(--fm);color:var(--pri)}
.mset{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.hm{display:flex;align-items:center;gap:6px;font-size:10.5px}
.hm s{text-decoration:none;flex:none;width:64px;color:var(--mut);font-weight:700}
.hm i{height:14px;background:linear-gradient(90deg,var(--pri),#ffb08a);border-radius:4px;min-width:6px}
.hm b{margin-left:auto;font:800 11px var(--fm);color:var(--ink)}

/* ---- lưới card ---- */
.grid{display:grid;grid-template-columns:var(--grid);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);transition:.18s;display:flex;flex-direction:column;text-align:left}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}
.card.on{border-color:var(--pri);box-shadow:0 0 0 2px color-mix(in srgb,var(--pri) 30%,transparent),var(--sh-lg)}
.thumb{position:relative;aspect-ratio:1/1;background:var(--soft);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
.card:hover .thumb img{transform:scale(1.05)}
.noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--mut)}
.badge{position:absolute;top:7px;left:7px;background:rgba(23,43,72,.86);color:#fff;font:800 9px/1 var(--ff);letter-spacing:.04em;padding:4px 7px;border-radius:6px;backdrop-filter:blur(4px)}
.badge.kind{left:7px}
.badge.sync{left:auto;right:7px;background:color-mix(in srgb,var(--blue) 85%,#000);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
.age{position:absolute;top:7px;right:7px;font:800 9.5px/1 var(--fm);padding:4px 6px;border-radius:6px;background:var(--green);color:#04170d;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.age.mid{background:#ffd766;color:#3a2b00}.age.warn{background:var(--amber);color:#fff}.age.hot{background:var(--red);color:#fff}
.age.na{background:rgba(120,132,148,.9);color:#fff}
.cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.code{font:800 12px/1.2 var(--fm);color:var(--acc);letter-spacing:-.02em}
.dark .code{color:var(--ink)}
.desc{margin:0;font-size:11.5px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.cmeta{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;color:var(--mut);margin-top:auto;flex-wrap:wrap}
.cmeta .bill{font-family:var(--fm);color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent);padding:1px 5px;border-radius:5px}
.cmeta .when{margin-left:auto;font-family:var(--fm)}
.st{font:800 9.5px/1 var(--ff);letter-spacing:.03em;padding:4px 7px;border-radius:999px;text-transform:uppercase}
.st .spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.st-amber{background:color-mix(in srgb,var(--amber) 16%,var(--card));color:#8a4b00}
.st-green{background:color-mix(in srgb,var(--green) 16%,var(--card));color:#0a6b3d}
.st-grey{background:#eef1f5;color:#59677b}
.st-blue{background:color-mix(in srgb,var(--blue) 14%,var(--card));color:#1c4fb8}
.st-red{background:color-mix(in srgb,var(--red) 14%,var(--card));color:#a12222}
.dark .st-amber{color:#ffcf8a}.dark .st-green{color:#7ff0b5}.dark .st-grey{color:#c3cbd6;background:#2a3444}
.dark .st-blue{color:#9dc2ff}.dark .st-red{color:#ffb4b4}

/* ---- danh sách dòng ---- */
.rows{display:flex;flex-direction:column;gap:4px}
.rowx{display:grid;grid-template-columns:44px minmax(120px,2.4fr) 46px 96px 54px 116px 90px auto;gap:9px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;transition:.14s;cursor:pointer}
.rowx:hover{border-color:color-mix(in srgb,var(--pri) 45%,var(--line));box-shadow:var(--sh)}
.rowx.on{border-color:var(--pri);box-shadow:inset 3px 0 0 var(--pri);background:color-mix(in srgb,var(--pri) 5%,var(--card))}
.rthumb img{width:44px;height:44px;border-radius:7px;object-fit:cover;display:block;border:1px solid var(--line)}
.rmain{min-width:0}.rmain b{display:block;font:800 12px/1.3 var(--fm);color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dark .rmain b{color:var(--ink)}
.rmain em{display:block;font-style:normal;font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain i{font-style:normal;color:var(--mut)}
.rkind,.rwhen,.rwho{font:700 10.5px var(--fm);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rage .age{position:static}.rage{display:flex}
.rst{white-space:nowrap}.ract{display:flex;gap:5px;justify-content:flex-end}

/* ---- bảng đặc ---- */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100% - 8px);box-shadow:var(--sh)}
.tblwrap.wide{max-height:none;flex:1}
.shell table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;table-layout:auto}
.shell thead th{position:sticky;top:0;z-index:3;background:var(--soft);text-align:left;padding:9px 10px;font:800 10.5px/1.2 var(--ff);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
  border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.shell thead th:hover{color:var(--pri)}
.shell thead th i{font-style:normal;margin-left:5px;color:var(--pri);font-size:10px}
.shell tbody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.shell tbody tr{cursor:pointer;transition:.1s}
.shell tbody tr:hover{background:color-mix(in srgb,var(--pri) 5%,transparent)}
.shell tbody tr.on{background:color-mix(in srgb,var(--pri) 9%,transparent);box-shadow:inset 3px 0 0 var(--pri)}
td.mono{font-family:var(--fm);font-size:11.5px}
td.b{font-weight:800;color:var(--acc)}.dark td.b{color:var(--ink)}
td.desc{white-space:normal;min-width:220px}
td.desc .micro img{width:26px;height:26px;border-radius:5px;object-fit:cover;vertical-align:middle;margin-right:7px;border:1px solid var(--line)}
td.desc em{font-style:normal;color:var(--mut);font-size:11px}
td .age{position:static;display:inline-block}
.agecell{display:inline-flex;align-items:center;gap:5px;font:800 10.5px var(--fm)}
.agecell i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.agecell.mid i{background:#ffd766}.agecell.warn i{background:var(--amber)}.agecell.hot i{background:var(--red)}.agecell.na i{background:#9aa5b4}
.actcell{display:flex;gap:5px;justify-content:flex-end}
tfoot td{padding:9px 10px;background:var(--soft);font-weight:800;font-size:11.5px;color:var(--acc);border-top:2px solid var(--pri)}
.dark tfoot td{color:var(--ink)}
.pager{flex:none;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:700;box-shadow:var(--sh);position:sticky;bottom:6px;z-index:6;margin-top:8px}
.pager .rng{margin-right:auto;font-family:var(--fm);color:var(--mut)}.pager .rng b{color:var(--pri)}
.pager .pg{min-width:30px;justify-content:center}
.pager .pg.cur{background:var(--acc);border-color:var(--acc);color:#fff}
.empty{padding:34px 16px;text-align:center;color:var(--mut);font-size:12px;font-weight:700;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.skelwrap{display:grid;grid-template-columns:var(--grid);gap:10px}
.skel{height:150px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);background-size:400% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-400% 0}}
/* ================= MỞ ĐẦU KHỐI COMP ================= */
/* ================= CHI TIẾT + TAB CHỨC NĂNG ================= */
.dwrap{display:flex;flex-direction:column;gap:12px;padding:14px}
.dhead{display:flex;align-items:flex-start;gap:10px;position:sticky;top:-14px;margin:-14px -14px 0;padding:14px;background:var(--card);border-bottom:1px solid var(--line);z-index:4}
.dtit{min-width:0}.dcode{display:block;font:800 15px/1.2 var(--fm);color:var(--acc);letter-spacing:-.03em;overflow-wrap:anywhere}
.dark .dcode{color:var(--ink)}
.dsub{display:flex;gap:6px;margin-top:5px;align-items:center}.dsub .age{position:static}
.dacts{display:flex;gap:5px;margin-left:auto;flex:none}
.dsec{display:flex;flex-direction:column;gap:6px}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pics figure{margin:0;position:relative;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:var(--soft);aspect-ratio:1/1}
.pics img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}
.pics figure:hover img{transform:scale(1.07)}
.pics figcaption{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;font:700 9.5px/1 var(--ff);color:#fff;background:linear-gradient(180deg,transparent,rgba(10,16,24,.8))}
.no-photo{grid-column:1/-1;padding:26px;text-align:center;color:var(--mut);font-size:11.5px;font-weight:700;background:var(--soft);border-radius:var(--r-sm)}
.dinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px 12px;margin:0;background:var(--soft);border-radius:var(--r-sm);padding:9px 11px}
.dinfo>div{padding:4px 0;min-width:0}
.dinfo dt{font:800 9.5px/1.4 var(--ff);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.dinfo dd{margin:2px 0 0;font-size:12px;font-weight:600;color:var(--ink);word-break:break-word}
.dinfo dd.hl{color:var(--green);font-family:var(--fm);font-weight:800}
.dinfo dd s{text-decoration:none;color:var(--mut);font-weight:600}
.dinfo.slim{grid-template-columns:1fr 1fr}
.resolve{display:flex;flex-direction:column;gap:6px}
.rline{display:flex;gap:7px;align-items:center}
.rline input{flex:1;padding:11px 13px;font-family:var(--fm);font-weight:700;letter-spacing:.02em;border-width:1.5px;border-color:color-mix(in srgb,var(--green) 45%,var(--line));background:color-mix(in srgb,var(--green) 6%,var(--card))}
.rline input:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 20%,transparent)}
.hint{margin:0;font-size:10.5px;color:var(--mut);font-weight:600;line-height:1.45}
.done-line{padding:11px 13px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--green) 12%,var(--card));border:1px solid color-mix(in srgb,var(--green) 35%,var(--line));font-size:12px;font-weight:700;color:#0a6b3d}
.dark .done-line{color:#7ff0b5}
.done-line b{font-family:var(--fm)}
.tl{display:flex;flex-direction:column;min-height:220px}
.tl h4{margin:0 0 7px;font:800 10.5px/1 var(--ff);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;gap:7px;align-items:center}
.tl h4 span{font-family:var(--fm);color:var(--pri)}
.tlscroll{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px;max-height:340px}
.evt{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;padding:7px 0;border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.evt .dot{display:block;width:10px;height:10px;border-radius:50%;margin:4px 0 0 2px;background:var(--mut);box-shadow:0 0 0 3px var(--card)}
.evt:first-child .dot{box-shadow:0 0 0 3px var(--card),0 0 0 5px color-mix(in srgb,var(--pri) 30%,transparent)}
.dot.d-amber{background:var(--amber)}.dot.d-grey{background:#9aa5b4}
.dot.d-blue{background:var(--blue)}.dot.d-red{background:var(--red)}.dot.d-green{background:var(--green)}
.evb{min-width:0;grid-column:2;grid-row:1}.evb b{display:block;font-size:12px;color:var(--ink)}
.evb span{display:block;font:700 10.5px var(--fm);color:var(--mut)}
.evb em{display:block;font-style:normal;font-size:10.5px;color:var(--mut);overflow-wrap:anywhere}
.evb em.edit{color:var(--blue);font-family:var(--fm);font-size:10px}
.evb u{text-decoration:none;display:inline-block;margin-top:3px;font-family:var(--fm);font-size:10.5px;font-weight:800;color:var(--green);background:color-mix(in srgb,var(--green) 13%,transparent);padding:2px 6px;border-radius:5px}
.evb r{display:block;margin-top:3px;font-size:10.5px;color:var(--amber);font-weight:700}
.dfoot{margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
.d-sheet{position:absolute;left:0;right:0;bottom:0;top:auto;width:min(640px,94%);margin:0 auto;max-height:86%;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;z-index:60;animation:up .28s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(100%)}}
.d-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,92%);max-height:88%;border-radius:var(--r);border:1px solid var(--line);z-index:60;box-shadow:var(--sh-lg)}
.ovbg{position:absolute;inset:0;background:rgba(9,14,22,.5);backdrop-filter:blur(3px);z-index:55;animation:fade .2s}
@keyframes fade{from{opacity:0}}

/* ================= WALL / HEATMAP ================= */
.wall{display:flex;flex-direction:column;gap:12px}
.heat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.heat h4,.wallq h4{margin:0 0 9px;font:800 11px/1 var(--ff);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.hcwrap{display:flex;gap:5px;flex-wrap:wrap}
.hc{position:relative;width:64px;padding:8px 6px 16px;border-radius:9px;border:1px solid var(--line);background:var(--soft);text-align:center;transition:.14s;overflow:hidden}
.hc i{position:absolute;inset:0;background:var(--pri);z-index:0}
.hc b{position:relative;z-index:2;display:block;font:800 15px/1 var(--fm);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.hc s{text-decoration:none;position:relative;z-index:2;display:block;font:800 8.5px/1.3 var(--ff);color:#ffd9d0}
.hc u{text-decoration:none;position:absolute;bottom:2px;left:0;right:0;font:700 8px var(--fm);color:var(--mut)}
.hc:hover{transform:translateY(-2px);border-color:var(--pri)}
.wallq{display:flex;flex-direction:column;gap:8px}

/* ================= SCAN DECK ================= */
.deck{display:flex;flex-direction:column;gap:10px}
.reticle{position:relative;height:min(260px,34vh);border-radius:var(--r);background:#0b1017 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><path d="M0 39.5h40" stroke="%2322303f" stroke-width="1"/></svg>');border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;cursor:crosshair}
.reticle .frame{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:66%;height:56%;border:2px solid rgba(255,255,255,.35);border-radius:12px;
  box-shadow:0 0 0 9999px rgba(6,10,16,.42)}
.reticle .laser{position:absolute;left:17%;right:17%;height:2px;background:linear-gradient(90deg,transparent,#ff4d4d,transparent);animation:scan 1.9s ease-in-out infinite;top:44%}
@keyframes scan{50%{transform:translateY(52px)}}
.reticle p{position:absolute;bottom:52px;font-size:10.5px;color:#8fa3bd;font-weight:700;letter-spacing:.04em}
.deckin{position:absolute;left:8%;right:8%;bottom:10px;background:rgba(255,255,255,.09);border:1.5px solid #2f4360;color:#eaf2ff;font-family:var(--fm);font-weight:700;border-radius:10px;padding:9px 12px}
.deckin:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.strip span{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:10.5px;font-weight:700;cursor:pointer}
.strip span b{font-family:var(--fm);color:var(--ink)}.strip span i{font-style:normal;color:var(--mut);margin-left:6px}
.strip .mute{color:var(--mut);font-weight:600;flex:none;border:1px dashed var(--line)}
.deckq h4{margin:0;font:800 11px/1 var(--ff);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);display:flex;gap:8px}
.deckq h4 s{text-decoration:none;margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.deckq{display:flex;flex-direction:column;gap:4px}

/* ================= FEED ================= */
.feed{display:flex;flex-direction:column;gap:10px}
.fgrp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.fgrp>header{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
.fgrp>header b{font:800 12px var(--fm);color:var(--acc)}.dark .fgrp>header b{color:var(--ink)}
.fgrp>header span{font-size:11px;font-weight:700;color:var(--pri)}
.fgrp>header s{text-decoration:none;margin-left:auto;font-size:10.5px;color:var(--mut)}
.fitem{display:grid;grid-template-columns:12px 1fr;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;position:relative}
.fitem:hover{background:color-mix(in srgb,var(--pri) 5%,transparent)}
.fitem i{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--green)}
.fitem>div{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.fitem b{font-size:12px;color:var(--ink)}
.fitem span{font:700 11px var(--fm);color:var(--pri)}
.fitem u{text-decoration:none;font-family:var(--fm);font-size:10.5px;color:var(--green)}
.fitem em{margin-left:auto;font-style:normal;font-size:10px;color:var(--mut);font-family:var(--fm)}
.fitem footer{grid-column:2;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);margin-top:2px}
.micro img{width:22px;height:22px;border-radius:5px;object-fit:cover;border:1px solid var(--line);vertical-align:middle}

.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font:800 10px/1 var(--ff);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.fld>span s{text-decoration:none;color:var(--pri);text-transform:none;letter-spacing:0;font-weight:700}
.fld.big input{padding:16px;font-size:17px;font-family:var(--fm);font-weight:800;border-width:2px}
/* ================= CREATE / LIQ / PRINT / FB / ROLE ================= */
.pane{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px}
.pane h3{margin:0;font-size:14px;font-weight:800;color:var(--acc)}.dark .pane h3{color:var(--ink)}
.pane h4{margin:0;font:800 11px/1 var(--ff);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:flex;gap:8px;align-items:center}
.pane h4 span{font-family:var(--fm);color:var(--pri);text-transform:none;letter-spacing:0}
.crumbs{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;color:var(--mut);flex-wrap:wrap}
.crumbs b{color:var(--ink);background:var(--soft);padding:4px 10px;border-radius:999px}.crumbs b:first-child{color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.kindseg{display:flex;gap:8px}
.seg{flex:1;border:1.5px solid var(--line);background:var(--soft);border-radius:var(--r-sm);padding:13px;font-weight:800;font-size:13px;color:var(--mut);text-align:left;transition:.15s}
.seg:hover{border-color:var(--pri);color:var(--ink)}
.seg.on{background:color-mix(in srgb,var(--pri) 10%,var(--card));border-color:var(--pri);color:var(--pri);box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 18%,transparent)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}
.coderow{display:flex;gap:7px;align-items:center}
.coderow code{flex:1;background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:9px 11px;font-weight:800;color:var(--acc);font-size:13px}
.dark .coderow code{color:var(--ink)}
.shots2{display:flex;flex-direction:column;gap:7px}
.shotrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.shotrow.sq{grid-template-columns:repeat(3,1fr)}
.shot{position:relative;aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--soft)}
.shot.has{border-style:solid;border-color:var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot s{text-decoration:none;position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;font:700 9.5px var(--ff);color:#fff;background:linear-gradient(180deg,transparent,rgba(10,16,24,.8))}
.shot .del{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(10,16,24,.75);color:#fff;font-size:11px;display:grid;place-items:center}
.shot .add{width:100%;height:100%;display:grid;place-content:center;gap:3px;color:var(--mut)}
.shot .add b{font-size:22px;font-weight:400}.shot .add s{text-decoration:none;position:static;background:none;color:var(--mut);font-size:10px}
.warnline{margin:0;font-size:11px;font-weight:700;color:var(--amber)}
.errline{margin:0;font-size:11.5px;font-weight:800;color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent);border:1px solid color-mix(in srgb,var(--red) 32%,var(--line));border-radius:8px;padding:8px 10px}
.scanrow{display:flex;gap:8px;align-items:center}
.scanrow input{flex:1;font-family:var(--fm);font-weight:700;padding:11px 13px;border-width:1.5px}
.scanrow input.req{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 6%,var(--card))}
.lot table{font-size:12px}.lot td,.lot th{border-bottom:1px solid var(--line);padding:7px 9px}
.scanlog{margin:8px 0 0;font:700 11px var(--fm);color:var(--green)}
.backrow{display:flex;align-items:center;gap:10px}
.lotcount{margin-left:auto;font-size:12px;font-weight:800;color:var(--pri)}
.prev{background:var(--soft);border:1px dashed var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:12px;font-weight:700;color:var(--ink)}
.prev p{margin:6px 0 0;font-weight:600;color:var(--mut);font-size:11px}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.pc{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:9px;background:var(--soft)}
.pc h4{margin:0;font-size:12.5px;font-weight:800;color:var(--ink);text-transform:none;letter-spacing:0}
.pc p{margin:0;font-size:11px;color:var(--mut);line-height:1.45}
.sw{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--mut)}
.bulkrow{display:flex;gap:7px}.bulkrow select{width:88px}.bulkrow input{width:64px;text-align:center;font-family:var(--fm)}
.prevcodes{display:flex;gap:5px;flex-wrap:wrap;font-size:10px}.prevcodes code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.station{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:11px}
.station b{font-family:var(--fm);color:var(--pri)}
.qh{margin-top:4px}.qh span{margin-left:auto;font-weight:600;color:var(--mut);text-transform:none;letter-spacing:0;font-family:var(--fm)}
.qtbl{border:1px solid var(--line);border-radius:var(--r-sm);overflow:auto}
.qst{font:800 9.5px/1 var(--ff);padding:4px 7px;border-radius:999px;text-transform:uppercase}
.qst-pending{background:color-mix(in srgb,var(--amber) 18%,var(--card));color:#8a4b00}
.qst-printing{background:color-mix(in srgb,var(--blue) 16%,var(--card));color:#1c4fb8;animation:pulse 1.2s infinite}
.qst-done{background:color-mix(in srgb,var(--green) 16%,var(--card));color:#0a6b3d}
.qst-failed{background:color-mix(in srgb,var(--red) 16%,var(--card));color:#a12222}
tr.q-failed .mono{color:var(--red)}
.qtbl s{text-decoration:none;color:var(--red);font-size:10px}
.printarea{display:flex;flex-direction:column;gap:9px}
.psheet{border:1.5px dashed var(--pri);border-radius:var(--r);padding:12px;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--pri) 4%,transparent) 0 12px,transparent 12px 24px)}
.pbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pbar b{font-size:12px;font-weight:800;color:var(--pri)}
.plabels{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
.lbl{width:2.7in;min-height:1.35in;background:#fff;border:1px solid #d5d9e0;border-radius:8px;padding:8px;display:flex;gap:9px;align-items:center;box-shadow:var(--sh)}
.lbl svg{flex:none}
.lbl .ltxt{min-width:0}.lbl b{display:block;font:800 11px/1.25 var(--fm);color:#101820;word-break:break-all}
.lbl s{display:block;text-decoration:none;font:600 8.5px/1.35 var(--ff);color:#5b6572;margin-top:2px}
.lbl u{display:block;text-decoration:none;font:700 7.5px var(--fm);color:#8d99a8;margin-top:3px}
.lbl.sm{width:1.6in;min-height:1in;padding:6px}
/* Backlog */
.bl{gap:8px}
.bl-meta{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:11px;background:var(--soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 11px}
.bl-meta .upd b,.bl-meta .cnt b{color:var(--pri);font-family:var(--fm)}
.bl-meta .cnt{margin-left:auto;white-space:nowrap}.bl-meta .subnote{color:var(--mut);font-weight:600;font-size:10px}
.bl-search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--pri) 35%,var(--line));border-radius:999px;padding:3px 5px 3px 12px;max-width:680px;margin:0 auto;width:100%}
.bl-search input{flex:1;border:0;background:transparent;text-align:center;font-weight:700}
.bl-search input:focus{box-shadow:none}
.colbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.colg{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:700;color:var(--mut)}
.coln{font-family:var(--fm);color:var(--pri);min-width:44px;text-align:center}
.colbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;color:var(--acc)}
.dark .colbtn{color:var(--ink)}
.colbtn.open{border-color:var(--pri);color:var(--pri);background:color-mix(in srgb,var(--pri) 9%,transparent)}
.scrollrow{display:flex;gap:7px;flex:1;min-width:0;overflow-x:auto;padding:2px 2px 4px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;min-width:120px}
.dark .pill{color:var(--ink)}
.bltbl td.num{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums;font-weight:700}
.bltbl th:first-child,.bltbl td:first-child{position:sticky;left:0;background:var(--card);z-index:2;border-right:1px solid var(--line)}
.bltbl thead th:first-child{z-index:5;background:var(--soft)}
.bltbl td.sid{font-family:var(--fm);font-weight:800;color:var(--pri);white-space:nowrap}
.bltbl tbody tr:hover td:first-child{background:color-mix(in srgb,var(--pri) 7%,var(--card))}
.ageb{position:relative;font:700 10.5px var(--fm);padding-left:9px}
.ageb::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:2px;background:var(--green)}
.ageb.a1::before{background:#ffd766}.ageb.a2::before{background:var(--amber)}.ageb.a3::before{background:var(--red)}
.bstat{font:800 9.5px/1 var(--ff);padding:4px 7px;border-radius:6px;background:var(--soft);color:var(--mut);white-space:nowrap}
.bl-drawer{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:9px}
.bl-drawer h4{display:flex;align-items:center;gap:9px}
.bl-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 14px;font-size:11.5px;max-height:190px;overflow:auto}
.bl-kv div{display:flex;justify-content:space-between;gap:9px;border-bottom:1px dashed var(--line);padding:4px 0}
.bl-kv b{color:var(--mut);font:800 9.5px var(--ff);letter-spacing:.05em;text-transform:uppercase;flex:none}
.bl-kv span{overflow-wrap:anywhere;text-align:right}
/* Feedback */
.chat{display:flex;flex-direction:column;gap:9px;max-height:52vh;overflow:auto;padding-right:4px}
.msg{background:var(--soft);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:9px 12px;max-width:78%}
.msg.mine{align-self:flex-end;border-radius:14px 14px 4px 14px;background:color-mix(in srgb,var(--pri) 10%,var(--card));border-color:color-mix(in srgb,var(--pri) 30%,var(--line))}
.msg.adm{align-self:flex-end;border-radius:14px 14px 4px 14px;background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.msg .meta{display:flex;gap:8px;align-items:baseline;margin-bottom:3px}
.msg .meta b{font-size:11.5px;color:var(--pri)}
.msg.adm .meta b{color:var(--acc)}.dark .msg.adm .meta b{color:#9dc2ff}
.msg .meta span{font:700 9.5px var(--fm);color:var(--mut);margin-left:auto}
.msg p{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink)}
.rep{margin-top:7px;padding:7px 9px;border-left:2.5px solid var(--green);background:color-mix(in srgb,var(--green) 8%,var(--card));border-radius:0 8px 8px 0;font-size:11.5px}
.rep b{color:#0a6b3d;font-size:11px}.dark .rep b{color:#7ff0b5}
.rep span{float:right;font:700 9.5px var(--fm);color:var(--mut)}
.rep p{margin:3px 0 0}
.replyrow,.composer{display:flex;gap:7px;align-items:center}
.replyrow{margin-top:7px}.replyrow input{flex:1;font-size:11.5px;padding:7px 10px}
.composer{padding-top:8px;border-top:1px solid var(--line)}
.composer input{flex:1;padding:11px 13px}
.fbtn{min-height:92px;resize:vertical}
/* Role */
.whoami{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;background:var(--soft);border:1px dashed var(--line);border-radius:var(--r-sm);padding:9px 12px}
.whoami b{font-family:var(--fm);color:var(--pri)}
.role{font:800 9.5px/1 var(--ff);padding:4px 8px;border-radius:6px}
.r-ADMIN{background:color-mix(in srgb,var(--pri) 15%,var(--card));color:var(--pri)}
.r-STAFF{background:var(--soft);color:var(--mut)}
.addrow{display:flex;gap:8px}.addrow input{flex:1;font-family:var(--fm)}
.tools2{display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.rolelog{font:700 11px var(--fm);color:var(--green)}
tr s{text-decoration:none;color:var(--mut);font-size:10px}

/* ================= OVERLAY ================= */
.ov{position:absolute;inset:0;z-index:80;display:none;place-items:center;background:rgba(9,14,22,.58);backdrop-filter:blur(4px);padding:18px}
.ov.show{display:grid;animation:fade .18s}
.sheetbox{width:min(560px,96%);max-height:92%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);padding:14px}
.sheetbox.wideb{width:min(860px,98%)}
.sheetbox>header{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:11px;border-bottom:1px solid var(--line)}
.sheetbox>header b{font-size:13.5px;font-weight:800;color:var(--ink)}
.sheetbox>header .btn{margin-left:auto}
.emgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
.emcol{display:flex;flex-direction:column;gap:9px;min-width:0}
.lbl-t{font:800 10px/1 var(--ff);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.cam{position:relative;height:min(300px,42dvh);border-radius:var(--r);background:#0a0f16;overflow:hidden;display:grid;place-items:center}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam p{position:relative;z-index:3;font-size:11px;color:#94a7c0;font-weight:700;text-align:center;padding:0 20px}
.cam .cf{position:absolute;width:26px;height:26px;border:2.5px solid var(--pri);z-index:2}
.cam .f1{left:12%;top:22%;border-right:0;border-bottom:0}.cam .f2{right:12%;top:22%;border-left:0;border-bottom:0}
.cam .f3{left:12%;bottom:22%;border-right:0;border-top:0}.cam .f4{right:12%;bottom:22%;border-left:0;border-top:0}
.cam .laser{position:absolute;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,#ff5b5b,transparent);z-index:2;animation:scan 1.8s ease-in-out infinite}
.scanbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.scanman{display:flex;gap:8px;margin-top:9px}
.scanman input{flex:1;font-family:var(--fm)}
.lb{background:rgba(4,7,12,.93)}
.lbbox{max-width:min(1000px,96%);display:flex;flex-direction:column;gap:10px;align-items:center}
.lbbox img{max-height:70vh;border-radius:10px;transition:transform .2s}
.lbbar{display:flex;align-items:center;gap:8px;color:#dbe4f0;font-size:11.5px;font-weight:700}
.lbbar b{font-family:var(--fm);margin-right:8px}
.lbbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.palbox{width:min(600px,94%);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);overflow:hidden;align-self:flex-start;margin-top:6vh}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px 16px;font-size:14px;font-weight:700}
.palbox input:focus{box-shadow:none}
.pallist{max-height:46vh;overflow:auto;padding:7px}
.cmd{display:flex;width:100%;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink);text-align:left}
.cmd:hover,.cmd.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.cmd s{text-decoration:none;margin-left:auto;font-family:var(--fm);color:var(--mut);font-size:10px}
.phint{margin:0;padding:8px 12px;border-top:1px solid var(--line);font-size:10px;color:var(--mut);font-weight:700}
.introbox{width:min(520px,94%);background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.introbox>header{display:flex;align-items:center}.introbox>header b{font-size:14px;font-weight:800}.introbox>header .btn{margin-left:auto}
.istep{display:grid;grid-template-columns:auto 1fr;gap:11px}
.istep i{width:30px;height:30px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font:800 13px var(--ff)}
.istep b{display:block;font-size:12.5px;color:var(--ink)}
.istep p{margin:2px 0 0;font-size:11.5px;color:var(--mut);line-height:1.5}
.toasts{position:absolute;right:14px;bottom:14px;z-index:120;display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:none}
.tst{background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:9px 13px;border-radius:10px;box-shadow:var(--sh-lg);animation:up2 .22s;max-width:340px}
.tst-err{background:var(--red)}.tst-ok{background:#0a7d47}
@keyframes up2{from{transform:translateY(10px);opacity:0}}

/* ================= MOBILE ================= */
.shell.mob{--pad:10px;--gap:8px;--fs:13px}
.shell.mob .side{display:none}
.shell.mob .body{padding:0 var(--pad) 68px}
.shell.mob .content{gap:7px}
.shell.mob .grid{grid-template-columns:repeat(2,1fr);gap:8px}
.shell.mob .tiles{grid-template-columns:repeat(2,1fr)}
.shell.mob .dbottom{grid-template-columns:1fr}
.shell.mob .rowx{grid-template-columns:40px 1fr auto;gap:8px}
.shell.mob .rowx .rkind,.shell.mob .rowx .rwhen,.shell.mob .rowx .rwho,.shell.mob .rowx .rage,.shell.mob .rowx .rst{display:none}

.shell.mob .wiz{grid-template-columns:1fr}
.shell.mob .top{flex-wrap:wrap;gap:8px;padding:9px var(--pad)}
.shell.mob .sbox{order:3;flex:1 1 100%}
.shell.mob .tacts .no{display:none}
.shell.mob .mob-hide{}
/* Mobile: panel drawer/inline luôn tràn màn → chuyển thành sheet đáy, không ép 2 cột */
.shell.mob .drawer{position:absolute;left:0;right:0;top:auto;bottom:0;width:auto;max-height:86%;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;z-index:60;box-shadow:var(--sh-lg);animation:up .28s cubic-bezier(.22,1,.36,1)}
.shell.mob .drawer.empty-d{display:none}
.shell.mob .d-modal{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:92%;border-radius:22px 22px 0 0;border-bottom:0}
.shell.mob .pager{position:static;margin-top:6px}
.shell.mob .tabhead s{display:none}
.bnav{flex:none;display:none;justify-content:space-around;align-items:center;background:var(--navbg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));position:absolute;left:0;right:0;bottom:0;z-index:40;backdrop-filter:blur(12px)}
.shell.mob .bnav{display:flex}
.bn{display:flex;flex-direction:column;gap:2px;align-items:center;padding:5px 10px;border-radius:12px;color:var(--mut);font-size:9.5px;font-weight:700}
.bn i{font-style:normal;font-size:17px}
.bn.on{color:var(--pri)}
.bn.fab{background:var(--pri);color:#fff;width:50px;height:50px;border-radius:50%;margin-top:-22px;box-shadow:0 8px 20px color-mix(in srgb,var(--pri) 45%,transparent);display:grid;place-items:center}
.bn.fab i{font-size:24px}

@media (max-width:1100px){.sbox kbd{display:none}.top{gap:10px}.tacts{gap:6px}}
/* ================= IN TEM ================= */
@media print{
  .gal,.picks{display:none!important}
  body{background:#fff}
  .stage-wrap{padding:0}.stage{max-width:none;height:auto;box-shadow:none;border-radius:0}
  .shell{position:static;background:#fff;color:#000;height:auto;overflow:visible}
  .shell>*{display:none!important}
  .shell .printarea{display:block!important}
  .printarea .pbar,.printarea .btn{display:none!important}
  .printarea .psheet{border:0;background:none;padding:0}
  .printarea .plabels{display:block}
  .printarea .lbl{width:4in;height:2in;box-shadow:none;border:1px solid #000;border-radius:0;margin:0 0 4px;page-break-inside:avoid}
  .printarea .lbl b{font-size:30px!important}
  @page{size:4in 6in portrait;margin:.1in}
}
/* ================= MỞ ĐẦU KHỐI SKINS ================= */
/* =====================================================================
   10 MẪU XU HƯỚNG 2026 — tất cả đội chung bộ màu Glass Float của repo:
   mesh pastel (#dfe4ff/#ffe3f1/#d9f8ef trên #eef1fb) + kính trắng
   rgba(255,255,255,.62) blur 16 + viền trắng .8 + cam #ee4d2d + navy
   #172b48 + bo góc 16/24 + Be Vietnam Pro 800 + IBM Plex Mono cho mã.
   ===================================================================== */

/* ---------- BỘ TOKEN CHUNG (copy từ :root trong index.html) ---------- */
.shell{--o:#ee4d2d;--tint:#fff5f0;--navy:#172b48;--ink2:#303844;--mut2:#97a0ad;
  --glass:rgba(255,255,255,.62);--glass-hi:rgba(255,255,255,.85);--glass-line:rgba(255,255,255,.8);
  --glass-blur:16px;--r-md:16px;--r-lg:24px;--glass-sh:0 8px 32px rgba(35,42,69,.10);
  --glass-sh-lg:0 24px 70px rgba(23,43,72,.35);--scrim:rgba(23,43,72,.4);
  --mesh:radial-gradient(900px 500px at 12% -8%,#dfe4ff,transparent),radial-gradient(800px 480px at 95% 8%,#ffe3f1,transparent),radial-gradient(900px 600px at 60% 110%,#d9f8ef,transparent);
  --meshbg:#eef1fb;--hero:linear-gradient(150deg,#0d6b5e,#0e8f7e 60%,#12b8a0);
  --spring:cubic-bezier(.34,1.56,.64,1)}
/* Kính thật: panel nào cũng blur + viền sáng + bóng mềm như app */
.glass .top,.glass .side,.glass .card,.glass .rowx,.glass .tile,.glass .pager,.glass .drawer,
.glass .chart,.glass .live,.glass .agesum,.glass .pane,.glass .sbox,.glass .tblwrap,
.glass .sheet,.glass .bnav,.glass .btile{
  background:var(--glass);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-line);box-shadow:var(--glass-sh)}
.glass{background:var(--mesh),var(--meshbg);background-attachment:fixed;
  --bg:transparent;--card:#fff;--ink:var(--ink2);--mut:var(--mut2);--line:rgba(23,43,72,.10);
  --soft:rgba(255,255,255,.55);--acc:var(--navy);--pri:var(--o);--navbg:transparent;
  --r:var(--r-md);--r-sm:12px;--sh:var(--glass-sh);--sh-lg:var(--glass-sh-lg)}
.glass .top,.glass .side{border-bottom:0;border-right:0}
.glass .tile strong,.glass .tabhead h2,.glass .ch-h b,.glass .brand b{color:var(--navy)}
.glass .btn.pri{box-shadow:0 6px 18px rgba(238,77,45,.34)}

/* ---------- 1 · LIQUID GLASS PANEL (Apple: chiều sâu + ánh sáng) ---------- */
.shell.v1{--navw:232px;--dw:440px;--grid:repeat(auto-fill,minmax(200px,1fr))}
.shell.v1 .card,.shell.v1 .rowx,.shell.v1 .tile,.shell.v1 .drawer,.shell.v1 .sbox{position:relative;overflow:hidden}
/* vệt sáng specular quét khi hover — chất "liquid", không phải mờ tĩnh */
.shell.v1 .card::after,.shell.v1 .rowx::after,.shell.v1 .tile::after{content:'';position:absolute;inset:-40%;
  background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.62) 47%,transparent 61%);
  transform:translateX(-130%);transition:transform .85s var(--spring);pointer-events:none}
.shell.v1 .card:hover::after,.shell.v1 .rowx:hover::after,.shell.v1 .tile:hover::after{transform:translateX(130%)}
/* khúc xạ: viền trong + highlight đáy tạo cảm giác mặt kính dày */
.shell.v1 .card,.shell.v1 .rowx,.shell.v1 .tile,.shell.v1 .sbox{
  box-shadow:var(--glass-sh),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -14px 26px rgba(223,228,255,.5)}
.shell.v1 .card:hover,.shell.v1 .rowx:hover{transform:translateY(-3px) scale(1.004)}
.shell.v1 .topnav{background:transparent;border:0;justify-content:center;padding:10px var(--pad) 2px;gap:6px}
.shell.v1 .tnv{border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(16px);
  border-radius:999px;padding:8px 16px;font-weight:800;font-size:12px;color:var(--navy);box-shadow:var(--glass-sh);transition:.2s var(--spring)}
.shell.v1 .tnv.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 6px 18px rgba(23,43,72,.3)}
.shell.v1 .drawer{border-radius:var(--r-lg) 0 0 var(--r-lg)}
.shell.v1 .tile.t-ca{background:var(--hero);border-color:transparent}
.shell.v1 .tile.t-ca b,.shell.v1 .tile.t-ca strong,.shell.v1 .tile.t-ca s{color:rgba(255,255,255,.86)}

/* ---------- 2 · BENTO 2.0 MOSAIC (mọi thứ là ô kính nhiều cỡ) ---------- */
.shell.v2{--navw:78px;--dw:460px;--r:var(--r-lg)}
.shell.v2 .side{align-items:center;padding:14px 8px}
.shell.v2 .brand{flex-direction:column;border:0;gap:4px}
.shell.v2 .nv{width:58px;min-height:58px;height:auto;justify-content:center;border-radius:16px;flex-direction:column;gap:2px;padding:8px 3px}
.shell.v2 .nv span{display:block;font-size:8.5px;font-weight:800;letter-spacing:0;white-space:normal;line-height:1.05;text-align:center}
.shell.v2 .nv .cnt{position:static;margin:0;padding:0 5px;font-size:8.5px}
.shell.v2 .nv i{width:auto;font-size:16px}
.shell.v2 .navgrp,.shell.v2 .sfoot{display:none}
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(96px,auto);gap:12px}
.btile{border-radius:var(--r-lg);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;
  min-height:96px;transition:.22s var(--spring);position:relative;overflow:hidden}
.btile:hover{transform:translateY(-3px);box-shadow:var(--glass-sh-lg)}
.btile h5{margin:0;font:800 10px/1 var(--ff);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.btile strong{font:800 30px/1.05 var(--fm);letter-spacing:-.03em;color:var(--navy)}
.btile s{text-decoration:none;font-size:11px;color:var(--mut);font-weight:600}
.btile .spark{margin-top:auto;display:flex;align-items:flex-end;gap:3px;height:34px}
.btile .spark i{flex:1;background:rgba(238,77,45,.22);border-radius:3px 3px 0 0;min-height:3px}
.btile.hero{grid-row:span 2;background:var(--hero);border-color:transparent;color:#fff;justify-content:space-between}
.btile.hero strong{color:#fff;font-size:44px}.btile.hero h5,.btile.hero s{color:rgba(255,255,255,.8)}
.btile.hero .spark i{background:rgba(255,255,255,.35)}
.btile.wide{grid-column:span 2}.btile.tall{grid-row:span 2}
.btile .mini{margin-top:auto;display:flex;flex-direction:column;gap:5px;max-height:150px;overflow:auto}
.btile .mini button{display:flex;gap:8px;align-items:center;font-size:11px;padding:5px 7px;border-radius:9px;text-align:left;transition:.14s}
.btile .mini button:hover{background:rgba(255,255,255,.7)}
.btile .mini b{font:800 10.5px var(--fm);color:var(--navy)}.btile .mini span{color:var(--mut);margin-left:auto;font-weight:700}
.shell.v2 .btile.hot strong{color:var(--red)}
.bentoq{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.bentoq h5{margin:2px 0 0;font:800 10px/1 var(--ff);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
@media (max-width:1100px){.bento{grid-template-columns:repeat(2,1fr)}}

/* ---------- 3 · AURORA FROST (mesh trôi + viền sắc độ) ---------- */
.shell.v3{--navw:238px;--dw:450px;--grid:repeat(auto-fill,minmax(206px,1fr))}
.shell.v3{background:
  radial-gradient(760px 520px at 10% 0%,#cfd8ff,transparent),
  radial-gradient(700px 480px at 88% 6%,#ffd9ea,transparent),
  radial-gradient(820px 560px at 52% 108%,#cdf6ea,transparent),
  radial-gradient(600px 420px at 78% 62%,#e9e2ff,transparent),var(--meshbg);
  animation:aurora 26s ease-in-out infinite alternate;background-size:140% 140%,140% 140%,140% 140%,140% 140%,100% 100%}
@keyframes aurora{0%{background-position:0% 0%,100% 0%,50% 100%,20% 60%,0 0}
  100%{background-position:22% 12%,74% 18%,36% 86%,86% 30%,0 0}}
.shell.v3 .card{border-radius:var(--r-lg)}
.shell.v3 .card.on{box-shadow:0 0 0 2px transparent,var(--glass-sh-lg);
  background:linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.62)) padding-box,
  conic-gradient(from 210deg,#ee4d2d,#7c5cff,#12b8a0,#ffe3f1,#ee4d2d) border-box;border:2px solid transparent}
.shell.v3 .tabhead h2{font-size:17px;letter-spacing:-.03em}
.shell.v3 .chip.on{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(23,43,72,.26)}
.shell.v3 .bar i{background:linear-gradient(180deg,#7c5cff,var(--o))}

/* ---------- 4 · MATERIAL 3 EXPRESSIVE (dock + màu tonal + nảy) ---------- */
.shell.v4{--navw:230px;--dw:100%;--r:22px;--r-sm:14px;--pri:#0b57d0;--acc:#001d35;--green:#0b6b3a;--grid:repeat(auto-fill,minmax(200px,1fr))}
.shell.v4 .bnav{display:flex;position:static;border-radius:999px;margin:0 var(--pad) var(--pad);padding:8px;gap:4px;justify-content:center}
.shell.v4 .bn{flex-direction:row;gap:8px;padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--acc);transition:.26s var(--spring)}
.shell.v4 .bn.on{background:var(--navy);color:#fff;flex:1 1 auto;max-width:220px;box-shadow:0 8px 20px rgba(23,43,72,.28)}
.shell.v4 .bn i{font-size:16px}
.shell.v4 .bn.fab{background:var(--o);color:#fff;width:54px;height:54px;border-radius:50%;padding:0;justify-content:center;box-shadow:0 8px 20px rgba(238,77,45,.42)}
.shell.v4 .bn:active{transform:scale(.92)}
.shell.v4 .card,.shell.v4 .rowx,.shell.v4 .tile{transition:transform .3s var(--spring),box-shadow .3s var(--spring)}
.shell.v4 .card:hover{transform:translateY(-4px) scale(1.02)}
/* tonal container theo trạng thái — chất M3: màu nhẹ làm nền, không phải dot */
.shell.v4 .card:has(.st-amber),.shell.v4 .rowx:has(.st-amber){background:rgba(255,148,26,.16)}
.shell.v4 .card:has(.st-green),.shell.v4 .rowx:has(.st-green){background:rgba(11,107,58,.14)}
.shell.v4 .card:has(.st-blue),.shell.v4 .rowx:has(.st-blue){background:rgba(11,87,208,.13)}
.shell.v4 .btn{border-radius:999px;font-weight:800}
.shell.v4 .top{border-bottom:0}
.shell.v4 .side{border-radius:0 var(--r-lg) var(--r-lg) 0;margin:8px 0 8px 8px}

/* ---------- 5 · CALM / QUIET GLASS (bớt nhiễu, chữ dẫn dắt) ---------- */
.shell.v5{--glass:rgba(255,255,255,.42);--glass-blur:10px;--glass-line:rgba(23,43,72,.07);
  --glass-sh:none;--r:14px;--r-sm:10px;--fs:13.5px;--navw:210px;--dw:430px;--pad:22px;--gap:16px;
  --grid:repeat(auto-fill,minmax(240px,1fr))}
.shell.v5 .top,.shell.v5 .side,.shell.v5 .card,.shell.v5 .rowx,.shell.v5 .tile,.shell.v5 .pager,
.shell.v5 .chart,.shell.v5 .live,.shell.v5 .agesum,.shell.v5 .sbox,.shell.v5 .chip{border:0;box-shadow:none;background:transparent;backdrop-filter:none}
.shell.v5 .side{border-right:1px solid rgba(23,43,72,.07)}
.shell.v5 .top{border-bottom:1px solid rgba(23,43,72,.07)}
.shell.v5 .rowx{border-bottom:1px solid rgba(23,43,72,.06);border-radius:0;padding:14px 6px}
.shell.v5 .rowx.on{background:rgba(238,77,45,.05);box-shadow:inset 2px 0 0 var(--o)}
.shell.v5 .tabhead{border-bottom:0;padding-bottom:12px}
.shell.v5 .tabhead h2{font-size:22px;font-weight:700;letter-spacing:-.035em}
.shell.v5 .tabhead span{background:transparent;color:var(--mut);font-weight:600;font-family:var(--ff)}
.shell.v5 .tile strong{font-size:24px;font-weight:700;letter-spacing:-.04em}
.shell.v5 .btn{border-radius:10px;font-weight:600;box-shadow:none;border-color:rgba(23,43,72,.14);background:transparent}
.shell.v5 .btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.shell.v5 .sbox{border-bottom:1.5px solid rgba(23,43,72,.2);border-radius:0;padding:6px 2px;box-shadow:none}
.shell.v5 .card{border:1px solid rgba(23,43,72,.07)}
.shell.v5 .chip.on{background:var(--tint);color:var(--o);box-shadow:inset 0 0 0 1.5px rgba(238,77,45,.4)}

/* ---------- 6 · AI-NATIVE COPILOT (hỏi tiếng Việt → bảng + câu trả lời) ---------- */
.shell.v6{--navw:74px;--dw:470px;--grid:repeat(auto-fill,minmax(200px,1fr))}
.shell.v6 .side{align-items:center}.shell.v6 .brand{flex-direction:column;border:0}.shell.v6 .navgrp,.shell.v6 .sfoot{display:none}
.shell.v6 .nv{width:50px;height:50px;justify-content:center;border-radius:14px;padding:0}.shell.v6 .nv span{display:none}
.copilot{display:flex;flex-direction:column;gap:12px;min-width:0}
.cask{display:flex;gap:10px;align-items:center;border-radius:var(--r-lg);padding:12px 14px;
  background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--glass-line);box-shadow:var(--glass-sh)}
.cask i{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#7c5cff,var(--o));color:#fff;font-weight:800;font-size:14px}
.cask input{flex:1;border:0;background:transparent;font-size:14px;font-weight:600;padding:4px 0}
.cask input:focus{box-shadow:none}
.cask .btn{flex:none}
.csug{display:flex;gap:7px;flex-wrap:wrap}
.csug button{border:1px solid var(--glass-line);background:rgba(255,255,255,.5);backdrop-filter:blur(10px);
  border-radius:999px;padding:7px 13px;font-size:11.5px;font-weight:700;color:var(--navy);transition:.18s var(--spring)}
.csug button:hover{transform:translateY(-2px);background:#fff;box-shadow:var(--glass-sh)}
.cans{border-radius:var(--r-lg);padding:14px 16px;background:rgba(255,255,255,.66);backdrop-filter:blur(18px);
  border:1px solid var(--glass-line);box-shadow:var(--glass-sh);font-size:13px;line-height:1.65;color:var(--ink2)}
.cans b{color:var(--navy)}
.cans .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.cans .chips button{display:flex;align-items:center;gap:6px;border:1px solid var(--glass-line);background:#fff;
  border-radius:12px;padding:6px 10px;font-size:11px;transition:.16s var(--spring)}
.cans .chips button:hover{transform:translateY(-2px);box-shadow:var(--glass-sh)}
.cans .chips b{font:800 11px var(--fm)}
.cans .chips em{font-style:normal;color:var(--mut);font-weight:600;max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cans .chips .age{position:static}
.cans .cur::after{content:'▍';color:var(--o);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.cans .trust{margin-top:8px;font-size:10.5px;color:var(--mut);font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cans .trust em{font-style:normal;background:var(--tint);color:var(--o);border-radius:6px;padding:2px 7px}
.cnext{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.cnext button{border-radius:var(--r-md);padding:12px 14px;text-align:left;background:var(--glass);
  backdrop-filter:blur(14px);border:1px solid var(--glass-line);box-shadow:var(--glass-sh);transition:.2s var(--spring)}
.cnext button:hover{transform:translateY(-3px);box-shadow:var(--glass-sh-lg)}
.cnext b{display:block;font-size:12.5px;color:var(--navy);font-weight:800}
.cnext s{text-decoration:none;font-size:11px;color:var(--mut)}
.cnext em{display:inline-block;margin-top:6px;font-style:normal;font:800 10px var(--fm);color:var(--o)}

/* ---------- 7 · NARRATIVE TIMELINE (dashboard kể chuyện ca trực) ---------- */
.shell.v7{--navw:236px;--dw:460px;--pri:#b45309;--acc:#3b2f23;--ink:#33291f;--meshbg:#f7f2ea;
  --glass:rgba(255,255,255,.66);--r:18px;--grid:repeat(auto-fill,minmax(200px,1fr))}
.shell.v7 .fgrp{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-line);
  border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--glass-sh)}
.shell.v7 .fgrp header{display:flex;align-items:baseline;gap:10px;border-bottom:1px dashed rgba(23,43,72,.14);padding-bottom:8px;margin-bottom:6px}
.shell.v7 .fgrp header b{font:800 13px var(--fm);color:var(--acc)}
.shell.v7 .fitem{border-left:2px solid rgba(180,83,9,.28);margin-left:6px;padding-left:14px;position:relative}
.shell.v7 .fitem::before{content:'';position:absolute;left:-6px;top:12px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--pri)}
.shell.v7 .insight{border-radius:var(--r-lg);padding:14px 16px;background:linear-gradient(120deg,rgba(255,217,167,.7),rgba(255,255,255,.6));
  border:1px solid rgba(180,83,9,.2);font-size:12.5px;line-height:1.6;color:#4a3520}
.shell.v7 .insight>b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--pri);margin-bottom:4px}

/* ---------- 8 · SPATIAL LAYERS (visionOS: nhiều lớp kính nổi, parallax) ---------- */
.shell.v8{--dw:440px;--grid:repeat(auto-fill,minmax(206px,1fr));--r:var(--r-lg)}
.shell.v8 .body{perspective:1400px}
.shell.v8 .dashwrap{transform:translate3d(calc(var(--px,0) * -10px),calc(var(--py,0) * -8px),0)}
.shell.v8 .content>*{transform:translate3d(calc(var(--px,0) * 6px),calc(var(--py,0) * 5px),0);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.shell.v8 .grid{transform:translate3d(calc(var(--px,0) * 16px),calc(var(--py,0) * 12px),-40px)}
.shell.v8 .drawer{transform:translate3d(calc(var(--px,0) * 26px),calc(var(--py,0) * 18px),60px);
  border-radius:var(--r-lg);margin:10px 10px 10px 0;box-shadow:0 30px 80px rgba(23,43,72,.3)}
.shell.v8 .top{border-radius:0 0 var(--r-lg) var(--r-lg);margin:0 10px}
.shell.v8 .side{border-radius:var(--r-lg);margin:10px 0 10px 10px}
.shell.v8 .card{background:rgba(255,255,255,.5);backdrop-filter:blur(24px) saturate(1.4)}
.shell.v8 .card:hover{transform:translate3d(calc(var(--px,0) * 16px),calc(var(--py,0) * 12px + -4px),20px)}
.shell.v8 .tile{background:rgba(255,255,255,.4);backdrop-filter:blur(28px) saturate(1.5)}
.shell.v8 .tabhead h2{letter-spacing:-.03em}

/* ---------- 9 · LIVE TILES WALL (kính tối, bảng điều hành treo tường) ---------- */
.shell.v9{--mesh:radial-gradient(1100px 600px at 10% -10%,rgba(223,228,255,.16),transparent),
  radial-gradient(900px 520px at 92% 4%,rgba(255,227,241,.14),transparent),
  radial-gradient(900px 600px at 60% 110%,rgba(217,248,239,.12),transparent);
  --meshbg:#0b1020;--glass:rgba(255,255,255,.055);--glass-line:rgba(255,255,255,.13);--glass-blur:20px;
  --glass-sh:0 8px 32px rgba(0,0,0,.35);--ink:#eef3ff;--navy:#eef3ff;--ink2:#eef3ff;--mut:#93a3c4;
  --line:rgba(255,255,255,.11);--soft:rgba(255,255,255,.06);--card:#141b2e;--pri:#ff7a45;--acc:#5eead4;
  --r:20px;--r-sm:14px;--fs:14px;--dw:480px;--grid:repeat(auto-fill,minmax(190px,1fr))}
.shell.v9 .heat,.shell.v9 .hc i{border-radius:10px}
.shell.v9 .hc{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.shell.v9 .hc i{background:linear-gradient(160deg,#ff7a45,#ffd166)}
.shell.v9 .tile strong{font-size:26px}
.shell.v9 .tile{transition:box-shadow .3s}
.shell.v9 .tile.t-hot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,122,69,0)}50%{box-shadow:0 0 0 4px rgba(255,122,69,.22)}}
.shell.v9 .lv,.shell.v9 .kv,.shell.v9 .hm b{color:var(--ink)}
.shell.v9 .btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:var(--ink)}
.shell.v9 .tnv{color:var(--mut)}.shell.v9 .tnv.on{color:#fff;background:rgba(255,122,69,.22);border-radius:999px}
.shell.v9 .topnav{background:transparent;border:0}

/* ---------- 10 · SCAN HUD (camera-first, HUD kính nổi) ---------- */
.shell.v10{--mesh:radial-gradient(900px 520px at 50% -20%,rgba(94,234,212,.18),transparent),
  radial-gradient(760px 460px at 92% 10%,rgba(255,122,69,.16),transparent),var(--meshbg);
  --meshbg:#080d16;--glass:rgba(255,255,255,.07);--glass-line:rgba(255,255,255,.16);--glass-blur:18px;
  --ink:#e9f0fa;--navy:#e9f0fa;--ink2:#e9f0fa;--mut:#8ba0bd;--line:rgba(255,255,255,.12);--soft:rgba(255,255,255,.05);
  --card:#101a28;--pri:#ff5a1f;--acc:#5eead4;--green:#2ee6a0;--amber:#ffc233;--blue:#57a6ff;
  --r:16px;--r-sm:12px;--fs:13.5px;--dw:100%;--grid:repeat(auto-fill,minmax(160px,1fr))}
.shell.v10 .reticle{border:1px solid rgba(94,234,212,.3);border-radius:var(--r-lg);background:rgba(4,8,14,.6);
  backdrop-filter:blur(18px);position:relative;overflow:hidden}
.shell.v10 .reticle .frame{border-color:rgba(94,234,212,.7)}
.shell.v10 .reticle::after{content:'';position:absolute;left:8%;right:8%;height:2px;top:12%;
  background:linear-gradient(90deg,transparent,#5eead4,transparent);box-shadow:0 0 18px #5eead4;
  animation:laser 2.6s ease-in-out infinite}
@keyframes laser{0%,100%{top:12%}50%{top:82%}}
.shell.v10 .strip span{background:rgba(94,234,212,.1);border-color:rgba(94,234,212,.28);color:#cfe9e4;border-radius:999px}
.shell.v10 .bnav{display:flex;position:static;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.14);justify-content:space-around}
.shell.v10 .bn.on{background:rgba(255,90,31,.18);color:#fff;border-radius:999px}
.shell.v10 .bn.fab{background:var(--pri);color:#0a0f16;border-radius:50%;width:52px;height:52px;justify-content:center}
.shell.v10 .rowx{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.1)}
.shell.v10 .rowx.on{background:rgba(94,234,212,.12);border-color:rgba(94,234,212,.4)}
.shell.v10 .hud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.shell.v10 .hud span{font:800 10px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:#5eead4;
  border:1px solid rgba(94,234,212,.34);border-radius:999px;padding:4px 10px;background:rgba(94,234,212,.08)}
.shell.v10 .tabhead h2,.shell.v10 .ttl b{color:var(--ink)}
.shell.v10 .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:var(--ink)}
.shell.v10 .btn.pri{background:var(--pri);border-color:var(--pri);color:#0a0f16}
</style>

<script>
/* =====================================================================
   mockups/02-glass-trends-gallery.html
   10 mẫu giao diện "Đơn mất bill" (SPX) theo xu hướng UI 2026 — HTML tĩnh, dữ liệu giả lập.
   KHÔNG đụng Code.gs / index.html. Mọi hành vi chạy local (không gọi GAS).
   Bộ điều khiển dùng chung: 1 state, 1 tập hành động, 10 skin + layout.
   ===================================================================== */
'use strict';

/* ---------- 1. TIỆN ÍCH ---------- */
var VN_TZ_TODAY = new Date(2026, 9, 12, 8, 30, 0); // 12/10/2026 08:30 — "hôm nay" của demo
function pad(n){ return (n<10?'0':'')+n; }
function dmy(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function dmyhm(d){ return dmy(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function hm(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function parseVn(s){ var m=/^(\d{2})\/(\d{2})\/(\d{4})[ T](\d{2}):(\d{2})(?::(\d{2}))?/.exec(String(s||'')); if(!m) return null; return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0)); }
function daysOld(s){ var d=parseVn(s); if(!d) return 0; return Math.max(0, Math.floor((VN_TZ_TODAY-d)/864e5)); }
function hoursOld(s){ var d=parseVn(s); if(!d) return 0; return Math.max(0, Math.round((VN_TZ_TODAY-d)/36e5)); }
function vnd(n){ n=Number(n)||0; return n.toLocaleString('vi-VN')+' đ'; }
function nsq(n){ return (Number(n)||0).toLocaleString('vi-VN'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function cl(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\u0111/g,'d').replace(/[^a-z0-9 _-]/g,'').trim(); }
function has(q,s){ return cl(s).indexOf(cl(q))>=0; }
function seedRand(seed){ var x=seed%2147483647; if(x<=0)x+=2147483646; return function(){ x=x*16807%2147483647; return (x-1)/2147483646; }; }
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)%arr.length]; }

/* Trạng thái canonical (khớp scripts/import-csv.js:STATUS_RULES) */
var ST = {

/* QR thật (thư viện qrcode-generator) — fallback: mã giả nếu thiếu mạng */
function qrSvg(text,px){
  px=px||120;
  try{
    if(typeof qrcode==='function'){
      var q=qrcode(0,'M'); q.addData(String(text)); q.make();
      var n=q.getModuleCount(), cell=Math.floor(px/n), sz=cell*n, d='';
      for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(q.isDark(r,c)) d+='M'+(c*cell)+' '+(r*cell)+'h'+cell+'v'+cell+'h-'+cell+'z';
      return '<svg viewBox="0 0 '+sz+' '+sz+'" width="'+px+'" height="'+px+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="'+sz+'" height="'+sz+'" fill="#fff"/><path d="'+d+'" fill="#101820"/></svg>';
    }
  }catch(e){}
  var rng=seedRand(text.length*77+5), s='<svg viewBox="0 0 100 100" width="'+px+'" height="'+px+'" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#fff"/>', i;
  for(i=0;i<900;i++){ if(rng()>0.55) s+='<rect x="'+(i%30*3.3)+'" y="'+(Math.floor(i/30)*3.3)+'" width="3.3" height="3.3"/>'; }
  return s+'<rect x="6" y="6" width="20" height="20" fill="none" stroke="#101820" stroke-width="4"/><rect x="74" y="6" width="20" height="20" fill="none" stroke="#101820" stroke-width="4"/><rect x="6" y="74" width="20" height="20" fill="none" stroke="#101820" stroke-width="4"/></svg>';
}

var DB, Store={
  latency:180, failMode:false, seqBox:0, seqItem:0,
  init:function(){ DB=buildData(); this.failMode=false; this.latency=180; },
  call:function(name,args,fn){
    var self=this;
    return new Promise(function(res,rej){
      var wait = self.latency + Math.floor(Math.random()*120);
      setTimeout(function(){
        if(self.failMode && /^(resolveItem|liquidateBatch|createBox|createItem|adminEditItem|editItem|addFeedback|enqueuePrintJob)$/.test(name)){
          rej({message:'Server lỗi giả lập (chế độ demo): '+name}); return;
        }
        try{ res(fn()); }catch(e){ rej(e); }
      },wait);
    });
  }
};
