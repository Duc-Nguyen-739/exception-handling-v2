/* ---------- 4b. HÀNH VI (mutation, optimistic + rollback như app thật) ---------- */
function toast(msg,type){ App.toast.push({m:msg,t:type||'ok',id:Math.random().toString(36).slice(2)}); renderToast(); setTimeout(function(){ App.toast=App.toast.filter(function(x){return x.m!==msg;}); renderToast(); },3200); }
function renderToast(){ var el=document.getElementById('toasts'); if(el) el.innerHTML=App.toast.map(function(t){ return '<div class="tst tst-'+t.t+'">'+esc(t.m)+'</div>'; }).join(''); }
var PENDING={};
function markPending(code,from,to,bill){ var it=findItem(code); PENDING[code]={from:from,to:to,bill:bill||'',billFrom:it?it.bill:''}; }
/* Ứng trước giao diện ngay nhưng GIỮ snapshot PENDING tới khi server trả lời (mới xóa ở done/rollback) — badge “đang đồng bộ” hiển thị trong lúc chờ + rollback có dữ liệu */
function commitPending(code){ var p=PENDING[code]; if(!p) return;
  var it=findItem(code); if(!it) return; it.status=p.to; it.statusLabel=stLabel(p.to); if(p.bill) it.bill=p.bill; }
function donePending(code){ delete PENDING[code]; }
function rollback(code){ var p=PENDING[code]; if(!p) return; delete PENDING[code]; var it=findItem(code); if(it){ it.status=p.from; it.statusLabel=stLabel(p.from); it.bill=p.billFrom||''; } }
function isPending(code){ return !!PENDING[code]; }

function actResolve(code,bill){
  var it=findItem(code); if(!it) return Promise.reject({message:'Không tìm thấy đơn'});
  if(!bill) return Promise.reject({message:'Vui lòng nhập mã bill để xử lý.'});
  if(it.status!=='chua_xu_ly') return Promise.reject({message:'Đơn đang ở trạng thái '+stLabel(it.status)+' — chỉ Resolve khi còn Lưu kho.'});
  markPending(code,it.status,'da_tim_bill',bill); commitPending(code);
  logHist(code,'chua_xu_ly','da_tim_bill',ME_EMAIL,bill,bill,'');
  render();
  return Store.call('resolveItem',[code,bill],function(){ return {ok:true}; })
    .then(function(r){ donePending(code); return r; }, function(e){ rollback(code); render(); throw e; });
}
function actAdminStatus(code,to,bill,reason){
  var it=findItem(code); if(!it) return Promise.reject({message:'Không tìm thấy đơn'});
  if(!String(reason||'').trim()) return Promise.reject({message:'Đổi trạng thái phải điền Lý do.'});
  var from=it.status; markPending(code,from,to,bill); commitPending(code);
  logHist(code,from,to,'ADMIN đổi trạng thái',bill||'',bill||'',reason);
  render();
  return Store.call('adminEditItem',[{code:code,toStatus:to,reason:reason}],function(){ return {ok:true}; })
    .then(function(r){ donePending(code); return r; }, function(e){ rollback(code); render(); throw e; });
}
function actEditFields(code,desc,note){
  var it=findItem(code); if(!it) return Promise.reject({message:'Không tìm thấy đơn'});
  var ch=[]; if(desc!==it.description){ ch.push('Edit Mô tả: '+it.description+' => '+desc); it.description=desc; }
  if(note!==it.note){ ch.push('Edit Ghi chú: '+it.note+' => '+note); it.note=note; }
  if(!ch.length) return Promise.reject({message:'Không có gì thay đổi.'});
  ch.forEach(function(n){ logHist(code,it.status,it.status,ME_EMAIL,n,'',''); });
  render();
  return Store.call('editItem',[{code:code,description:desc,note:note}],function(){ return {ok:true}; });
}
function actLiquidate(codes,liqCode){
  if(!codes.length) return Promise.reject({message:'Chưa có mã nào trong lô.'});
  if(!/^SPXVN[0-9A-Z]{6,}$/.test(String(liqCode||'').toUpperCase())) return Promise.reject({message:'Mã thanh lý phải dạng SPXVN… (bắt buộc).'});
  var moved=[];

function kpis(){
  var k={open:0,over72:0,today:0,resolveToday:0,liq:0,queued:0,fb:0,backlog:0,ca:0,caOver:0,byHour:[],byKind:{Box:0,Item:0},age:[]};
  var today=dmy(VN_TZ_TODAY);
  DB.items.forEach(function(it){
    var created=parseVn(it.createdAt), isToday=it.createdAt.indexOf(today)>=0;
    if(it.status==='chua_xu_ly'){ k.open++; k.byKind[it.kind]=(k.byKind[it.kind]||0)+1; k.age.push(hoursOld(it.createdAt)); if(hoursOld(it.createdAt)>=72) k.over72++; }
    if(isToday) k.today++;
    if(it.status==='da_tim_bill'&&isToday) k.resolveToday++;
    if(it.status==='thanh_ly'&&isToday) k.liq++;
    histOf(it.code).forEach(function(h){ if(it.status==='da_tim_bill'&&String(h.at).indexOf(today)>=0&&h.to==='da_tim_bill') { k.resolveToday=k.resolveToday; } });
    if(created && created.getDay()===VN_TZ_TODAY.getDay()){ k.ca++; if(hoursOld(it.createdAt)>=72) k.caOver++; }
  });
  for(var h=0;h<24;h++) k.byHour.push(0);
  DB.items.forEach(function(it){ var c=parseVn(it.createdAt); if(c) k.byHour[c.getHours()]++; });
  DB.printQ.forEach(function(j){ if(j.status==='pending'||j.status==='printing') k.queued++; });
  k.fb=DB.feedback.length; k.backlog=DB.backlog.length;
  k.rate = k.today? Math.round(100*k.resolveToday/Math.max(1,k.today)) : 0;
  k.ageMed = k.age.length? (function(){ var a=k.age.slice().sort(function(x,y){return x-y;}); return a[Math.floor(a.length/2)]; })() : 0;
  k.oldest = k.age.length? Math.max.apply(null,k.age) : 0;
  return k;
}

function gunFire(raw,from){
  var code=normCode(raw); if(!code) return;

  if(App.scan) return routeScan(code);
  if(App.tab==='liq'){

    else { App.liq.push(code); beep('ok'); App.liqLog='✓ Đã thêm '+code+' vào lô ('+App.liq.length+')'; }
    pushRecent(code); render(); return;
  }
  if(App.tab==='print'){
    if(!/^(Box|Item)\./i.test(code)){ beep('bad'); toast('Mã không đúng định dạng Box./Item. — không in','err'); return; }
    App.printCodes=[code]; beep('ok'); pushRecent(code);
    if(App.printAuto){ App.printCodes=[code]; render(); doPrint(); return; }
    render(); return;
  }
  var it=findItem(code);
  if(it){ beep('ok'); pushRecent(code); App.sel=it.code; App.lightbox=-1; render(); return; }

function runCmd(c){
  if(!c) return;
  App.pal=''; App.palSel=0;
  if(c.indexOf('tab:')===0) setTab(c.slice(4));
  else if(c.indexOf('f:')===0){ App.status=c.slice(2); setTab('list'); }
  else if(c.indexOf('k:')===0){ App.kind=c.slice(2); setTab('list'); }
  else if(c.indexOf('go:')===0){ App.sel=c.slice(3); setTab('list'); }
  else if(c.indexOf('vp:')===0){ setVp(c.slice(3)); render(); return; }
  else if(c==='new'){ App.create.open=true; App.tab='create'; App.create.saved=''; App.create.shots=[]; App.create.code=nextCode(App.create.kind); }
  else if(c==='pr'){ App.printCodes=App.sel?[App.sel]:[]; setTab('print'); return; }
  else if(c==='v'){ App.v=App.v>=10?1:App.v+1; buildPicks(); pickVariant(App.v); return; }
  else if(c==='rf'){ App.status='all'; App.kind='both'; App.q=''; }
  render();
}

function onInput(e){

  if(n==='copQ'){ App.cop.q=v; }

  else if(n==='palIn'){ App.pal=v; App.palSel=0; render(); }

function onChange(e){

  if(n==='sort'){ App.sort=e.target.value==='new'?'new':e.target.value; App.sortDir=e.target.value==='new'?-1:1; render(); }
  else if(n==='auto'){ App.printAuto=e.target.checked; render(); }
  else if(n==='poll'){ if(e.target.checked) startPolling(true); else { clearInterval(App.polling); App.polling=null; App.queueLog=''; } render(); }
  else if(n==='bulkKind'){ App.bulkKind=e.target.value; render(); }
  else if(n==='bulkN'){ App.bulkN=Math.min(10,Math.max(1,+e.target.value||10)); render(); }

  else if(n==='blAging'){ App.bl.aging=e.target.value; App.bl.page=1; render(); }

function onKey(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); App.pal=App.pal?'':'_open_'; App.palSel=0; render(); var p=document.getElementById('palIn'); if(p)p.focus(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='p'){ if(App.printCodes.length){ e.preventDefault(); doPrint(); } return; }
  if(e.key==='Escape'){
    if(App.lightbox>=0){ App.lightbox=-1; } else if(App.pal){ App.pal=''; } else if(App.scan){ App.scan=null; stopStream(); }
    else if(App.edit){ App.edit=''; } else if(App.intro){ App.intro=false; } else if(App.fbOpen){ App.fbOpen=false; }
    else if(App.sel){ App.sel=''; App.pageDetail=false; } else return;
    render(); return;
  }
  if(App.pal){
    if(e.key==='ArrowDown'){ App.palSel=Math.min(App.palSel+1,9); render(); e.preventDefault(); return; }
    if(e.key==='ArrowUp'){ App.palSel=Math.max(0,App.palSel-1); render(); e.preventDefault(); return; }
    if(e.key==='Enter'){ var c=document.querySelectorAll('.cmd')[App.palSel]; if(c) runCmd(c.getAttribute('data-c')); e.preventDefault(); return; }
  }
  if(e.key==='Enter'&&e.target.getAttribute('data-gun')){ e.preventDefault(); gunFire(e.target.value); return; }
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); var q=document.getElementById('q'); if(q)q.focus(); }
}

/* Phản hồi quét: beep + rung + flash (giống máy quét công nghiệp) */
var AC=null;
function beep(kind){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type='square'; o.frequency.value= kind==='bad'?330: kind==='dup'?520:880;
    g.gain.value=0.06; o.connect(g); g.connect(AC.destination); o.start();
    o.stop(AC.currentTime+(kind==='bad'?0.24:0.09));
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(kind==='bad'?[80,40,80]:kind==='dup'?60:25); }catch(e){}
}
function relTime(s){
  var d=parseVn(s); if(!d) return s; var m=Math.floor((VN_TZ_TODAY-d)/6e4);
  if(m<1) return 'vừa xong'; if(m<60) return m+' phút trước';
  if(m<1440) return Math.floor(m/60)+' giờ trước'; return Math.floor(m/1440)+' ngày trước';
}

/* Lưới/hiển thị theo tab */
function filtered(){
  var out=DB.items.filter(function(it){
    if(App.status!=='all' && it.status!==App.status) return false;
    if(App.kind!=='both' && it.kind!==App.kind) return false;
    if(App.q && !(has(App.q,it.code)||has(App.q,it.description)||has(App.q,it.bill)||has(App.q,it.note)||has(App.q,it.createdBy))) return false;
    if(App.hour!=null && parseVn(it.createdAt) && parseVn(it.createdAt).getHours()!==App.hour) return false;
    if(App.bucket){ var h=hoursOld(it.createdAt), b=h<24?0:h<72?1:h<168?2:3; if(b!==App.bucketIdx) return false; }
    return true;
  });
  var dir=App.sortDir<0?-1:1;
  out.sort(function(a,b){
    if(App.sort==='code') return dir*a.code.localeCompare(b.code);
    if(App.sort==='kind') return dir*(a.kind<b.kind?-1:1);
    if(App.sort==='status') return dir*a.status.localeCompare(b.status);
    if(App.sort==='desc') return dir*a.description.localeCompare(b.description);
    if(App.sort==='age') return dir*(hoursOld(a.createdAt)-hoursOld(b.createdAt));
    if(App.sort==='by') return dir*a.createdBy.localeCompare(b.createdBy);
    if(App.sort==='bill') return dir*(String(a.bill)||'').localeCompare(String(b.bill)||'');
    return dir*(parseVn(b.createdAt)-parseVn(a.createdAt));
  });
  return out;
}

/* Copilot: hỏi tiếng Việt -> parse thành bộ lọc thật + câu trả lời có dẫn chứng */
function copParse(q){
  var s=cl(q), p={status:'',kind:'',breach:false,today:false,by:'',text:''};
  if(/\bbox\b/.test(s)) p.kind='Box';
  else if(/item|kien hang|\bkien\b/.test(s)) p.kind='Item';
  if(/resolve|co bill|tim thy|da thay/.test(s)) p.status='da_tim_bill';
  else if(/thanh ly|liquid/.test(s)) p.status='thanh_ly';
  else if(/tieu huy/.test(s)) p.status='tieu_huy';
  else if(/cho di|dieu chuyen|xac van/.test(s)) p.status='da_cho_di';
  else if(/ton|luu kho|chua xu ly|cham|qu a han|\blam\b|\bslow\b/.test(s)) p.status='chua_xu_ly';
  if(/72|sla|breach|qu a han|lau nhat|lau qua|nam lau/.test(s)) p.breach=true;
  if(/hom nay|hom qua|\bnay\b|today/.test(s)) p.today=true;
  STAFFS.forEach(function(e){ var w=whoShort(e); if(w.length>3 && s.indexOf(w)>=0) p.by=e; });
  return p;
}
function copAnswer(q){
  var p=copParse(q), rows=DB.items.slice();
  if(p.kind) rows=rows.filter(function(it){ return it.kind===p.kind; });
  if(p.status) rows=rows.filter(function(it){ return it.status===p.status; });
  if(p.by) rows=rows.filter(function(it){ return it.createdBy===p.by; });
  if(p.breach) rows=rows.filter(function(it){ return it.status==='chua_xu_ly' && hoursOld(it.createdAt)>=72; });
  var today=dmy(VN_TZ_TODAY);
  if(p.today) rows=rows.filter(function(it){ return it.createdAt.indexOf(today)>=0; });
  if(!p.kind&&!p.status&&!p.by&&!p.breach&&!p.today&&q){
    rows=rows.filter(function(it){ return has(q,it.code)||has(q,it.description)||has(q,it.note)||has(q,it.bill); });
    p.text=q;
  }
  rows.sort(function(a,b){ return hoursOld(b.createdAt)-hoursOld(a.createdAt); });
  var top=rows[0], head;
  if(!rows.length) head='Không tìm thấy đơn nào khớp câu hỏi. Thử hỏi: "đơn tồn lâu nhất", "Box quá 72 giờ", "thanh lý hôm nay" hoặc tên nhân viên.';
  else if(p.breach) head='Có '+rows.length+' đơn còn Lưu kho ≥72 giờ'+(p.kind?' loại '+p.kind:'')+(p.by?' do '+whoShort(p.by)+' báo':'')+' — chậm nhất là '+top.code+' ('+Math.round(hoursOld(top.createdAt)/24)+' ngày).';
  else if(p.today) head='Hôm nay '+today+' ghi nhận '+rows.length+' đơn'+(p.status?' ở trạng thái '+stLabel(p.status):'')+(top?' · chậm nhất '+top.code:'')+'.';
  else if(p.status) head=rows.length+' đơn đang “'+stLabel(p.status)+'”'+(p.kind?' · loại '+p.kind:'')+(top?' · tồn lâu nhất '+Math.round(hoursOld(top.createdAt)/24)+' ngày ('+top.code+')':'')+'.';
  else if(p.by) head=whoShort(p.by)+' đang để '+rows.length+' đơn chưa đóng — lâu nhất '+top.code+' ('+Math.round(hoursOld(top.createdAt)/24)+' ngày).';
  else if(p.text) head='Tìm thấy '+rows.length+' đơn khớp “'+p.text+'”'+(top?' · đáng chú ý nhất: '+top.code+' ('+stLabel(top.status)+')':'')+'.';
  else head='Hiện có '+rows.length+' đơn trong cơ sở dữ liệu demo — chậm nhất '+top.code+' ('+Math.round(hoursOld(top.createdAt)/24)+' ngày).';
  return {head:head, rows:rows.slice(0,5), top:top, p:p, n:rows.length};
}
function copAsk(q){
  if(!q) return;
  App.cop.q=q; App.cop.ans=copAnswer(q); App.cop.typing=true;
  var p=App.cop.ans.p;
  App.status=p.status||'all'; App.kind=p.kind||'both'; App.q=p.text?q:'';
  App.hour=null; App.bucket=''; App.bucketIdx=0; App.page=1;
  if(App.tab!=='list') App.tab='list';
  render(); setTimeout(function(){ App.cop.typing=false; render(); },520);
}
function copilotHtml(slice){
  var c=App.cop, k=kpis();

/* Tab Backlog (bảng 16 cột, mặc định 10) */
function backlogView(){
  var b=App.bl, rows=DB.backlog.slice();
  if(b.q) rows=rows.filter(function(r){ return has(b.q,Object.keys(r).map(function(k){return r[k];}).join(' ')); });
  ['product_name','return_sort_code','buyer_sort_code'].forEach(function(kf){ if(b.sf[kf]) rows=rows.filter(function(r){ return has(b.sf[kf],r[kf]); }); });
  if(b.status) rows=rows.filter(function(r){ return r.status_desc===b.status; });
  if(b.aging) rows=rows.filter(function(r){ return r.aging_leadtime===b.aging; });
  if(b.sk){ var d=b.skDir<0?-1:1; rows.sort(function(x,y){ var a=x[b.sk],c=y[b.sk]; var na=Number(a),nc=Number(c);
    if(!isNaN(na)&&!isNaN(nc)) return d*(na-nc); return d*String(a).localeCompare(String(c)); }); }
  else rows.sort(function(x,y){ return parseVn(y.created_time)-parseVn(x.created_time); });
  var KEYS=['shipment_id','status_desc','pickup_station_name','created_time','last_touch_at','product_name','return_sort_code','buyer_sort_code','aging_leadtime','cogs',
    'station_name','next_station_name','lh_trip_number','inbound_time','last_touch_by','seller_sort_code'];
  var TITLES={shipment_id:'Shipment ID',status_desc:'Status',station_name:'Current station',next_station_name:'Next station',pickup_station_name:'Pickup station',created_time:'Created time',lh_trip_number:'LH trip',inbound_time:'Inbound',last_touch_at:'Last touch',last_touch_by:'Last touch by',product_name:'Product name',seller_sort_code:'Seller sort',return_sort_code:'Return sort',buyer_sort_code:'Buyer sort',aging_leadtime:'Aging leadtime',cogs:'COGS'};
  var cols=KEYS.slice(0,b.col), per=50, pages=Math.max(1,Math.ceil(rows.length/per));
  if(b.page>pages) b.page=1;
  var view=rows.slice((b.page-1)*per,(b.page-1)*per+per);
  var totalCogs=rows.reduce(function(s,r){ return s+(Number(r.cogs)||0)*11; },0);
  var statuses=[],agings=[];
  DB.backlog.forEach(function(r){ if(statuses.indexOf(r.status_desc)<0) statuses.push(r.status_desc); if(agings.indexOf(r.aging_leadtime)<0) agings.push(r.aging_leadtime); });
  agings.sort();
  return '<div class="pane bl">'+
    '<div class="bl-meta"><span class="upd">Last update <b>'+esc(DB.backlog.length?'10/10/2026 18:53:19':'')+'</b></span>'+
      '<span class="cnt">Dòng lọc: <b>'+rows.length+'</b>/'+DB.backlog.length+' · Tổng COGS <b>'+vnd(totalCogs)+'</b></span>'+
      '<span class="subnote">Read-only — WebApp không ghi sheet Backlog</span></div>'+
    '<div class="bl-search"><span>🔍</span><input data-in="blQ" value="'+esc(b.q)+'" placeholder="Tìm toàn cục: shipment, sản phẩm, sort code, station…"><button class="btn mini" data-act="blReset">Xóa lọc</button></div>'+
    '<div class="colbar"><span class="colg"><b>Cột hiển thị</b><button class="btn mini ghost" data-act="blColDn">−</button><span class="coln">'+b.col+'/16</span><button class="btn mini ghost" data-act="blColUp">＋</button>'+
      '<button class="colbtn'+(b.sfOpen?' open':'')+'" data-act="blCols">Bộ lọc cột</button></span>'+
      '<div class="scrollrow show">'+['product_name','return_sort_code','buyer_sort_code'].map(function(kf){
        return '<input class="pill" data-in="blSf_'+kf+'" value="'+esc(b.sf[kf]||'')+'" placeholder="'+TITLES[kf]+'…">'; }).join('')+
        '<select class="pill" data-in="blStatus"><option value="">Mọi Status</option>'+statuses.map(function(s){ return '<option'+(b.status===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select>'+
        '<select class="pill" data-in="blAging"><option value="">Mọi Aging</option>'+agings.map(function(s){ return '<option'+(b.aging===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div></div>'+
    '<div class="tblwrap wide"><table class="bltbl"><thead><tr>'+cols.map(function(k){
      return '<th data-act="blSort" data-k="'+k+'">'+TITLES[k]+'<i>'+(b.sk===k?(b.skDir<0?'▾':'▴'):'')+'</i></th>'; }).join('')+'</tr></thead><tbody>'+
      view.map(function(r){ return '<tr data-act="blSel" data-id="'+esc(r.shipment_id)+'" class="'+(b.sel===r.shipment_id?'sel':'')+'">'+cols.map(function(k){
        var v=r[k];
        if(k==='cogs') return '<td class="num">'+vnd(v)+'</td>';
        if(k==='aging_leadtime') return '<td class="ageb '+ageClass(v)+'">'+esc(v)+'</td>';
        if(k==='shipment_id') return '<td class="sid">'+esc(v)+'</td>';
        if(k==='status_desc') return '<td><span class="bstat">'+esc(v)+'</span></td>';
        return '<td title="'+esc(v)+'">'+esc(v)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table>'+
      (view.length?'':'<div class="empty">Không có dòng khớp bộ lọc.</div>')+'</div>'+
    '<div class="pager"><span class="rng">Trang <b>'+b.page+'</b>/'+pages+' · '+(rows.length?(b.page-1)*per+1:0)+'–'+Math.min(rows.length,b.page*per)+'</span>'+
      '<button class="btn mini pg" data-act="blPg" data-p="'+(b.page-1)+'"'+(b.page<2?' disabled':'')+'>‹</button>'+
      '<button class="btn mini pg" data-act="blPg" data-p="'+(b.page+1)+'"'+(b.page>=pages?' disabled':'')+'>›</button></div>'+
    (b.sel?blDetail(b.sel):'')+'</div>';
}
function ageClass(v){ var m=/(\d+)\s*(day|hour)/.exec(String(v)); if(!m) return 'a0';
  return m[2]==='hour'?(+m[1]>=24?'a2':'a1'):(+m[1]>=3?'a3':+m[1]>=2?'a2':'a1'); }

function curV(){ return VARIANTS[App.v]; }

/* ---------- 7. RENDER ---------- */
function tabheadHtml(){
  if(App.tab==='create') return '';
  var t={list:'Danh sách đơn mất bill',backlog:'Backlog vận hành',liq:'Thanh lý theo lô',print:'In mã QR',fb:'Góp ý nội bộ',role:'Phân quyền truy cập'};
  var cnt={list:filtered().length,backlog:DB.backlog.length,liq:App.liq.length+' đơn trong lô',print:DB.printQ.length+' job',fb:DB.feedback.length+' tin',role:DB.users.length+' user'};
  return '<div class="tabhead"><h2>'+t[App.tab]+'</h2><span>'+cnt[App.tab]+'</span>'+
    (App.tab==='liq'&&App.liqStep===2?'<button class="btn ghost sm" data-act="liqBack">‹ Quay lại sửa lô</button>':'')+
    (App.tab==='liq'&&App.liq.length?'<b class="lotbadge">Tổng '+App.liq.length+' đơn đã quét</b>':'')+
    (App.tab==='print'?'<s>Quét là tự in · điện thoại gửi việc về đây</s>':'')+
    (App.tab==='role'?'<s>Đăng nhập: '+esc(ME_EMAIL)+' · ADMIN</s>':'')+'</div>';
}
function contentView(){
  if(App.tab==='backlog') return backlogView();
  if(App.tab==='liq') return liqView();
  if(App.tab==='print') return printView();
  if(App.tab==='fb') return feedbackView();
  if(App.tab==='role') return roleView();
  if(App.tab==='create') return '<div class="tabhead"><h2>Tạo đơn mới</h2></div>'+createView();
  return (curV().dash?'<div class="dashwrap">'+dashHtml()+'</div>':'')+toolsHtml()+listHtml();
}
function render(){
  var V=curV(), ae=document.activeElement, keep=ae&&ae.getAttribute?ae.getAttribute('data-in'):'';
  var caret=null; try{ caret=ae&&ae.selectionStart; }catch(e){}
  App.navMode=V.nav;
  var detailInner=detailHtml(V);
  var isDrawer=(V.detail==='drawer'||V.detail==='inline');
  var shell='<div class="shell v'+App.v+' nav-'+V.nav+' det-'+V.detail+' list-'+V.list+(V.dark?' dark':'')+(V.big?' big':'')+(V.cls?' '+V.cls:'')+(App.dens?' dens-'+App.dens:'')+(isPhone()?' mob':'')+'">'+
    (V.nav==='sidebar'||V.nav==='rail'?sideHtml():'')+
    '<div class="main">'+topHtml(V)+((V.nav==='top'||V.nav==='none')?topnavHtml(V):'')+
      '<div class="body">'+
        '<div class="content'+(V.list==='wall'?' nowrap':'')+'">'+
          tabheadHtml()+
          contentView()+
        '</div>'+
        (isDrawer?detailInner:'')+
      '</div>'+
      (V.nav==='bottom'||isPhone()?bottomHtml(V):'')+
    '</div>'+
    (!isDrawer&&App.sel?detailInner:'')+
    printSheetHtml()+scanModal()+editModal()+lightbox()+palette()+introModal()+fbModal()+
    '<div class="toasts" id="toasts"></div></div>';
  document.getElementById('app').innerHTML=shell;
  if(App.wide) document.querySelector('.drawer')&&document.querySelector('.drawer').classList.add('wide');
  renderToast(); updateNote();
  if(keep){ var el=document.querySelector('[data-in="'+keep+'"]'); if(el){ el.focus(); if(caret!=null&&el.setSelectionRange){ try{ el.setSelectionRange(caret,caret); }catch(e){} } } }
  if(App.pal){ var p=document.getElementById('palIn'); if(p&&document.activeElement!==p){ p.focus(); } }
  if(App.stream) attachStream();
}
/* Khởi động */
buildPicks(); pickVariant(1);
