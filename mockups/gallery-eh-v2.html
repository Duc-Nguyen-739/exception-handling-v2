<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exception Handling — Mockup Gallery v2 (Logistics Ops)</title>
<style>
/* ================= BASE ================= */
*{box-sizing:border-box}
:root{--mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace}
body{margin:0;font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#dfe2e7;color:#1c2128;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
svg{display:block}

/* ---- gallery chrome ---- */
.gbar{position:sticky;top:0;z-index:99;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:#15181d;color:#e6e9ee;box-shadow:0 3px 14px rgba(0,0,0,.35);max-width:100vw}
.gb-t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8b93a1}
.gb-seg{display:flex;gap:4px;background:#22262d;padding:4px;border-radius:8px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.gb-seg::-webkit-scrollbar{display:none}
.gb-seg button{border:0;background:transparent;color:#9aa3b0;font-size:12px;font-weight:600;padding:7px 13px;border-radius:6px;white-space:nowrap}
.gb-seg button.on{background:#3a4150;color:#fff}
.gb-hint{font-size:11px;color:#6b7280;margin-left:auto}
.stage{padding:20px 16px 60px}
.note{max-width:1280px;margin:0 auto 14px;padding:11px 15px;border-radius:8px;background:#f4f5f7;border:1px solid #d8dce2;font-size:12.5px;line-height:1.6;color:#3c434d}
.note b{color:#15181d}
.note code{font-family:var(--mono);font-size:11px;background:#e6e9ee;padding:1px 5px;border-radius:4px}
.device{max-width:1280px;margin:0 auto}
.device.mobile{max-width:414px}
.app{display:flex;min-height:720px;background:var(--bg);color:var(--tx);border:1px solid var(--edge);border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(10,14,20,.22);position:relative;font-size:13px}
.device.mobile .app{min-height:800px;border:9px solid #191d24;border-radius:30px}

/* ================= THEME TOKENS ================= */
/* A — Ops Console (light, Linear-like) */
body.tA{--bg:#f6f7f8;--panel:#fff;--edge:#e2e5e9;--edge-soft:#eceef1;--tx:#191d23;--tx2:#5b6470;--tx3:#8a93a0;
--accent:#3b5bdb;--accent-soft:#edf1fd;--brand:#d4500f;
--st-kho:#b45309;--st-kho-bg:#fdf3e3;--st-kho-bd:#f0dfbd;--st-res:#0f7b5f;--st-res-bg:#e7f5ef;--st-res-bd:#c6e6d8;--st-liq:#5b6470;--st-liq-bg:#eef0f2;--st-liq-bd:#dcdfe4;--danger:#c22f2f;--danger-bg:#fbeaea;
--side-bg:#fbfcfd;--side-w:224px;--row-h:56px;--th:40px;--r:6px;--ring:0 0 0 3px rgba(59,91,219,.18)}
/* B — Control Tower (dark, KPI-first) */
body.tB{--bg:#0d1117;--panel:#151b24;--edge:#242d3a;--edge-soft:#1c242f;--tx:#d5dbe4;--tx2:#8a95a5;--tx3:#5f6a7a;
--accent:#e8a33d;--accent-soft:rgba(232,163,61,.12);--brand:#e8a33d;
--st-kho:#e8a33d;--st-kho-bg:rgba(232,163,61,.13);--st-kho-bd:rgba(232,163,61,.35);--st-res:#4cc38a;--st-res-bg:rgba(76,195,138,.12);--st-res-bd:rgba(76,195,138,.32);--st-liq:#8a95a5;--st-liq-bg:rgba(138,149,165,.12);--st-liq-bd:rgba(138,149,165,.3);--danger:#f26d6d;--danger-bg:rgba(242,109,109,.12);
--side-bg:#10151d;--side-w:0px;--row-h:54px;--th:38px;--r:5px;--ring:0 0 0 3px rgba(232,163,61,.22)}
/* C — Work Order (paper ledger) */
body.tC{--bg:#f5f3ee;--panel:#fffefb;--edge:#ddd7cb;--edge-soft:#e9e4da;--tx:#23262d;--tx2:#5c6069;--tx3:#8b8f97;
--accent:#1f4d3d;--accent-soft:#e8efeb;--brand:#1f4d3d;
--st-kho:#9a6b1f;--st-kho-bg:#f6eeda;--st-kho-bd:#e2d3ae;--st-res:#1f6b4f;--st-res-bg:#e3efe8;--st-res-bd:#c2dccd;--st-liq:#6a6e76;--st-liq-bg:#e9e8e4;--st-liq-bd:#d5d3cc;--danger:#b03a2e;--danger-bg:#f6e5e2;
--side-bg:#20242b;--side-w:64px;--row-h:74px;--th:54px;--r:3px;--ring:0 0 0 3px rgba(31,77,61,.15)}

/* ================= SIDEBAR ================= */
.side{width:var(--side-w);flex:none;background:var(--side-bg);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:12px 10px;position:relative;z-index:5}
body.tB .side{display:none}
body.tC .side{align-items:center;padding:12px 8px}
body.tC .side .lbl,body.tC .side .side-sec,body.tC .side .side-foot,body.tC .side .side-reset,body.tC .side .kindtog,body.tC .side .flt-i,body.tC .side-brand>span:last-child{display:none}
body.tC .side .nav-i,body.tC .side .flt-i{justify-content:center;padding:10px 0}
body.tC .side .nav-i svg,body.tC .side .flt-i svg{width:18px;height:18px}
.side-brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:13px;color:var(--tx);letter-spacing:.01em}
body.tC .side-brand{justify-content:center;padding:4px 0 14px}
body.tC .side-brand .sb-mark span{display:none}
.sb-mark{width:26px;height:26px;flex:none;border-radius:5px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;letter-spacing:.03em}
body.tC .sb-mark{border-radius:3px}
.side-sec{margin:12px 8px 4px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:var(--tx2);font-size:12.5px;font-weight:500;padding:8px 10px;border-radius:var(--r);text-align:left;white-space:nowrap}
.nav-i:hover{background:var(--edge-soft);color:var(--tx)}
.nav-i.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
body.tC .nav-i.on{background:var(--accent);color:#fff}
.nav-i svg{width:15px;height:15px;flex:none;opacity:.85}
.nav-i .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.flt-i{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--tx2);font-size:12px;font-weight:500;padding:6px 10px;border-radius:var(--r);text-align:left}
.flt-i .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--tx3)}
.flt-i.kho .dot{background:var(--st-kho)}.flt-i.res .dot{background:var(--st-res)}.flt-i.liq .dot{background:var(--st-liq)}
.flt-i.on{background:var(--edge-soft);color:var(--tx);font-weight:600}
.flt-i .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.kindtog{display:flex;gap:6px;padding:4px 8px}
.kindtog button{flex:1;border:1px solid var(--edge);background:var(--panel);color:var(--tx3);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:4px 0;border-radius:4px}
.kindtog button.on{background:var(--tx);border-color:var(--tx);color:var(--panel)}
.side-reset{margin:8px 8px 0;border:0;background:transparent;color:var(--tx3);font-size:11px;font-weight:600;text-align:left;padding:4px 2px}
.side-reset:hover{color:var(--accent)}
.side-foot{margin-top:auto;padding:10px 8px 2px;border-top:1px solid var(--edge);font-size:10.5px;color:var(--tx3);line-height:1.7;white-space:nowrap;overflow:hidden}
.side-foot b{display:block;color:var(--tx2);font-weight:600}

/* ================= MAIN COLUMN ================= */
.body{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:0 18px;min-height:56px;border-bottom:1px solid var(--edge);background:var(--panel);flex-wrap:wrap}
body.tB .top{background:var(--side-bg);border-bottom-color:var(--edge)}
.top-brand{display:flex;align-items:center;gap:10px;min-width:0}
.top-brand .tb-t{font-size:14.5px;font-weight:700;color:var(--tx);letter-spacing:.01em;white-space:nowrap}
body.tC .top-brand .tb-t{font-family:Georgia,'Times New Roman',serif;font-weight:700}
.top-brand .tb-s{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);white-space:nowrap}
body.tA .top-brand .tb-s,body.tC .top-brand{display:none}
.top-brand .hideA{display:none}
body.tB .top-brand .hideA{display:flex}
.sp{flex:1;min-width:0}
.srch{display:flex;align-items:center;gap:8px;height:34px;min-width:0;width:300px;max-width:100%;padding:0 11px;background:var(--bg);border:1px solid var(--edge);border-radius:var(--r)}
.srch:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.srch svg{width:14px;height:14px;color:var(--tx3);flex:none}
.srch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:12.5px;color:var(--tx)}
.srch input::placeholder{color:var(--tx3)}
.srch kbd{font-family:var(--mono);font-size:9.5px;color:var(--tx3);border:1px solid var(--edge);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--panel)}
body.tB .srch{background:var(--bg);width:340px}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r);border:1px solid var(--edge);background:var(--panel);color:var(--tx);font-size:12px;font-weight:600;white-space:nowrap}
.tbtn:hover{border-color:var(--tx3)}
.tbtn svg{width:14px;height:14px;color:var(--tx2)}
.tbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
body.tB .tbtn.pri{background:var(--accent);color:#15181d}
.tbtn.pri svg{color:inherit}
.tbtn.ghost{border-color:transparent;background:transparent;color:var(--tx2);padding:0 8px}
.tbtn.icon{padding:0 9px}
.who{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx2);white-space:nowrap}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
.who b{color:var(--tx);font-weight:600}
.who .role{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);border:1px solid var(--edge);border-radius:3px;padding:1px 5px}

/* ================= KPI STRIP (B) ================= */
.kpis{display:none;gap:1px;background:var(--edge);border-bottom:1px solid var(--edge)}
body.tB .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--side-bg);padding:12px 18px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3)}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--tx);line-height:1.2}
.kpi .v.warn{color:var(--danger)}.kpi .v.ok{color:var(--st-res)}
.kpi .d{font-size:10.5px;color:var(--tx3)}
.kpi .d b{color:var(--st-res);font-weight:600}

/* ================= TOOLBAR ================= */
.tools{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--edge);flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:6px 13px;font-size:11.5px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:6px;border-right:1px solid var(--edge)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--tx);color:var(--panel)}
body.tB .seg button.on{background:var(--accent);color:#15181d}
body.tC .seg button.on{background:var(--accent);color:#fff}
.seg .n{font-family:var(--mono);font-size:10px;opacity:.75}
.tools .meta{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tools .meta b{color:var(--tx2);font-weight:600}
.sortsel{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx3)}
.sortsel select{border:1px solid var(--edge);background:var(--panel);color:var(--tx);font-size:11.5px;border-radius:var(--r);padding:5px 8px;outline:none}
.rangechip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border:1px dashed var(--edge);border-radius:var(--r);font-size:11px;color:var(--tx2);background:transparent}
.rangechip svg{width:12px;height:12px;color:var(--tx3)}
.rangechip b{font-family:var(--mono);font-size:11px;color:var(--tx);font-weight:600}

/* ================= SPLIT: TABLE + DETAIL ================= */
.split{flex:1;display:flex;min-height:0;min-width:0}
.tblwrap{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto}
.cols,.row{display:grid;grid-template-columns:var(--th) minmax(0,1fr) 56px 118px 158px 96px 132px;gap:12px;align-items:center;padding:0 18px;min-width:660px}
.cols{height:34px;border-bottom:1px solid var(--edge);background:var(--panel);position:sticky;top:0;z-index:4;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);flex:none}
.cols span{white-space:nowrap}
.cols .r{cursor:pointer;display:flex;align-items:center;gap:4px}
.cols .r:hover{color:var(--tx)}
.cols .r svg{width:10px;height:10px}
.rows{flex:1}
.row{min-height:var(--row-h);border-bottom:1px solid var(--edge-soft);background:var(--panel);cursor:pointer;position:relative}
.row:hover{background:var(--bg)}
.row.sel{background:var(--accent-soft)}
.row.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
body.tB .row.st-kho::before{background:var(--st-kho)}body.tB .row.st-res::before{background:var(--st-res)}body.tB .row.st-liq::before{background:var(--st-liq)}
body.tB .row{border-left:3px solid transparent}
body.tB .row.st-kho{border-left-color:var(--st-kho)}body.tB .row.st-res{border-left-color:var(--st-res)}body.tB .row.st-liq{border-left-color:var(--st-liq)}
.th{width:var(--th);height:var(--th);border-radius:var(--r);border:1px solid var(--edge);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--tx3);overflow:hidden;flex:none;position:relative}
.th svg{width:45%;height:45%;opacity:.55}
.th .pc{position:absolute;right:-1px;bottom:-1px;font-family:var(--mono);font-size:8px;font-weight:700;background:var(--tx);color:var(--panel);padding:1px 3px;border-radius:3px 0 3px 0;line-height:1.3}
body.tC .th{border-radius:2px}
.c-ord{min-width:0}
.c-ord .code{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--tx);letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.tC .c-ord .code{font-size:12.5px}
.c-ord .desc{font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kbadge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.09em;color:var(--tx3);border:1px solid var(--edge);border-radius:3px;padding:2px 6px;background:var(--bg)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:99px;padding:3px 10px 3px 8px;border:1px solid;white-space:nowrap}
.st .dot{width:6px;height:6px;border-radius:50%;flex:none}
.st.kho{color:var(--st-kho);background:var(--st-kho-bg);border-color:var(--st-kho-bd)}.st.kho .dot{background:var(--st-kho)}
.st.res{color:var(--st-res);background:var(--st-res-bg);border-color:var(--st-res-bd)}.st.res .dot{background:var(--st-res)}
.st.liq{color:var(--st-liq);background:var(--st-liq-bg);border-color:var(--st-liq-bd)}.st.liq .dot{background:var(--st-liq)}
body.tC .st{border-radius:2px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px}
.c-bill{font-family:var(--mono);font-size:11px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-bill.none{color:var(--tx3)}
.c-age{font-size:11px;color:var(--tx2);white-space:nowrap;display:flex;align-items:center;gap:5px}
.c-age svg{width:11px;height:11px;color:var(--tx3)}
.c-age.late{color:var(--danger);font-weight:600}
.c-age.late svg{color:var(--danger)}
.c-by{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tblfoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 18px;border-top:1px solid var(--edge);background:var(--panel);font-size:11px;color:var(--tx3)}
.pager{display:flex;align-items:center;gap:4px}
.pager button{width:24px;height:24px;border:1px solid var(--edge);border-radius:4px;background:var(--panel);color:var(--tx2);font-size:10px;display:flex;align-items:center;justify-content:center}
.pager button.cur{background:var(--tx);color:var(--panel);border-color:var(--tx)}
body.tB .pager button.cur{background:var(--accent);color:#15181d;border-color:var(--accent)}
.empty{margin:40px auto;text-align:center;color:var(--tx3);font-size:12.5px;line-height:1.7}
.empty svg{width:26px;height:26px;margin:0 auto 8px;opacity:.5}

/* ================= DETAIL PANEL ================= */
.detail{width:400px;flex:none;background:var(--panel);border-left:1px solid var(--edge);display:none;flex-direction:column;min-height:0}
.detail.open{display:flex}
.dt-top{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--edge);flex:none}
.dt-top .code{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--tx);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbtn{width:26px;height:26px;border:1px solid var(--edge);border-radius:var(--r);background:var(--panel);color:var(--tx2);display:flex;align-items:center;justify-content:center;flex:none}
.xbtn:hover{color:var(--tx);border-color:var(--tx3)}
.xbtn svg{width:12px;height:12px}
.dt-body{flex:1;overflow:auto;padding:14px}
.phstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.pht{aspect-ratio:1;border:1px solid var(--edge);border-radius:var(--r);background:var(--bg);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--tx3);overflow:hidden}
.pht svg{width:26%;height:26%;opacity:.5}
.pht .pl{position:absolute;left:0;right:0;bottom:0;font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:3px 0;background:var(--panel);border-top:1px solid var(--edge-soft);color:var(--tx2)}
.pht.empty{border-style:dashed}
.pht.empty .pl{background:var(--bg)}
.dt-sec{margin-bottom:14px}
.dt-sec .h{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.dt-sec .h .n{font-family:var(--mono);font-size:9.5px;color:var(--accent);border:1px solid var(--edge);border-radius:3px;padding:0 4px}
.kv{display:flex;flex-direction:column}
.kv .r{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--edge-soft);font-size:12px;min-width:0}
.kv .r:last-child{border-bottom:0}
.kv .k{flex:none;width:88px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);padding-top:2px}
.kv .v{min-width:0;color:var(--tx);line-height:1.5}
.kv .v.mono{font-family:var(--mono);font-size:11.5px}
.kv .v .sub{color:var(--tx3);font-size:10.5px}
.tl{margin:0;padding:0 0 0 3px;list-style:none}
.tl li{position:relative;padding:0 0 14px 18px;border-left:2px solid var(--edge-soft);font-size:11.5px;line-height:1.55;min-width:0}
.tl li:last-child{border-left-color:transparent;padding-bottom:2px}
.tl li::before{content:'';position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--tx3)}

  sc.querySelector('#q').oninput=function(e){S.q=e.target.value;render();var i=document.querySelector('.srch #q');if(i)i.focus()};
  var r=el('<div style="display:flex;align-items:center;gap:8px;min-width:0"><button class="tbtn icon" id="bell" title="Hướng dẫn">'+ic('bell')+'</button><button class="tbtn" id="prn">'+ic('printer')+'<span class="lbl2">In Mã</span></button><button class="tbtn pri" id="cr">'+ic('plus')+'Create</button><div class="who"><b>duc.nguyenvan05</b><span class="role">ADMIN</span><span class="av">DN</span></div></div>');
  t.appendChild(r);
  r.querySelector('#cr').onclick=openCreate;
  r.querySelector('#prn').onclick=function(){toast('Demo: tab In Mã — điện thoại gửi lệnh in về trạm laptop')};
  r.querySelector('#bell').onclick=function(){toast('Demo: popup hướng dẫn 4 bước Tìm / Tạo / Resolve / In Mã')};
  return t;
}

function kpis(){
  var k=el('<div class="kpis"></div>');

  [['Chờ xử lý',cnt('kho'),'đơn đang lưu kho',''],

   ['Quá hạn 72h',over,'cần xem xét thanh lý','warn'],
   ['Thanh lý tuần này',2,'lô L-21 · L-23','']].forEach(function(x){
    k.appendChild(el('<div class="kpi"><span class="k">'+x[0]+'</span><span class="v '+x[3]+'">'+x[1]+'</span><span class="d">'+x[2]+'</span></div>'));

}

function tools(){
  var t=el('<div class="tools"></div>');
  var seg=el('<div class="seg"></div>');
  [['all','Tất cả'],['kho','Lưu kho'],['res','Resolve'],['liq','Thanh Lý']].forEach(function(x){
    var b=el('<button class="'+(S.flt===x[0]?'on':'')+'">'+x[1]+' <span class="n">'+cnt(x[0])+'</span></button>');

  rc.onclick=function(){toast('Demo: chỉnh phạm vi ngày (tối đa 60 ngày)')};t.appendChild(rc);
  var sl=el('<div class="sortsel">'+ic('sort')+'<select id="sort"><option value="new">Mới nhất trước</option><option value="old">Lâu nhất trước</option></select></div>');
  t.appendChild(sl);

  var rf=el('<button class="tbtn icon" id="rf" title="Làm mới">'+ic('refresh')+'</button>');
  rf.onclick=function(){toast('Demo: ↻ đồng bộ đơn từ máy khác (poll 5 phút)')};t.appendChild(rf);

function splitScreen(){
  var sp=el('<div class="split"></div>');
  var tw=el('<div class="tblwrap"></div>');
  tw.appendChild(el('<div class="cols"><span></span><span>Đơn hàng / Mô tả</span><span class="h-kind">Loại</span><span>Trạng thái</span><span class="h-bill">Bill</span><span>Tuổi</span><span class="h-by">Người tạo</span></div>'));
  var rows=el('<div class="rows"></div>');
  var v=vis();
  if(!v.length)rows.appendChild(el('<div class="empty">'+ic('search')+'Không có đơn khớp bộ lọc.<br>Thử đổi trạng thái, loại hoặc phạm vi ngày.</div>'));
  v.forEach(function(i){rows.appendChild(row(i))});
  tw.appendChild(rows);
  tw.appendChild(el('<div class="tblfoot"><span>Trang 1 · '+v.length+' đơn đã tải (cache 150/trang)</span><span class="pager"><button>'+ic('chevL')+'</button><button class="cur">1</button><button>2</button><button>'+ic('chevR')+'</button></span></div>'));
  sp.appendChild(tw);
  sp.appendChild(detail());
  sp.appendChild(el('<div class="scrim"></div>'));
  sp.querySelector('.scrim').onclick=function(){S.sel=null;S.resolving=false;render()};
  return sp;
}

function row(i){
  var r=el('<div class="row st-'+i.st+(S.sel===i.code?' sel':'')+'"></div>');
  r.appendChild(el('<div><div class="th">'+ic(i.kind==='Box'?'box':'tag')+(i.ph?'<span class="pc">'+i.ph+'</span>':'')+'</div></div>'));
  r.appendChild(el('<div class="c-ord"><div class="code">'+i.code+'</div><div class="desc">'+esc(i.desc)+'</div></div>'));
  r.appendChild(el('<div class="c-kind"><span class="kbadge">'+i.kind.toUpperCase()+'</span></div>'));
  r.appendChild(el('<div><span class="st '+ST[i.st].c+'"><span class="dot"></span>'+ST[i.st].lb+'</span></div>'));
  r.appendChild(el('<div class="c-bill'+(i.bill?'':' none')+'">'+(i.bill?esc(i.bill):'—')+'</div>'));
  var late=i.st==='kho'&&i.ageH>=72;
  r.appendChild(el('<div class="c-age'+(late?' late':'')+'">'+(late?ic('alert'):ic('clock'))+ageTxt(i.ageH)+'</div>'));
  r.appendChild(el('<div class="c-by">'+esc(i.by)+'@spx</div>'));
  r.onclick=function(){S.sel=i.code;S.resolving=false;render()};
  return r;
}

function detail(){
  var i=ITEMS.filter(function(x){return x.code===S.sel})[0];
  var d=el('<aside class="detail'+(i?' open':'')+'"></aside>');
  if(!i)return d;
  d.appendChild(el('<div class="dt-top"><span class="code">'+i.code+'</span><span class="kbadge">'+i.kind.toUpperCase()+'</span><button class="xbtn" id="pr" title="In tem">'+ic('printer')+'</button><button class="xbtn" id="x">'+ic('x')+'</button></div>'));
  var bd=el('<div class="dt-body"></div>');
  var ps=el('<div class="dt-sec"><div class="h">Ảnh chứng từ <span class="n">'+i.ph+'/3</span></div></div>');
  var strip=el('<div class="phstrip"></div>');
  var labels=['Ngoại quan','Sản phẩm','Chi tiết khác'];
  for(var k=0;k<3;k++){
    if(k<i.ph)strip.appendChild(el('<div class="pht">'+ic('image')+'<span class="pl">'+labels[k]+'</span></div>'));
    else strip.appendChild(el('<div class="pht empty">'+ic('camera')+'<span class="pl">'+labels[k]+' · trống</span></div>'));
  }
  ps.appendChild(strip);bd.appendChild(ps);
  var kv=el('<div class="dt-sec"><div class="h">Thông tin đơn</div><div class="kv"></div></div>');
  var kvb=kv.querySelector('.kv');
  kvb.appendChild(el('<div class="r"><span class="k">Trạng thái</span><span class="v"><span class="st '+ST[i.st].c+'"><span class="dot"></span>'+ST[i.st].lb+'</span></span></div>'));
  if(i.bill)kvb.appendChild(el('<div class="r"><span class="k">Bill</span><span class="v mono">'+esc(i.bill)+'</span></div>'));
  kvb.appendChild(el('<div class="r"><span class="k">Mô tả</span><span class="v">'+esc(i.desc)+'</span></div>'));
  if(i.note)kvb.appendChild(el('<div class="r"><span class="k">Ghi chú</span><span class="v">'+esc(i.note)+'</span></div>'));
  kvb.appendChild(el('<div class="r"><span class="k">Tạo lúc</span><span class="v mono">'+i.hist[0].ts+'<br><span class="sub">'+esc(i.by)+'@spxexpress.com</span></span></div>'));
  bd.appendChild(kv);
  var tl=el('<div class="dt-sec"><div class="h">Chi tiết trạng thái <span class="n">'+i.hist.length+' mốc</span></div><ul class="tl"></ul></div>');
  var ul=tl.querySelector('.ul,.tl');
  i.hist.slice().reverse().forEach(function(h){
    ul.appendChild(el('<li class="'+h.k+'"><span class="ts">'+h.ts+'</span><div class="ev">'+esc(h.ev)+'</div><div class="who">'+esc(h.who)+'</div>'+(h.bill?'<div class="billl">Bill: '+esc(h.bill)+'</div>':'')+'</li>'));
  });
  bd.appendChild(tl);d.appendChild(bd);
  var ft=el('<div class="dt-foot"></div>');
  if(i.st==='kho'){
    if(S.resolving){
      ft.appendChild(el('<div class="rf"><input id="bi" placeholder="Bill SPXVN… (bắn súng hoặc nhập)"><button class="tbtn pri" id="cf">Confirm</button></div><div class="rf-hint">Enter = xác nhận · bill khớp sẽ đổi sang Resolve và ghi timeline</div>'));
      var inp=ft.querySelector('#bi');
      setTimeout(function(){var x=document.querySelector('#bi');if(x)x.focus()},30);
      function doConfirm(){var v=inp.value.trim();if(!v){toast('Nhập mã bill trước đã');return}
        i.st='res';i.bill=v;i.hist.push({ts:'11/10 09:30',k:'res',ev:'Tìm thấy bill',who:'duc.nguyenvan05@spx',bill:v});
        S.resolving=false;render();toast('Đã Resolve '+i.code+' · '+v)}
      ft.querySelector('#cf').onclick=doConfirm;
      inp.onkeydown=function(e){if(e.key==='Enter')doConfirm()};
    }else{
      var b=el('<button class="tbtn pri" style="width:100%;height:36px">'+ic('check')+'Resolve — đã tìm thấy bill</button>');
      b.onclick=function(){S.resolving=true;render()};ft.appendChild(b);
    }
  }else{
    ft.appendChild(el('<div class="done">'+ic('check')+'Đơn đã '+(i.st==='res'?'Resolve':'Thanh Lý')+' — chỉ ADMIN đổi lại trạng thái trong Edit</div>'));
  }
  d.appendChild(ft);
  d.querySelector('#x').onclick=function(){S.sel=null;S.resolving=false;render()};
  d.querySelector('#pr').onclick=function(){toast('Demo: in tem 4×6in hoặc gửi job về trạm in')};
  return d;
}

function tabScreen(){
  var w=el('<div style="flex:1;min-width:0"></div>');
  var t=S.tab;
  var info={
    'backlog':['layers','Backlog — bảng chờ đối soát','Bảng 16 cột A–P từ sheet Backlog: tìm kiếm toàn cục, sort mọi cột, filter Status/Aging, phân trang 50, chi tiết riêng có Copy Shipment ID. <code>listBacklog()</code> đọc 1 batch, read-only.'],

    'góp ý':['chat','Góp ý nội bộ','Khung chat chung: mỗi tin hiện email + thời gian, chỉ ADMIN thấy nút Reply, câu trả lời hiển thị “Admin”.'],
    'quyền':['shield','Phân quyền','Tab Role: thêm/xóa ADMIN, đổi vai trò STAFF ↔ ADMIN, nút sửa share ảnh cũ <code>fixPhotoSharing()</code>.']
  }[t]||['list','—','—'];
  w.appendChild(el('<div class="soon">'+ic(info[0])+'<h3>'+info[1]+'</h3><p>'+info[2]+'</p><p style="margin-top:10px;font-size:11px;color:var(--tx3)">Mockup tập trung màn Danh sách + Chi tiết — các tab này giữ nguyên luồng app thật.</p></div>'));

/* ================= CREATE MODAL ================= */
function openCreate(){
  var mb=document.getElementById('mbg'),bx=document.getElementById('mbox');
  bx.innerHTML='<div class="m-head"><h3>Create New Task</h3><button class="xbtn x" id="mx">'+ic('x')+'</button></div>'
   +'<div class="m-body"><div class="m-steps"><div class="on">1 · Loại task</div><div>2 · Chi tiết + ảnh</div><div>3 · Xác nhận</div></div>'
   +'<div class="lbl">Kiểu ngoại lệ</div><div class="m-seg"><button class="on" id="s1">Non-AWB Recovery<small>BOX / ITEM mất bill</small></button><button id="s2">Thanh Lý<small>tạo lô thanh lý</small></button></div>'
   +'<div class="lbl">Phân loại</div><div class="m-seg"><button class="on" id="k1" style="text-align:center">BOX<small>đủ 2 ảnh bắt buộc</small></button><button id="k2" style="text-align:center">ITEM<small>1 ảnh sản phẩm</small></button></div>'
   +'<div class="lbl">Mô tả *</div><textarea placeholder="VD: Thùng carton 12 áo thun nam, seal còn nguyên…"></textarea>'
   +'<div class="lbl">Ảnh chứng từ (Box: ngoại quan + sản phẩm)</div><div class="m-slots"><div class="m-slot filled">'+ic('image')+'Ngoại quan</div><div class="m-slot filled">'+ic('image')+'Sản phẩm</div><div class="m-slot">'+ic('plus')+'Thêm</div></div>'
   +'<div class="lbl">Mã nội bộ — server cấp, có thể sửa</div><div class="m-code"><input value="Box.11-10-2026.6"><button class="tbtn" style="height:34px;flex:none">Sửa</button></div></div>'
   +'<div class="m-foot"><button class="tbtn" id="mc">Hủy</button><button class="tbtn pri" id="mok">Confirm</button></div>';
  mb.classList.add('show');
  function close(){mb.classList.remove('show')}
  bx.querySelector('#mx').onclick=close;bx.querySelector('#mc').onclick=close;
  mb.onclick=function(e){if(e.target===mb)close()};
  bx.querySelectorAll('.m-seg').forEach(function(g){g.querySelectorAll('button').forEach(function(b){b.onclick=function(){g.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}})});
  var st=0;
  bx.querySelector('#mok').onclick=function(){
    if(st===0){st=1;this.innerHTML='<span class="spin"></span> Đang tạo…';var self=this;
      setTimeout(function(){self.textContent='Đã lưu ✓';toast('Đã tạo Box.11-10-2026.6 — nút In Mã hiện sau khi Confirm')},900)}
    else close();
  };
}

/* ================= CONTROLS ================= */
var NOTES={
 tA:'<b>A — Ops Console.</b> Bàn điều khiển vận hành kiểu Linear/Shortcut: nền trung tính, bảng dữ liệu đậm đặc, mã đơn <code>monospace</code>, accent xanh dương trầm, sidebar 224px có bộ lọc trạng thái/loại. Chọn A nếu muốn “công cụ làm việc” đúng nghĩa: nhanh, ít nhiễu, scale tốt khi dữ liệu phình to.',
 tB:'<b>B — Control Tower.</b> Phòng điều khiển kho đêm: nền graphite <code>#0d1117</code>, dải KPI dính dưới header (Chờ xử lý / Resolve hôm nay / Quá hạn 72h / Thanh lý tuần này), mỗi dòng có viền trái màu trạng thái, accent hổ phách (màu cảnh báo công nghiệp). Hợp màn hình lớn ở bàn giám sát, ca đêm, ít mỏi mắt.',
 tC:'<b>C — Work Order.</b> Phiếu xử lý hiện đại hóa: nền giấy <code>#f5f3ee</code>, chữ số in mã như phiếu kho, trạng thái kiểu “dấu mộc” uppercase bo góc vuông, serif cho tiêu đề, rail icon 64px tối màu. Cảm giác chắc chắn, đáng tin, khác biệt nhất so với 2 mẫu kia.'
};
function setTheme(t){
  document.body.className=t;
  document.getElementById('themeNote').innerHTML=NOTES[t];
  document.querySelectorAll('#themeSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
}
function setDevice(d){
  var dev=document.getElementById('device');
  dev.classList.toggle('mobile',d==='mob');
  document.querySelectorAll('#devSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.d===d)});
  render();
}
document.querySelectorAll('#themeSeg button').forEach(function(b){b.onclick=function(){setTheme(b.dataset.t)}});
document.querySelectorAll('#devSeg button').forEach(function(b){b.onclick=function(){setDevice(b.dataset.d)}});
(function(){
  var h=(location.hash||'').replace(/^#/,'').split('&');
  if(/^t[ABC]$/.test(h[0]))setTheme(h[0]);
  var mob=h.indexOf('mob')>=0;
  var dev=document.getElementById('device');
  dev.classList.toggle('mobile',mob);
  document.querySelectorAll('#devSeg button').forEach(function(b){b.classList.toggle('on',b.dataset.d===(mob?'mob':'desk'))});
  if(h.indexOf('sel')>=0)S.sel=ITEMS[0].code;
  render();
})();
</script>
