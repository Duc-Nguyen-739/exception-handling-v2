<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exception Handling — Mockup v7 (Glass Teal · blend T4 × Bento 03)</title>
<style>
/* ================= BASE ================= */
*{box-sizing:border-box}
:root{--mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace}
body{margin:0;font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#dfe2e7;color:#1c2128;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
svg{display:block}
::selection{background:rgba(99,102,241,.25)}

/* ---- gallery chrome ---- */
.gbar{position:sticky;top:0;z-index:300;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:#101216;color:#e6e9ee;box-shadow:0 3px 14px rgba(0,0,0,.35)}
.gb-t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8b93a1}
.gb-seg{display:flex;gap:4px;background:#1f232b;padding:4px;border-radius:99px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.gb-seg::-webkit-scrollbar{display:none}
.gb-seg button{border:0;background:transparent;color:#9aa3b0;font-size:12px;font-weight:600;padding:7px 14px;border-radius:99px;white-space:nowrap}
.gb-seg button.on{background:#333a46;color:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.gb-hint{font-size:11px;color:#6b7280;margin-left:auto}
.stage{padding:18px 16px 60px}
.note{max-width:1320px;margin:0 auto 12px;padding:10px 14px;border-radius:10px;background:#f4f5f7;border:1px solid #d8dce2;font-size:12.5px;line-height:1.6;color:#3c434d}
.note b{color:#15181d}
.note i{font-style:normal;color:#4f46e5;font-weight:600}
.device{max-width:1320px;margin:0 auto}
.device.mobile{max-width:414px}
.app{min-height:720px;background:var(--bg);color:var(--tx);border:1px solid var(--edge);border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(10,14,20,.22);position:relative;font-size:13px;display:flex}
.device.mobile .app{min-height:0;height:780px;border:9px solid #16181d;border-radius:34px}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}

/* ================= THEME TOKENS ================= */
/* T1 — Quiet Ops (Linear calm, light) */
body.T1{--bg:#fbfbfc;--panel:#fff;--edge:#e8e9ec;--edge-soft:#f1f2f4;--tx:#1f2328;--tx2:#68707c;--tx3:#9aa1ab;
--accent:#4f46e5;--accent-soft:#eef0fd;--glow:none;
--st-kho:#a16207;--st-kho-bg:#faf3e0;--st-res:#0f7b5f;--st-res-bg:#e7f5ef;--st-liq:#68707c;--st-liq-bg:#f0f1f3;--danger:#d13438;--danger-bg:#fdecec;
--side-bg:#f7f7f9;--side-w:216px;--ar:4/3;--gmin:250px;--r:10px;--r2:14px;
--cardsh:0 1px 2px rgba(17,20,24,.05);--cardsh-h:0 10px 28px rgba(17,20,24,.10);
--ring:0 0 0 3px rgba(79,70,229,.16)}
/* T2 — Nightshift (dark-first, Vercel restraint) */
body.T2{--bg:#0a0d12;--panel:#11151c;--edge:#1e2530;--edge-soft:#161c25;--tx:#dde4ee;--tx2:#8894a5;--tx3:#5a6575;
--accent:#7dc4ff;--accent-soft:rgba(125,196,255,.10);--glow:0 0 34px rgba(125,196,255,.07);
--st-kho:#f5b04c;--st-kho-bg:rgba(245,176,76,.10);--st-res:#57d99a;--st-res-bg:rgba(87,217,154,.10);--st-liq:#8894a5;--st-liq-bg:rgba(136,148,165,.10);--danger:#ff6b6b;--danger-bg:rgba(255,107,107,.10);
--side-bg:#0c1016;--side-w:0px;--ar:1/1;--gmin:196px;--r:8px;--r2:12px;
--cardsh:0 1px 0 rgba(255,255,255,.02) inset;--cardsh-h:0 12px 34px rgba(0,0,0,.55),0 0 0 1px rgba(125,196,255,.25);
--ring:0 0 0 3px rgba(125,196,255,.22)}
/* T3 — Bento Warehouse (premium light, Mercury/PostHog) */
body.T3{--bg:#f1f2f5;--panel:#fff;--edge:#e5e7eb;--edge-soft:#eef0f3;--tx:#151821;--tx2:#5f6673;--tx3:#98a0ac;
--accent:#0e8f7e;--accent-soft:#e4f4f1;--glow:none;
--st-kho:#b45309;--st-kho-bg:#fdf3e3;--st-res:#0f7b5f;--st-res-bg:#e7f5ef;--st-liq:#5b6470;--st-liq-bg:#eef0f2;--danger:#d13438;--danger-bg:#fbeaea;
--side-bg:#101318;--side-w:0px;--ar:3/2;--gmin:280px;--r:14px;--r2:20px;
--cardsh:0 1px 2px rgba(17,20,24,.05);--cardsh-h:0 14px 34px rgba(17,20,24,.12);
--ring:0 0 0 3px rgba(14,143,126,.18)}
/* T4 — Glass Float (glassmorphism light) */
body.T4{--bg:#eef1fb;--panel:rgba(255,255,255,.62);--edge:rgba(255,255,255,.8);--edge-soft:rgba(255,255,255,.45);--tx:#232a45;--tx2:#5d6684;--tx3:#98a0bb;
--accent:#6d5ef1;--accent-soft:rgba(109,94,241,.12);--glow:none;
--st-kho:#b45309;--st-kho-bg:rgba(180,83,9,.12);--st-res:#0d9464;--st-res-bg:rgba(13,148,100,.12);--st-liq:#5d6684;--st-liq-bg:rgba(93,102,132,.12);--danger:#d13438;--danger-bg:rgba(209,52,56,.12);
--side-bg:rgba(255,255,255,.5);--side-w:210px;--ar:4/3;--gmin:250px;--r:16px;--r2:24px;
--cardsh:0 8px 32px rgba(35,42,69,.10);--cardsh-h:0 16px 44px rgba(35,42,69,.16);
--ring:0 0 0 3px rgba(109,94,241,.20)}
/* T5 — Neo-Brutal Depot */
body.T5{--bg:#fffdf5;--panel:#fff;--edge:#141414;--edge-soft:#efe9d8;--tx:#141414;--tx2:#4b4636;--tx3:#8b8571;
--accent:#ffd426;--accent-soft:#fff3bf;--glow:none;
--st-kho:#b45309;--st-kho-bg:#ffe9c7;--st-res:#0d7a4f;--st-res-bg:#c9f2da;--st-liq:#4b4636;--st-liq-bg:#e9e4d5;--danger:#e02d2d;--danger-bg:#ffd6d6;
--side-bg:#fffdf5;--side-w:0px;--ar:1/1;--gmin:230px;--r:0px;--r2:0px;
--cardsh:5px 5px 0 #141414;--cardsh-h:8px 8px 0 #141414;
--ring:0 0 0 3px #141414}
/* T6 — Aurora Dark */
body.T6{--bg:#0b1020;--panel:rgba(255,255,255,.045);--edge:rgba(255,255,255,.10);--edge-soft:rgba(255,255,255,.06);--tx:#e7eaf6;--tx2:#9aa3c0;--tx3:#667091;
--accent:#8b7cf6;--accent-soft:rgba(139,124,246,.14);--glow:0 0 40px rgba(139,124,246,.10);
--st-kho:#f5b04c;--st-kho-bg:rgba(245,176,76,.12);--st-res:#4ade80;--st-res-bg:rgba(74,222,128,.12);--st-liq:#9aa3c0;--st-liq-bg:rgba(154,163,192,.12);--danger:#fb7185;--danger-bg:rgba(251,113,133,.12);
--side-bg:rgba(255,255,255,.03);--side-w:210px;--ar:4/3;--gmin:250px;--r:14px;--r2:20px;
--cardsh:0 10px 34px rgba(0,0,0,.35);--cardsh-h:0 16px 44px rgba(0,0,0,.5);
--ring:0 0 0 3px rgba(139,124,246,.30)}
/* T7 — Swiss Grid */
body.T7{--bg:#fff;--panel:#fff;--edge:#e1e1e1;--edge-soft:#f0f0f0;--tx:#101010;--tx2:#555;--tx3:#999;
--accent:#e30613;--accent-soft:#fdecec;--glow:none;
--st-kho:#8a5a00;--st-kho-bg:#f5efdf;--st-res:#0d7a4f;--st-res-bg:#e2f3ea;--st-liq:#555;--st-liq-bg:#f0f0f0;--danger:#e30613;--danger-bg:#fdecec;
--side-bg:#fafafa;--side-w:0px;--ar:3/2;--gmin:280px;--r:0px;--r2:0px;
--cardsh:none;--cardsh-h:0 8px 24px rgba(0,0,0,.08);
--ring:0 0 0 2px #101010}
/* T8 — Clay Soft */
body.T8{--bg:#eef0f8;--panel:#f4f6fd;--edge:#dfe3f0;--edge-soft:#e6eaf5;--tx:#3a3f55;--tx2:#6d7490;--tx3:#9aa1bb;
--accent:#6c5ce7;--accent-soft:#e7e2fc;--glow:none;
--st-kho:#c07a1a;--st-kho-bg:#f8ecd8;--st-res:#12a06d;--st-res-bg:#ddf3e9;--st-liq:#6d7490;--st-liq-bg:#e6eaf5;--danger:#e05555;--danger-bg:#fbe4e4;
--side-bg:#eef0f8;--side-w:210px;--ar:4/3;--gmin:250px;--r:18px;--r2:26px;
--cardsh:9px 9px 20px #d6dae8,-9px -9px 20px #fff;--cardsh-h:12px 12px 26px #d2d6e4,-12px -12px 26px #fff;
--ring:0 0 0 3px rgba(108,92,231,.25)}
/* T9 — Terminal Ops */
body.T9{--bg:#04090c;--panel:#071219;--edge:#123a44;--edge-soft:#0a1e26;--tx:#c8f7e0;--tx2:#5fae94;--tx3:#3d7a67;
--accent:#2dd4a0;--accent-soft:rgba(45,212,160,.10);--glow:0 0 26px rgba(45,212,160,.06);
--st-kho:#f5b04c;--st-kho-bg:rgba(245,176,76,.10);--st-res:#2dd4a0;--st-res-bg:rgba(45,212,160,.10);--st-liq:#5fae94;--st-liq-bg:rgba(95,174,148,.10);--danger:#ff6b6b;--danger-bg:rgba(255,107,107,.10);
--side-bg:#04090c;--side-w:0px;--ar:4/3;--gmin:230px;--r:2px;--r2:2px;
--cardsh:none;--cardsh-h:0 0 22px rgba(45,212,160,.12);
--ring:0 0 0 1px #2dd4a0}
/* T10 — Paper & Ink */
body.T10{--bg:#faf6ef;--panel:#fffdf8;--edge:#e6ddcb;--edge-soft:#efe8da;--tx:#2b2620;--tx2:#6b6154;--tx3:#9b9184;
--accent:#b4551d;--accent-soft:#f7e8dc;--glow:none;
--st-kho:#8a5a00;--st-kho-bg:#f6ecd8;--st-res:#2e6b4f;--st-res-bg:#e4efe7;--st-liq:#6b6154;--st-liq-bg:#efe8da;--danger:#a83232;--danger-bg:#f6e2e0;
--side-bg:#f4eee2;--side-w:0px;--ar:3/2;--gmin:290px;--r:12px;--r2:16px;
--cardsh:0 1px 3px rgba(70,50,20,.10);--cardsh-h:0 10px 30px rgba(70,50,20,.14);
--ring:0 0 0 3px rgba(180,85,29,.18)}

/* ================= SIDEBAR (T1) ================= */
.side{width:var(--side-w);flex:none;background:var(--side-bg);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:14px 10px;position:relative;z-index:20}
body:not(.T1):not(.T4):not(.T6):not(.T8) .side{display:none}
.side-brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;font-weight:700;font-size:13px;color:var(--tx)}
.sb-mark{width:26px;height:26px;flex:none;border-radius:8px;background:linear-gradient(135deg,#4f46e5,#7c6cf0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:14px 8px 6px}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:var(--tx2);font-size:12.5px;font-weight:600;padding:8px 9px;border-radius:8px;text-align:left}
.nav-i svg{width:15px;height:15px;flex:none}
.nav-i:hover{background:var(--edge-soft);color:var(--tx)}
.nav-i.on{background:var(--panel);color:var(--tx);box-shadow:0 1px 3px rgba(17,20,24,.08)}
.nav-i .n{margin-left:auto;font-size:10px;font-weight:700;color:var(--tx3);background:var(--edge-soft);border-radius:99px;padding:1px 7px}
.flt-i{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--tx2);font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;text-align:left}
.flt-i .dot{width:7px;height:7px;border-radius:50%;flex:none}
.flt-i b{margin-left:auto;font-weight:700;font-size:10.5px;color:var(--tx3)}
.flt-i.on{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;padding:10px 9px;border-top:1px solid var(--edge);font-size:10.5px;color:var(--tx3);line-height:1.5}
.side-foot b{display:block;color:var(--tx2)}

/* ================= TOPBAR ================= */
.cmd{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--edge);background:var(--panel)}
body.T2 .cmd{background:rgba(17,21,28,.85);backdrop-filter:blur(8px)}
.cmd h1{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.cmd h1 small{font-weight:500;color:var(--tx3);font-size:11px;margin-left:8px}
.srch{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);background:var(--bg);border-radius:99px;padding:7px 12px;min-width:150px;max-width:300px;flex:1;color:var(--tx3)}
body.T1 .srch{cursor:pointer}
.srch svg{width:14px;height:14px;flex:none}
.srch input{border:0;outline:0;background:transparent;color:var(--tx);font-size:12.5px;width:100%;min-width:0}
.srch kbd{font-family:var(--mono);font-size:9.5px;color:var(--tx3);border:1px solid var(--edge);border-radius:5px;padding:1px 5px;background:var(--panel);white-space:nowrap}
.cmd-act{display:flex;gap:8px;align-items:center;margin-left:auto}
.ico-b{width:32px;height:32px;border:1px solid var(--edge);border-radius:9px;background:var(--panel);color:var(--tx2);display:flex;align-items:center;justify-content:center;position:relative}
.ico-b svg{width:15px;height:15px}
.ico-b .bdot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--edge);background:var(--panel);color:var(--tx);font-size:12px;font-weight:600;border-radius:99px;padding:8px 13px}
.btn svg{width:14px;height:14px}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--tx);border-color:var(--tx);color:var(--bg)}
body.T2 .btn.pri{background:var(--accent);border-color:var(--accent);color:#0a0d12;font-weight:700}
body.T3 .btn.pri{background:linear-gradient(135deg,#0e8f7e,#12a994);border:0;color:#fff;box-shadow:0 4px 14px rgba(14,143,126,.35)}
.who{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--tx2);font-weight:600}
.who .av{width:27px;height:27px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;border:1px solid var(--edge)}

/* ================= CHIPS ROW ================= */
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 18px;flex-wrap:wrap}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);background:var(--panel);color:var(--tx2);font-size:11.5px;font-weight:600;border-radius:99px;padding:6px 12px}
.chip i{font-style:normal;font-size:10px;color:var(--tx3);font-family:var(--mono)}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
body.T2 .chip.on{background:var(--accent);border-color:var(--accent);color:#0a0d12}
.chip .dot{width:6px;height:6px;border-radius:50%}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb-meta{font-size:11px;color:var(--tx3)}

/* ================= KPI / BENTO ================= */
.stats{display:none;gap:10px;padding:14px 18px 4px}
body.T2 .stats,body.T5 .stats,body.T9 .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{border:1px solid var(--edge);border-radius:var(--r);padding:12px 14px;background:var(--panel);box-shadow:var(--glow);position:relative;overflow:hidden}
.stat .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--tx);margin-top:4px;letter-spacing:-.02em}
.stat .v em{font-style:normal;font-size:10px;color:var(--tx3);margin-left:6px;font-family:inherit}
.stat.warn .v{color:var(--danger)}
.stat .spark{position:absolute;right:0;bottom:0;opacity:.5}
.bento{display:none;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(86px,auto);gap:12px;padding:16px 18px 4px}
body.T3 .bento,body.T4 .bento{display:grid}
.bt{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r2);padding:16px;box-shadow:var(--cardsh);min-width:0}
.bt .k{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.bt .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;color:var(--tx)}
.bt .v em{font-style:normal;font-size:11px;color:var(--tx3);font-weight:600;margin-left:5px}
.bt.hero-tile{grid-row:span 2;background:linear-gradient(150deg,#123f3a,#0e8f7e 130%);color:#fff;border:0}
.bt.hero-tile .k{color:rgba(255,255,255,.65)}
.bt.hero-tile .v{color:#fff;font-size:34px}
.bt.hero-tile .sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:6px;line-height:1.5}
.bt.wide{grid-column:span 2}
.bars{display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:10px}
.bars i{flex:1;background:var(--accent-soft);border-radius:4px 4px 2px 2px;position:relative}
.bars i.hi{background:var(--accent)}
.bars-lb{display:flex;justify-content:space-between;font-size:9px;color:var(--tx3);margin-top:5px;font-family:var(--mono)}
.feed{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.feed .f{display:flex;gap:9px;align-items:center;font-size:11.5px;color:var(--tx2);min-width:0}
.feed .f .dot{width:7px;height:7px;border-radius:50%;flex:none}
.feed .f b{color:var(--tx);font-weight:650;font-family:var(--mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .f span{margin-left:auto;flex:none;color:var(--tx3);font-size:10px}

/* ================= PHOTO BOARD ================= */
.boardwrap{flex:1;overflow:auto;position:relative;padding-bottom:16px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gmin),1fr));gap:16px;padding:6px 18px 20px;align-content:start}
body.T2 .board{gap:10px;padding:6px 18px 20px}
body.T3 .walllb{padding:16px 18px 0;font-size:12.5px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:8px} body.T3 .walllb svg{width:15px;height:15px;color:var(--accent);flex:none}
body.T3 .walllb small{font-weight:500;color:var(--tx3);font-size:11px}
body:not(.T3) .walllb{display:none}
body.T3 .board{display:flex;overflow-x:auto;padding:12px 18px 20px;gap:14px;scroll-snap-type:x mandatory}
body.T3 .board .card{flex:0 0 300px;scroll-snap-align:start}
body.T3 .board .empty{flex:none}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r2);overflow:hidden;cursor:pointer;box-shadow:var(--cardsh);position:relative;min-width:0;transition:transform .14s,box-shadow .14s}
.card:hover{transform:translateY(-3px);box-shadow:var(--cardsh-h)}
.card.sel{box-shadow:var(--ring);border-color:transparent}
.frame{position:relative;aspect-ratio:var(--ar);background:#d8d5d0;overflow:hidden}
.frame svg{width:100%;height:100%}
.ftag{position:absolute;top:9px;left:9px;font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(12,15,20,.55);backdrop-filter:blur(3px);padding:3px 8px;border-radius:99px}
.fage{position:absolute;bottom:9px;right:9px;display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:600;color:#fff;background:rgba(12,15,20,.55);backdrop-filter:blur(3px);padding:3px 8px;border-radius:99px}
.fage svg{width:11px;height:11px}
.frame .ovd{position:absolute;bottom:9px;left:9px;display:flex;align-items:center;gap:4px;font-size:9px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--danger);padding:3px 9px;border-radius:99px;text-transform:uppercase}
.frame .ovd svg{width:11px;height:11px}
.cinfo{padding:11px 13px 12px;display:flex;flex-direction:column;gap:5px}
.crow{display:flex;align-items:center;gap:7px;min-width:0}
.code{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.pill{margin-left:auto;flex:none;font-size:9px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:99px;border:1px solid transparent}
.p-kho{color:var(--st-kho);background:var(--st-kho-bg)}
.p-res{color:var(--st-res);background:var(--st-res-bg)}
.p-liq{color:var(--st-liq);background:var(--st-liq-bg)}
body.T2 .pill{border-color:var(--edge)}
.desc{margin:0;font-size:11.5px;line-height:1.45;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.T1 .desc{-webkit-line-clamp:1}
.cfoot{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--tx3);border-top:1px solid var(--edge-soft);padding-top:8px;margin-top:2px}
.cfoot .nphoto{display:flex;align-items:center;gap:3px}
.cfoot .nphoto svg{width:11px;height:11px}
.cfoot .go{margin-left:auto;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:2px}
.cfoot .go svg{width:12px;height:12px}
.ck{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:8px;border:2px solid rgba(255,255,255,.85);background:rgba(12,15,20,.4);z-index:3;display:flex;align-items:center;justify-content:center;color:transparent}
.ck svg{width:13px;height:13px}
.card.checked .ck{background:var(--accent);border-color:var(--accent);color:#0a0d12}
.batch{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;background:var(--tx);color:var(--bg);border-radius:14px;padding:10px 16px;font-size:12.5px;font-weight:650;box-shadow:0 12px 34px rgba(0,0,0,.35);white-space:nowrap}
body.T2 .batch{background:#e8edf3;color:#10151a}
.batch button{border:0;border-radius:99px;font-size:12px;font-weight:700;padding:7px 13px;background:var(--accent);color:#fff}
body.T2 .batch button{color:#0a0d12}
.batch .cx{background:transparent;color:inherit;opacity:.75;padding:7px 8px}
.empty{padding:60px 20px;text-align:center;color:var(--tx3);font-size:12.5px}

/* ================= DETAIL ================= */
.drawer{position:absolute;top:0;right:0;bottom:0;width:450px;max-width:94%;background:var(--panel);border-left:1px solid var(--edge);z-index:50;display:flex;box-shadow:-16px 0 44px rgba(10,14,20,.16);animation:slidein .18s ease-out}
body.T2 .drawer{box-shadow:-16px 0 44px rgba(0,0,0,.6)}
@keyframes slidein{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
body.T2 .drawer{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:880px;max-width:94%;height:600px;max-height:86%;border:1px solid var(--edge);border-radius:18px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto auto 1fr auto;animation:pop .18s ease-out}
body.T2 .drawer .dhero{grid-column:1;grid-row:1}
body.T2 .drawer .strip{grid-column:1;grid-row:2}
body.T2 .drawer .dhead{grid-column:2;grid-row:1}
body.T2 .drawer .dbody{grid-column:2;grid-row:2/span 2}
body.T2 .drawer .dfoot{grid-column:1/-1;grid-row:4}
@keyframes pop{from{transform:translate(-50%,-46%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
body.T2 .drawer .dpanel{display:contents}
body.T2 .drawer .dscrim{display:none}
.t2scrim{position:absolute;inset:0;background:rgba(4,6,10,.66);z-index:49;display:none}
body.T2 .t2scrim{display:block}
body:not(.T2) .drawer .dscrim{display:none}
body.T2 .device.mobile .drawer{display:flex;position:absolute;left:0;right:0;top:0;bottom:0;width:auto;max-width:none;height:auto;max-height:none;transform:none;border:0;border-radius:0;grid-template-columns:none;grid-template-rows:none}
body.T2 .device.mobile .drawer .dpanel{display:flex}
.dpanel{flex:1;min-width:0;display:flex;flex-direction:column}
.dhero{border-bottom:1px solid var(--edge)}
.dhero .frame{aspect-ratio:4/3;max-height:320px}
.dhero .frame svg{object-fit:cover}
.dhead{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--edge)}
.dhead .code{font-size:13px;font-weight:700}
.dbody{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:13px}
.strip{display:flex;gap:8px;padding:10px 16px 0}
.strip .th{width:58px;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--edge);cursor:pointer;position:relative;background:#d8d5d0}
.strip .th.on{border-color:var(--accent);box-shadow:var(--ring)}
.strip .th svg{width:100%;height:100%}
.strip .th .tl{position:absolute;left:0;right:0;bottom:0;font-size:7.5px;font-weight:700;text-align:center;color:#fff;background:rgba(12,15,20,.55);padding:2px 0;white-space:nowrap;overflow:hidden}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;font-size:12px}
.kv dt{color:var(--tx3);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;color:var(--tx)}
.kv dd .mono{font-family:var(--mono);font-size:11px}
.sec-t{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.tl{position:relative;padding-left:20px;display:flex;flex-direction:column;gap:11px}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1.5px;background:var(--edge)}
.tl .ev{position:relative;font-size:11.5px;line-height:1.5}
.tl .ev::before{content:"";position:absolute;left:-19px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--panel);border:2px solid var(--tx3)}
.tl .ev.k-kho::before{border-color:var(--st-kho)}
.tl .ev.k-res::before{border-color:var(--st-res)}
.tl .ev.k-liq::before{border-color:var(--st-liq)}
.tl .ev b{display:block;color:var(--tx);font-weight:650}
.tl .ev span{color:var(--tx3);font-size:10.5px}
.dfoot{border-top:1px solid var(--edge);padding:13px 16px;background:var(--bg)}
.dfoot .row-in{display:flex;gap:8px}
.dfoot input{flex:1;min-width:0;border:1px solid var(--edge);border-radius:10px;background:var(--panel);color:var(--tx);font-family:var(--mono);font-size:12px;padding:9px 12px;outline:0}
.dfoot input:focus{box-shadow:var(--ring);border-color:var(--accent)}
.done{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--st-res-bg);color:var(--st-res);font-size:12px;font-weight:650;border:1px solid var(--edge)}
.done svg{width:14px;height:14px}
.hintline{font-size:10.5px;color:var(--tx3);margin-top:8px;line-height:1.5}

/* ================= COMMAND PALETTE ================= */
.pal{position:fixed;inset:0;z-index:400;background:rgba(6,8,12,.5);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:12vh 20px 20px}
.pal.open{display:flex}
.palbox{width:560px;max-width:100%;background:#fff;border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.45);overflow:hidden;color:#1f2328}
.palin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #eceef1}
.palin svg{width:15px;height:15px;color:#9aa1ab}
.palin input{border:0;outline:0;font-size:14px;width:100%;color:#1f2328;background:transparent}
.pallist{max-height:320px;overflow:auto;padding:6px}
.palitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:12.5px;color:#3c434d;cursor:pointer}
.palitem svg{width:13px;height:13px;color:#9aa1ab;flex:none}
.palitem .pc{font-family:var(--mono);font-size:10.5px}
.palitem .pr{margin-left:auto;font-size:9.5px;color:#9aa1ab;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.palitem.on{background:#eef0fd;color:#1f2328}
.pal-foot{border-top:1px solid #eceef1;padding:9px 14px;font-size:10px;color:#9aa1ab;display:flex;gap:14px}
.pal-foot kbd{font-family:var(--mono);border:1px solid #e2e5e9;border-radius:4px;padding:0 4px}

/* ================= TAB PLACEHOLDER / MOBILE ================= */
.tabph{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
.tabph .box{text-align:center;border:1px dashed var(--edge);border-radius:16px;padding:38px 30px;background:var(--panel);max-width:420px}
.tabph svg{width:26px;height:26px;color:var(--tx3);margin:0 auto 12px}
.tabph h3{margin:0 0 8px;font-size:14px}
.tabph p{margin:0;font-size:12px;color:var(--tx2);line-height:1.6}
.mnav{display:none}
.device.mobile .mnav{display:flex;position:absolute;left:0;right:0;bottom:0;height:58px;background:var(--panel);border-top:1px solid var(--edge);z-index:44;align-items:center;justify-content:space-around;padding:0 8px}
.mnav .m-i{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--tx3);font-size:9px;font-weight:700;padding:6px 10px}
.mnav .m-i svg{width:17px;height:17px}
.mnav .m-i.on{color:var(--accent)}
.fab{position:absolute;right:16px;bottom:70px;width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.3);z-index:45}
body.T1 .fab{color:#fff}
body.T2 .fab{color:#0a0d12}
.fab svg{width:22px;height:22px}
.device.mobile .side{display:none}
.device.mobile .cmd h1{display:none}
.device.mobile .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.device.mobile .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
.device.mobile .bt.hero-tile{grid-column:span 2}
.device.mobile .board{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:4px 12px 84px}
.device.mobile .cinfo{padding:8px 10px 10px}
.device.mobile .desc{-webkit-line-clamp:1}
.device.mobile .cfoot .go{display:none}
.device.mobile .toolbar{padding:10px 12px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.device.mobile .drawer{top:0;left:0;right:0;bottom:0;width:auto;max-width:none;border:0;box-shadow:none;animation:none;transform:none!important;position:absolute}
.device.mobile .drawer .dpanel{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--edge);display:flex;flex-direction:column;animation:sheetup .2s ease-out;z-index:2}
.device.mobile .drawer .dscrim{display:block!important;position:absolute;inset:0;background:rgba(6,8,12,.55);z-index:1}
.device.mobile .dhero .frame{aspect-ratio:16/9;max-height:220px}
@keyframes sheetup{from{transform:translateY(40px)}to{transform:none}}

/* ================= MODAL / TOAST ================= */
.mbg{position:fixed;inset:0;background:rgba(6,8,12,.55);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.mbg.open{display:flex}
.mbox{width:520px;max-width:100%;max-height:92vh;overflow:auto;background:#fff;color:#1c2128;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.4);padding:22px;font-size:13px}
.mbox h3{margin:0 0 4px;font-size:15px}
.steps{display:flex;gap:6px;margin:14px 0 16px}
.steps i{flex:1;height:3px;border-radius:2px;background:#e2e5e9;font-style:normal}
.steps i.on{background:#4f46e5}
.f-lb{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8a93a0;margin:14px 0 6px}
.f-seg{display:flex;gap:6px}
.f-seg button{flex:1;border:1px solid #d8dce2;background:#fff;color:#5b6470;border-radius:10px;padding:9px 0;font-size:12px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:6px}
.f-seg button svg{width:13px;height:13px}
.f-seg button.on{border-color:#4f46e5;background:#eef0fd;color:#4f46e5}
.mbox textarea{width:100%;border:1px solid #d8dce2;border-radius:10px;padding:10px;font-size:12.5px;min-height:74px;resize:vertical;color:#1c2128;outline:0}
.mbox input.mono{width:100%;border:1px solid #d8dce2;border-radius:10px;padding:10px;font-family:var(--mono);font-size:12.5px;color:#1c2128;outline:0}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{aspect-ratio:4/3;border:1.5px dashed #cdd3da;border-radius:10px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:#8a93a0;font-size:10px;font-weight:600;background:#f8f9fb;cursor:pointer}
.slot svg{width:16px;height:16px}
.slot.filled{border-style:solid;border-color:#4f46e5;background:#eef0fd;color:#4f46e5;position:relative;overflow:hidden;padding:0}
.slot.filled svg.photo{position:absolute;inset:0;width:100%;height:100%}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#101216;color:#fff;font-size:12.5px;font-weight:600;padding:11px 18px;border-radius:99px;box-shadow:0 12px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.25s;z-index:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* ============ THEME PERSONALITY ============ */
body.T4 .app{background:radial-gradient(900px 500px at 12% -8%,#dfe4ff,transparent),radial-gradient(800px 480px at 95% 8%,#ffe3f1,transparent),radial-gradient(900px 600px at 60% 110%,#d9f8ef,transparent),var(--bg)}
body.T4 .card,body.T4 .drawer,body.T4 .cmd,body.T4 .bt,body.T4 .side,body.T4 .stat{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
body.T4 .frame{border-radius:var(--r2) var(--r2) 0 0}
body.T5 .card,body.T5 .btn,body.T5 .chip,body.T5 .ico-b,body.T5 .stat,body.T5 .pill,body.T5 .drawer,body.T5 .cmd,body.T5 .dfoot input{border-width:2px;border-color:#141414}
body.T5 .pill,body.T5 .chip,body.T5 .ftag,body.T5 .btn,body.T5 .lbl,body.T5 .stat .k{letter-spacing:.06em}
body.T5 .btn.pri{background:#ffd426;color:#141414;box-shadow:3px 3px 0 #141414}
body.T5 .card:hover{transform:translate(-2px,-2px)}
body.T5 .ftag,body.T5 .fage,body.T5 .ovd,body.T5 .chip,body.T5 .btn,body.T5 .pill{border-radius:0}
body.T5 .chip.on{background:#ffd426;color:#141414}
body.T5 .side{border-right-width:2px}
body.T6 .app{background:radial-gradient(800px 420px at 85% -10%,rgba(139,124,246,.25),transparent),radial-gradient(700px 420px at -10% 30%,rgba(56,189,248,.14),transparent),radial-gradient(700px 500px at 60% 120%,rgba(236,72,153,.10),transparent),var(--bg)}
body.T6 .card,body.T6 .drawer,body.T6 .cmd,body.T6 .bt,body.T6 .stat,body.T6 .side{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.T7 .card{border:0;border-top:2px solid #101010;border-radius:0}
body.T7 .cmd{border-bottom:2px solid #101010}
body.T7 .cmd h1{font-size:21px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
body.T7 .pill,body.T7 .btn,body.T7 .chip,body.T7 .ico-b{border-radius:0}
body.T7 .chip,body.T7 .btn{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px}
body.T7 .chip.on,body.T7 .btn.pri{background:#101010;color:#fff;border-color:#101010}
body.T7 .ftag,body.T7 .fage,body.T7 .ovd{border-radius:0;background:#101418}
body.T7 .cinfo{border-top:1px solid var(--edge)}
body.T7 .drawer{border-left:2px solid #101010}
body.T8 .frame{border-radius:20px 20px 0 0}
body.T8 .card{border-color:transparent}
body.T8 .btn,body.T8 .chip,body.T8 .ico-b{border-color:transparent;box-shadow:4px 4px 10px #dcdfe9,-4px -4px 10px #fff}
body.T8 .btn.pri{background:var(--accent);color:#fff;box-shadow:4px 4px 10px rgba(108,92,231,.4),-3px -3px 8px #fff}
body.T8 .side{border-right-color:transparent}
body.T9{font-family:var(--mono)}
body.T9 .pill,body.T9 .chip,body.T9 .btn,body.T9 .ftag,body.T9 .lbl,body.T9 .sec-t,body.T9 .stat .k{text-transform:uppercase;letter-spacing:.1em}
body.T9 .frame{filter:saturate(.75) contrast(1.06) brightness(.92)}
body.T9 .app::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(45,212,160,.03) 0 2px,transparent 2px 4px);pointer-events:none;z-index:70}
body.T9 .btn.pri{background:var(--accent);color:#04090c;font-weight:800;border-color:var(--accent)}
body.T9 .ftag,body.T9 .fage,body.T9 .ovd{border-radius:0}
body.T10 .cmd h1{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:19px;letter-spacing:0}
body.T10 .desc,body.T10 .tabph p{font-family:Georgia,serif}
body.T10 .pill{border:1px solid var(--edge);border-radius:3px;text-transform:uppercase;letter-spacing:.12em;font-size:8px;font-weight:800}
body.T10 .sb-mark{border-radius:3px}
body.T10 .card{border-color:var(--edge)}
body.T10 .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}/* ============ TAB VIEWS v6 ============ */
.tabwrap{flex:1;overflow:auto;padding:18px}
.tw-h{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.tw-h h2{margin:0;font-size:15px}
.tw-h .sub{font-size:11.5px;color:var(--tx3)}
.tw-h .sp{flex:1}
.tblwrap{border:1px solid var(--edge);border-radius:var(--r);overflow:auto;background:var(--panel);box-shadow:var(--cardsh)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);padding:10px 12px;border-bottom:1px solid var(--edge);white-space:nowrap;font-weight:700}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--edge);white-space:nowrap;color:var(--tx)}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.stp{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:700;border:1px solid var(--edge)}
.stp .pdot{width:6px;height:6px;border-radius:99px;background:currentColor}
.lotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.lot{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--cardsh);padding:14px 16px}
.lot .lh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lot .lh b{font-family:var(--mono);font-size:14.5px}
.lot .meta{font-size:11.5px;color:var(--tx3);margin-bottom:10px;line-height:1.6}
.lot .items{display:none;border-top:1px dashed var(--edge);margin-top:8px;padding-top:6px}
.lot.open .items{display:block}
.lot .items div{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--edge) 55%,transparent)}
.lot .items div:last-child{border-bottom:none}
.lot .acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.qrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--cardsh);padding:10px 14px;margin-bottom:10px}
.qrow .lbl{width:126px;flex:none;border:1px solid var(--edge);border-radius:6px;padding:5px;background:#fff}
.qrow .lbl .bc{display:flex;gap:1px;height:26px;align-items:stretch}
.qrow .lbl .bc i{background:#111}
.qrow .lbl .cd{font-family:var(--mono);font-size:8px;text-align:center;margin-top:3px;color:#111;overflow:hidden;white-space:nowrap}
.qrow .qi{flex:1;min-width:0}
.qrow .qi b{font-family:var(--mono);font-size:12.5px}
.qrow .qi small{display:block;color:var(--tx3);font-size:11px;margin-top:1px}
.pstat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pstat.wait{background:color-mix(in srgb,var(--tx3) 18%,transparent);color:var(--tx2)}
.pstat.print{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

  var j=PQ[i];

function prAll(){
  if(TS.printBusy)return;
  var idxs=[];PQ.forEach(function(j,i){if(j.st==='wait')idxs.push(i)});
  if(!idxs.length){toast('Không còn việc chờ in');return}
  TS.printBusy=true;
  function step(k){
    if(k>=idxs.length){TS.printBusy=false;render();toast('Đã in '+idxs.length+' việc vào đầu in');return}

  }
  step(0);
}

function render(){
  var app=document.getElementById('app');
  app.innerHTML='';
  var wrapMain=el('<div class="wrap"></div>');
  if(S.tab==='danh sách'){
    if(hasSide())app.appendChild(sideNav());
    wrapMain.appendChild(topbar());
    if(hasStats())wrapMain.appendChild(stats());
    if(hasBento())wrapMain.appendChild(bento());
    var list=filtered();
    wrapMain.appendChild(toolbar());
    if(document.body.classList.contains('T3'))wrapMain.appendChild(el('<div class="walllb">'+ic('camera')+'Tường ảnh — đơn chờ xử lý <small>cuộn ngang →</small></div>'));
    var bw=el('<div class="boardwrap"></div>');
    bw.appendChild(board(list));
    var bb=S.selMode?batchbar():null;
    if(bb)bw.appendChild(bb);
    wrapMain.appendChild(bw);
    app.appendChild(wrapMain);
    if(S.sel!==null){
      if(document.body.classList.contains('T2')&&!isM())app.appendChild(el('<div class="t2scrim" data-closed></div>'));
      app.appendChild(detail(S.sel));
    }
  }else{
    if(hasSide())app.appendChild(sideNav());
    wrapMain.appendChild(topbar());
    wrapMain.appendChild({'backlog':tabBacklog,'thanh lý':tabLiq,'in mã':tabPrint,'góp ý':tabFeed,'quyền':tabPerm}[S.tab]());
    app.appendChild(wrapMain);
    if(S.tab==='backlog'&&TS.bx.sel!==null){var bdx=bxDetail(TS.bx.sel);if(bdx)app.appendChild(bdx)}
  }
  mobChrome(app);
  bind();
  bindExtra();
}

/* ================= BINDINGS ================= */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;S.sel=null;render()}});
  document.querySelectorAll('[data-flt]').forEach(function(b){b.onclick=function(){S.flt=b.dataset.flt;render()}});
  var kt=document.querySelector('[data-kindtog]');
  if(kt)kt.onclick=function(){
    var b=S.kind.Box,i=S.kind.Item;
    if(b&&i){S.kind={Box:true,Item:false}}
    else if(b){S.kind={Box:false,Item:true}}
    else if(i){S.kind={Box:true,Item:true}}
    else{S.kind={Box:true,Item:true}}
    render();
  };
  var rf=document.querySelector('[data-refresh]');if(rf)rf.onclick=function(){toast('Đã cập nhật dữ liệu (mock)')};
  var sm=document.querySelector('[data-selmode]');if(sm)sm.onclick=function(){S.selMode=!S.selMode;S.picks={};render()};
  document.querySelectorAll('[data-card]').forEach(function(c){
    c.onclick=function(){
      var i=+c.dataset.card;
      if(S.selMode){S.picks[i]=!S.picks[i];render();return}
      if(S.sel===i){S.sel=null;render();return}
      S.sel=i;S.resolving=false;S.hero=0;render();
    };
  });
  var bl=document.querySelector('[data-batchliq]');if(bl)bl.onclick=function(){var n=Object.keys(S.picks).filter(function(k){return S.picks[k]}).length;S.selMode=false;S.picks={};toast('Đã chuyển '+n+' đơn vào lô thanh lý L-24 (mock)');render()};
  var cs=document.querySelector('[data-clearsel]');if(cs)cs.onclick=function(){S.picks={};render()};
  document.querySelectorAll('[data-closed]').forEach(function(b){b.onclick=function(){S.sel=null;S.resolving=false;render()}});
  var hv=document.querySelector('[data-resolve]');if(hv)hv.onclick=function(){S.resolving=true;render();var bi=document.getElementById('billIn');if(bi)bi.focus()};
  var cf=document.querySelector('[data-confirm]');if(cf)cf.onclick=function(){
    var bi=document.getElementById('billIn');var v=(bi&&bi.value.trim())||'SPXVN9999000001A';
    var it=ITEMS[S.sel];it.st='res';it.bill=v;
    it.hist.push({ts:'11/10 10:30',k:'res',ev:'Tìm thấy bill',who:'duc.nguyenvan05@spx',bill:v});
    S.resolving=false;toast('Resolve '+it.code);render();
  };
  document.querySelectorAll('[data-hero]').forEach(function(t){t.onclick=function(){S.hero=+t.dataset.hero;render()}});
  document.querySelectorAll('[data-new]').forEach(function(b){b.onclick=openCreate});
  var pr=document.querySelector('[data-print]');if(pr)pr.onclick=function(){toast('Đã xếp hàng in 3 mã dán (mock)')};
  var be=document.querySelector('[data-bell]');if(be)be.onclick=function(){toast('2 đơn vừa vượt quá hạn 72h')};
  var q=document.getElementById('q');
  if(q)q.oninput=function(){S.q=q.value;var pos=q.selectionStart;render();var n2=document.getElementById('q');if(n2){n2.focus();n2.setSelectionRange(pos,pos)}};
}

}
function drawCreate(){
  var mb=document.getElementById('mbox');

   '<div class="steps"><i class="on"></i><i></i><i></i></div>'+
   '<div class="f-lb">Loại ghi nhận</div>'+
   '<div class="f-seg" data-creq><button class="on">'+ic('scan')+'Non-AWB Recovery</button><button>'+ic('recycle')+'Thanh lý</button></div>'+
   '<div class="f-lb">Phân loại</div>'+
   '<div class="f-seg" data-crkind><button class="'+(CRE.kind==='Box'?'on':'')+'" data-k="Box">BOX</button><button class="'+(CRE.kind==='Item'?'on':'')+'" data-k="Item">ITEM</button></div>'+
   '<div class="f-lb">Mô tả nhanh</div>'+
   '<textarea placeholder="vd: Thùng carton 12 áo thun, seal nguyên, về ca đêm không kèm bill…"></textarea>'+
   '<div class="f-lb">Chụp ảnh (bắt buộc ≥1)</div>'+
   '<div class="slots"><div class="slot">'+scene('Box',0).replace('<svg ','<svg class="photo" ')+'</div><div class="slot">'+ic('camera')+'Sản phẩm</div><div class="slot">'+ic('plus')+'Chi tiết khác</div></div>'+
   '<div class="f-lb">Mã tự sinh</div>'+
   '<input class="mono" value="'+(CRE.kind==='Box'?'Box':'Item')+'.11-10-2026.6">'+
   '<div class="mfoot"><button class="btn" data-closem>Hủy</button><button class="btn pri" data-submit>'+ic('check')+'Lưu đơn</button></div>';
  mb.querySelectorAll('[data-crkind] button').forEach(function(b){b.onclick=function(){CRE.kind=b.dataset.k;drawCreate()}});
  mb.querySelectorAll('[data-creq] button').forEach(function(b){b.onclick=function(){mb.querySelectorAll('[data-creq] button').forEach(function(x){x.classList.remove('on')});b.classList.add('on')}});
  mb.querySelector('[data-closem]').onclick=function(){document.getElementById('mbg').classList.remove('open')};
  mb.querySelector('[data-submit]').onclick=function(e){
    var btn=e.currentTarget;btn.textContent='Đang lưu…';
    setTimeout(function(){document.getElementById('mbg').classList.remove('open');toast('Đã lưu '+CRE.kind+'.11-10-2026.6 ✓');S.flt='kho';render()},700);
  };
}

/* ================= COMMAND PALETTE ================= */
var PAI=0,PAL=[];
function palItems(q){
  q=(q||'').toLowerCase();
  var acts=[
    {t:'Tạo đơn mất bill (Non-AWB)',i:'plus',r:'lệnh',run:openCreate},
    {t:'Lọc: chỉ đơn Lưu kho',i:'filter',r:'lệnh',run:function(){S.flt='kho';render()}},
    {t:'Lọc: đơn quá hạn 72h',i:'alert',r:'lệnh',run:function(){S.flt='kho';toast('Đang lọc đơn quá hạn (mock)');render()}},
    {t:'In lô mã dán hôm nay',i:'printer',r:'lệnh',run:function(){toast('Đã xếp hàng in (mock)')}}
  ];
  NAV.forEach(function(nv){acts.push({t:'Mở tab '+nv[2],i:nv[1],r:'điều hướng',run:function(){S.tab=nv[0];S.sel=null;TS.bx.sel=null;render()}})});
  var orders=ITEMS.map(function(it,i){return {t:it.code+' — '+it.desc,i:'box',r:'đơn',run:function(){S.tab='danh sách';S.sel=i;S.resolving=false;S.hero=0;render()}}});
  var all=acts.concat(orders);
  if(!q)return all.slice(0,9);
  return all.filter(function(a){return a.t.toLowerCase().indexOf(q)>=0}).slice(0,9);
}
function palDraw(){
  var q=document.getElementById('palIn').value;
  PAL=palItems(q);
  if(PAI>=PAL.length)PAI=0;
  document.getElementById('palList').innerHTML=PAL.map(function(a,i){
    return '<div class="palitem'+(i===PAI?' on':'')+'" data-pi="'+i+'">'+ic(a.i)+'<span class="pc">'+esc(a.t)+'</span><span class="pr">'+a.r+'</span></div>';
  }).join('')||'<div class="palitem" style="color:#9aa1ab">Không tìm thấy gì khớp…</div>';
  document.querySelectorAll('[data-pi]').forEach(function(b){b.onclick=function(){PAL[+b.dataset.pi].run();palClose()}});
}
function palOpen(){document.getElementById('pal').classList.add('open');PAI=0;palDraw();var i=document.getElementById('palIn');i.value='';i.focus()}
function palClose(){document.getElementById('pal').classList.remove('open')}
document.getElementById('palIc').innerHTML=ic('search');
document.getElementById('palIn').oninput=function(){PAI=0;palDraw()};
document.getElementById('palIn').onkeydown=function(e){
  if(e.key==='ArrowDown'){PAI=Math.min(PAI+1,PAL.length-1);palDraw();e.preventDefault()}
  if(e.key==='ArrowUp'){PAI=Math.max(PAI-1,0);palDraw();e.preventDefault()}
  if(e.key==='Enter'&&PAL[PAI]){PAL[PAI].run();palClose()}
};
document.getElementById('pal').onclick=function(e){if(e.target===this)palClose()};

  T9:'<b>T9 — Terminal Ops</b> · Máy trạm kho: xanh phosphor trên đen, scanline, toàn monospace uppercase — chất control room thuần.',
  T10:'<b>T10 — Paper & Ink</b> · Giấy & mực: nền kem, serif Georgia cho tiêu đề, nhãn con dấu terracotta — hồ sơ ngoại lệ kiểu văn thư.'
};
function setTheme(t){
  document.body.className=t;
  document.querySelectorAll('#themeSeg button').forEach(function(x){x.classList.toggle('on',x.dataset.t===t)});
  document.getElementById('themeNote').innerHTML=NOTES[t];
  render();
}
document.getElementById('themeSeg').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  setTheme(b.dataset.t);
};
document.getElementById('devSeg').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#devSeg button').forEach(function(x){x.classList.toggle('on',x.dataset.d===b.dataset.d)});
  document.getElementById('device').classList.toggle('mobile',b.dataset.d==='mob');
  render();
};
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('pal').classList.contains('open')?palClose():palOpen()}
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();palOpen()}
  if(e.key==='Escape'){palClose();document.getElementById('mbg').classList.remove('open');if(S.sel!==null){S.sel=null;render()}}
});
(function init(){
  var hs=(location.hash||'').replace('#','').split('&');
  var t='T1',mob=false,sel=null;
  hs.forEach(function(h){if(/^T\d+$/.test(h))t=h;if(h==='mob')mob=true;if(/^sel=\d+$/.test(h))sel=+h.slice(4)});
  if(mob)document.getElementById('device').classList.add('mobile');
  document.querySelectorAll('#devSeg button').forEach(function(x){x.classList.toggle('on',(x.dataset.d==='mob')===mob)});
  t='T4';if(sel!==null)S.sel=sel;
  setTheme(t);
})();
</script>
