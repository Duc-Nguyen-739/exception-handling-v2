<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đơn mất bill — 10 mẫu nghiệp vụ logistic (tông màu repo) · gallery test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* ============ CHROME CỦA GALLERY (không phải UI app) ============ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0c1220;font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.gal{position:sticky;top:0;z-index:9999;background:#0c1220;color:#dce4f2;border-bottom:1px solid #22304a;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12px}
.gal-t{font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#8fd6c1;margin-right:4px;white-space:nowrap}
.gal-sep{width:1px;height:22px;background:#22304a}
.gal-vp{display:flex;gap:4px;background:#141d30;border:1px solid #22304a;border-radius:99px;padding:3px}
.gal-vp button{border:0;background:transparent;color:#9fb0c9;font:inherit;font-weight:700;font-size:11px;padding:5px 11px;border-radius:99px;cursor:pointer}
.gal-vp button.on{background:#2f6df6;color:#fff}
.gal-x{border:1px solid #22304a;background:#141d30;color:#9fb0c9;font:inherit;font-weight:700;font-size:11px;padding:6px 11px;border-radius:8px;cursor:pointer}
.gal-x:hover{color:#fff;border-color:#3a4d70}
.gal-x.on{background:#5b3df6;color:#fff;border-color:#5b3df6}
.gal-note{width:100%;color:#8496b1;font-size:11.5px;line-height:1.55;padding:2px 2px 0}
.gal-note b{color:#e6edf8}
.stage-wrap{padding:14px 14px 26px;display:flex;justify-content:center}
.stage{width:100%;max-width:1440px;height:calc(100vh - 118px);min-height:560px;background:#fff;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.stage[data-vp="tab"]{max-width:960px}
.stage[data-vp="phone"]{max-width:414px}
.stage[data-vp="phone"] .shell{--vp:phone}
.stage[data-vp="tab"] .shell{--vp:tab}
.picks{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 0;justify-content:center}
.pick{border:1px solid #22304a;background:#141d30;color:#c3d0e4;border-radius:10px;padding:8px 11px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;gap:7px;align-items:center;line-height:1.2;text-align:left}
.pick:hover{border-color:#3a4d70;color:#fff}
.pick.on{background:#2f6df6;border-color:#2f6df6;color:#fff}
.pick i{font-style:normal;font-size:14px;opacity:.9}
.pick s{text-decoration:none;display:block;font-weight:600;font-size:10px;opacity:.7}
@media (max-width:760px){.gal{font-size:11px}.stage{height:calc(100vh - 190px)}.picks{gap:6px}}
</style>
<style id="base">
/* ================= NỀN TẢNG LAYOUT (dùng chung 10 mẫu) ================= */
.stage{background:#0e1420}
.shell{
  --ff:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',monospace;
  --bg:#f5f6f9; --card:#fff; --ink:#22303f; --mut:#8d99a8; --line:#e9edf2; --soft:#f2f5f9;
  --pri:#ee4d2d; --pri-ink:#fff; --acc:#172b48; --green:#11b96a; --blue:#3274f7; --amber:#f79009; --red:#e34d4d;
  --navbg:#fff; --navw:250px; --dw:400px; --r:14px; --r-sm:10px; --pad:16px; --gap:12px; --fs:13.5px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  --sh-lg:0 18px 48px rgba(16,24,40,.16); --chip:#eef1f6; --grid:repeat(auto-fill,minmax(210px,1fr));
  position:absolute; inset:0; display:flex; background:var(--bg); color:var(--ink); font:400 var(--fs)/1.5 var(--ff); overflow:hidden;
}
.shell *{scrollbar-width:thin}
.shell :where(button:not(.btn)){font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.shell input,.shell select,.shell textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;outline:none;min-width:0}
.shell input:focus,.shell select:focus,.shell textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.shell code,.mono{font-family:var(--fm);font-size:.94em}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.body{flex:1 1 auto;min-height:0;display:flex;gap:var(--gap);padding:0 var(--pad) var(--pad)}
.content{flex:1 1 auto;min-width:0;overflow:auto;padding-top:var(--gap);display:flex;flex-direction:column;gap:8px}
.side{flex:none;width:var(--navw);display:flex;flex-direction:column;gap:10px;background:var(--navbg);border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
.side.rail{width:66px;align-items:center;padding:12px 6px}
.drawer{flex:none;width:var(--dw);overflow:auto;background:var(--card);border-left:1px solid var(--line);box-shadow:var(--sh-lg)}
.drawer.wide{width:min(720px,62%)}
.drawer.empty-d{display:flex;align-items:center;justify-content:center;width:var(--dw)}
.dempty{text-align:center;color:var(--mut);padding:40px 24px;font-size:12.5px}
.dempty b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}

/* ---- nút ---- */
.btn{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:12.5px;color:var(--acc);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.16s;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--pri) 40%,var(--line))}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 34%,transparent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sec{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--mut)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--red) 12%,var(--card));border-color:color-mix(in srgb,var(--red) 40%,var(--line));color:var(--red)}
.btn.icon{padding:7px 9px;border-radius:var(--r-sm);font-size:13px}
.btn.mini{padding:4px 9px;font-size:11px;border-radius:8px}
.btn.big{padding:13px 20px;font-size:15px}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.wide{width:100%;justify-content:center}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}.btnrow.end{justify-content:flex-end}

/* ---- topbar ---- */
.top{flex:none;display:flex;align-items:center;gap:12px;padding:12px var(--pad);background:var(--navbg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ttl b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--acc);white-space:nowrap}
.dark .ttl b{color:var(--ink)}
.ttl s{text-decoration:none;display:block;font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.sbox{flex:1 1 340px;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:2px 6px 2px 12px;box-shadow:var(--sh);max-width:620px;margin:0 auto;transition:.18s}
.sbox:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 14%,transparent)}
.sbox i{color:var(--mut);font-style:normal;font-size:13px}
.sbox input{flex:1;border:0;background:transparent;padding:8px 0;font-weight:600}
.sbox input:focus{box-shadow:none;outline:none}
.sbox kbd{font:700 10px var(--fm);color:var(--mut);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.tacts{display:flex;align-items:center;gap:8px;margin-left:auto}
.me{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 11px var(--ff);flex:none}
.dark .me{background:var(--pri);color:#fff}
.bell{font-size:15px}
.topnav{flex:none;display:flex;gap:4px;padding:0 var(--pad);background:var(--navbg);border-bottom:1px solid var(--line);overflow-x:auto}
.tnv{padding:11px 14px;font-weight:700;font-size:12.5px;color:var(--mut);border-bottom:2.5px solid transparent;white-space:nowrap}
.tnv:hover{color:var(--ink)}
.tnv.on{color:var(--pri);border-bottom-color:var(--pri)}

/* ---- sidebar ---- */
.brand{display:flex;align-items:center;gap:9px;padding:2px 4px 8px;border-bottom:1px solid var(--line)}
.rail .brand{border:0;padding:0;flex-direction:column;gap:6px}
.brand .lg{width:26px;height:20px;color:var(--pri);flex:none}
.brand .bt{min-width:0}.brand b{display:block;font:800 12.5px/1.1 var(--ff);color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dark .brand b{color:var(--ink)}
.brand s{text-decoration:none;font:600 9.5px/1.3 var(--ff);letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}
.tg{margin-left:auto;font-size:11px}
.rail .tg{display:none}
.nav{display:flex;flex-direction:column;gap:3px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);font-weight:700;font-size:12.5px;color:var(--mut);transition:.14s;position:relative}
.nv i{font-style:normal;width:18px;text-align:center;font-size:14px;flex:none}
.nv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .nv span{display:none}
.rail .nv{justify-content:center;width:46px;height:44px}
.nv:hover{background:var(--soft);color:var(--ink)}
.nv.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.nv.on::before{content:'';position:absolute;left:0;top:22%;height:56%;width:3px;border-radius:0 3px 3px 0;background:var(--pri)}
.rail .nv.on::before{left:-6px;width:3px}
.nv .cnt{margin-left:auto;background:var(--pri);color:#fff;font:800 10px var(--fm);padding:1px 6px;border-radius:999px}
.rail .nv .cnt{position:absolute;top:2px;right:0;margin:0;padding:0 4px}
.navgrp{display:flex;flex-direction:column;gap:4px}
.navgrp h5{margin:8px 4px 2px;font:800 9.5px/1 var(--ff);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.sfilter{display:flex;flex-direction:column;gap:2px}
.sf{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:12px;font-weight:700;color:var(--mut);text-align:left}
.sf i{width:8px;height:8px;border-radius:3px;background:var(--mut);flex:none}
.sf b{margin-left:auto;font:700 10.5px var(--fm);color:var(--mut)}
.sf:hover{background:var(--soft);color:var(--ink)}
.sf.on{background:var(--acc);color:#fff}.sf.on b{color:#fff}
.sf.c-all i{background:linear-gradient(135deg,var(--pri),var(--blue))}.sf.c-amber i{background:var(--amber)}
.sf.c-green i{background:var(--green)}.sf.c-grey i{background:#9aa5b4}.sf.c-blue i{background:var(--blue)}.sf.c-red i{background:var(--red)}
.sf.on{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pri) 45%,var(--line))}
.sfoot{margin-top:auto;padding:8px 4px;border-top:1px solid var(--line);font-size:11px;font-weight:700;color:var(--acc)}
.dark .sfoot{color:var(--ink)}
.sfoot s{display:block;text-decoration:none;color:var(--mut);font-weight:600;font-size:10.5px}
.railfly{margin-top:auto}

/* ---- tabhead + toolbar ---- */
.tabhead{flex:none;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 2px 6px;border-bottom:1px solid var(--line)}
.tabhead h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.015em;color:var(--acc)}
.dark .tabhead h2{color:var(--ink)}
.tabhead span{font:700 11px var(--fm);color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent);padding:2px 8px;border-radius:999px}
.tabhead s{text-decoration:none;font-size:11px;color:var(--mut);font-weight:600;margin-left:auto}
.tabhead .lotbadge{font-size:11px;font-weight:800;color:var(--pri)}
.tools{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.tleft{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tright{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:800;color:var(--mut);display:inline-flex;gap:6px;align-items:center;transition:.14s}
.chip b{font:800 10.5px var(--fm);opacity:.75}
.chip:hover{color:var(--ink);border-color:color-mix(in srgb,var(--pri) 40%,var(--line))}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on b{color:#fff}
.chip.c-chua_xu_ly.on{background:var(--amber);border-color:var(--amber);color:#1a1200}
.chip.c-da_tim_bill.on{background:var(--green);border-color:var(--green);color:#04170d}
.chip.c-thanh_ly.on{background:#69788c;border-color:#69788c;color:#fff}
.chip.k.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.clr{background:color-mix(in srgb,var(--pri) 10%,var(--card));border-color:color-mix(in srgb,var(--pri) 35%,var(--line));color:var(--pri)}
.upd{font-size:10.5px;color:var(--mut);font-weight:700;font-family:var(--fm)}
.sortlbl{font-size:11px;color:var(--mut);font-weight:700;display:flex;gap:5px;align-items:center}
.sortlbl select{padding:5px 7px;font-size:11.5px;border-radius:8px}


/* ---- lưới card ---- */
.grid{display:grid;grid-template-columns:var(--grid);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);transition:.18s;display:flex;flex-direction:column;text-align:left}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:color-mix(in srgb,var(--pri) 45%,var(--line))}
.card.on{border-color:var(--pri);box-shadow:0 0 0 2px color-mix(in srgb,var(--pri) 30%,transparent),var(--sh-lg)}
.thumb{position:relative;aspect-ratio:1/1;background:var(--soft);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
.card:hover .thumb img{transform:scale(1.05)}
.noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--mut)}
.badge{position:absolute;top:7px;left:7px;background:rgba(23,43,72,.86);color:#fff;font:800 9px/1 var(--ff);letter-spacing:.04em;padding:4px 7px;border-radius:6px;backdrop-filter:blur(4px)}
.badge.kind{left:7px}
.badge.sync{left:auto;right:7px;background:color-mix(in srgb,var(--blue) 85%,#000);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
.age{position:absolute;top:7px;right:7px;font:800 9.5px/1 var(--fm);padding:4px 6px;border-radius:6px;background:var(--green);color:#04170d;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.age.mid{background:#ffd766;color:#3a2b00}.age.warn{background:var(--amber);color:#fff}.age.hot{background:var(--red);color:#fff}
.age.na{background:rgba(120,132,148,.9);color:#fff}
.cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.code{font:800 12px/1.2 var(--fm);color:var(--acc);letter-spacing:-.02em}
.dark .code{color:var(--ink)}
.desc{margin:0;font-size:11.5px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.cmeta{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;color:var(--mut);margin-top:auto;flex-wrap:wrap}
.cmeta .bill{font-family:var(--fm);color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent);padding:1px 5px;border-radius:5px}
.cmeta .when{margin-left:auto;font-family:var(--fm)}
.st{font:800 9.5px/1 var(--ff);letter-spacing:.03em;padding:4px 7px;border-radius:999px;text-transform:uppercase}
.st .spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.st-amber{background:color-mix(in srgb,var(--amber) 16%,var(--card));color:#8a4b00}
.st-green{background:color-mix(in srgb,var(--green) 16%,var(--card));color:#0a6b3d}
.st-grey{background:#eef1f5;color:#59677b}
.st-blue{background:color-mix(in srgb,var(--blue) 14%,var(--card));color:#1c4fb8}
.st-red{background:color-mix(in srgb,var(--red) 14%,var(--card));color:#a12222}
.dark .st-amber{color:#ffcf8a}.dark .st-green{color:#7ff0b5}.dark .st-grey{color:#c3cbd6;background:#2a3444}
.dark .st-blue{color:#9dc2ff}.dark .st-red{color:#ffb4b4}

/* ---- danh sách dòng ---- */
.rows{display:flex;flex-direction:column;gap:4px}
.rowx{display:grid;grid-template-columns:44px minmax(120px,2.4fr) 46px 96px 54px 116px 90px auto;gap:9px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;transition:.14s;cursor:pointer}
.rowx:hover{border-color:color-mix(in srgb,var(--pri) 45%,var(--line));box-shadow:var(--sh)}
.rowx.on{border-color:var(--pri);box-shadow:inset 3px 0 0 var(--pri);background:color-mix(in srgb,var(--pri) 5%,var(--card))}
.rthumb img{width:44px;height:44px;border-radius:7px;object-fit:cover;display:block;border:1px solid var(--line)}
.rmain{min-width:0}.rmain b{display:block;font:800 12px/1.3 var(--fm);color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dark .rmain b{color:var(--ink)}
.rmain em{display:block;font-style:normal;font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain i{font-style:normal;color:var(--mut)}
.rkind,.rwhen,.rwho{font:700 10.5px var(--fm);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rage .age{position:static}.rage{display:flex}
.rst{white-space:nowrap}.ract{display:flex;gap:5px;justify-content:flex-end}

/* ---- bảng đặc ---- */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100% - 8px);box-shadow:var(--sh)}
.tblwrap.wide{max-height:none;flex:1}
.shell table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;table-layout:auto}
.shell thead th{position:sticky;top:0;z-index:3;background:var(--soft);text-align:left;padding:9px 10px;font:800 10.5px/1.2 var(--ff);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
  border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.shell thead th:hover{color:var(--pri)}
.shell thead th i{font-style:normal;margin-left:5px;color:var(--pri);font-size:10px}
.shell tbody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.shell tbody tr{cursor:pointer;transition:.1s}
.shell tbody tr:hover{background:color-mix(in srgb,var(--pri) 5%,transparent)}
.shell tbody tr.on{background:color-mix(in srgb,var(--pri) 9%,transparent);box-shadow:inset 3px 0 0 var(--pri)}
td.mono{font-family:var(--fm);font-size:11.5px}
td.b{font-weight:800;color:var(--acc)}.dark td.b{color:var(--ink)}
td.desc{white-space:normal;min-width:220px}
td.desc .micro img{width:26px;height:26px;border-radius:5px;object-fit:cover;vertical-align:middle;margin-right:7px;border:1px solid var(--line)}
td.desc em{font-style:normal;color:var(--mut);font-size:11px}
td .age{position:static;display:inline-block}
.agecell{display:inline-flex;align-items:center;gap:5px;font:800 10.5px var(--fm)}
.agecell i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.agecell.mid i{background:#ffd766}.agecell.warn i{background:var(--amber)}.agecell.hot i{background:var(--red)}.agecell.na i{background:#9aa5b4}
.actcell{display:flex;gap:5px;justify-content:flex-end}

.lbl-t{font:800 10px/1 var(--ff);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.cam{position:relative;height:min(300px,42dvh);border-radius:var(--r);background:#0a0f16;overflow:hidden;display:grid;place-items:center}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam p{position:relative;z-index:3;font-size:11px;color:#94a7c0;font-weight:700;text-align:center;padding:0 20px}
.cam .cf{position:absolute;width:26px;height:26px;border:2.5px solid var(--pri);z-index:2}
.cam .f1{left:12%;top:22%;border-right:0;border-bottom:0}.cam .f2{right:12%;top:22%;border-left:0;border-bottom:0}
.cam .f3{left:12%;bottom:22%;border-right:0;border-top:0}.cam .f4{right:12%;bottom:22%;border-left:0;border-top:0}
.cam .laser{position:absolute;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,#ff5b5b,transparent);z-index:2;animation:scan 1.8s ease-in-out infinite}
.scanbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.scanman{display:flex;gap:8px;margin-top:9px}
.scanman input{flex:1;font-family:var(--fm)}
.lb{background:rgba(4,7,12,.93)}
.lbbox{max-width:min(1000px,96%);display:flex;flex-direction:column;gap:10px;align-items:center}
.lbbox img{max-height:70vh;border-radius:10px;transition:transform .2s}
.lbbar{display:flex;align-items:center;gap:8px;color:#dbe4f0;font-size:11.5px;font-weight:700}
.lbbar b{font-family:var(--fm);margin-right:8px}
.lbbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.palbox{width:min(600px,94%);background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);overflow:hidden;align-self:flex-start;margin-top:6vh}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px 16px;font-size:14px;font-weight:700}
.palbox input:focus{box-shadow:none}
.pallist{max-height:46vh;overflow:auto;padding:7px}
.cmd{display:flex;width:100%;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink);text-align:left}
.cmd:hover,.cmd.on{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
.cmd s{text-decoration:none;margin-left:auto;font-family:var(--fm);color:var(--mut);font-size:10px}
.phint{margin:0;padding:8px 12px;border-top:1px solid var(--line);font-size:10px;color:var(--mut);font-weight:700}
.introbox{width:min(520px,94%);background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.introbox>header{display:flex;align-items:center}.introbox>header b{font-size:14px;font-weight:800}.introbox>header .btn{margin-left:auto}
.istep{display:grid;grid-template-columns:auto 1fr;gap:11px}
.istep i{width:30px;height:30px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font:800 13px var(--ff)}
.istep b{display:block;font-size:12.5px;color:var(--ink)}
.istep p{margin:2px 0 0;font-size:11.5px;color:var(--mut);line-height:1.5}
.toasts{position:absolute;right:14px;bottom:14px;z-index:120;display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:none}
.tst{background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:9px 13px;border-radius:10px;box-shadow:var(--sh-lg);animation:up2 .22s;max-width:340px}
.tst-err{background:var(--red)}.tst-ok{background:#0a7d47}
@keyframes up2{from{transform:translateY(10px);opacity:0}}

/* ================= MOBILE ================= */
.shell.mob{--pad:10px;--gap:8px;--fs:13px}
.shell.mob .side{display:none}
.shell.mob .body{padding:0 var(--pad) 68px}
.shell.mob .content{gap:7px}
.shell.mob .grid{grid-template-columns:repeat(2,1fr);gap:8px}
.shell.mob .tiles{grid-template-columns:repeat(2,1fr)}
.shell.mob .dbottom{grid-template-columns:1fr}
.shell.mob .rowx{grid-template-columns:40px 1fr auto;gap:8px}
.shell.mob .rowx .rkind,.shell.mob .rowx .rwhen,.shell.mob .rowx .rwho,.shell.mob .rowx .rage,.shell.mob .rowx .rst{display:none}

.shell.mob .wiz{grid-template-columns:1fr}
.shell.mob .top{flex-wrap:wrap;gap:8px;padding:9px var(--pad)}
.shell.mob .sbox{order:3;flex:1 1 100%}
.shell.mob .tacts .no{display:none}
.shell.mob .mob-hide{}
/* Mobile: panel drawer/inline luôn tràn màn → chuyển thành sheet đáy, không ép 2 cột */
.shell.mob .drawer{position:absolute;left:0;right:0;top:auto;bottom:0;width:auto;max-height:86%;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;z-index:60;box-shadow:var(--sh-lg);animation:up .28s cubic-bezier(.22,1,.36,1)}
.shell.mob .drawer.empty-d{display:none}
.shell.mob .d-modal{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:92%;border-radius:22px 22px 0 0;border-bottom:0}
.shell.mob .pager{position:static;margin-top:6px}
.shell.mob .tabhead s{display:none}
.bnav{flex:none;display:none;justify-content:space-around;align-items:center;background:var(--navbg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));position:absolute;left:0;right:0;bottom:0;z-index:40;backdrop-filter:blur(12px)}
.shell.mob .bnav{display:flex}
.bn{display:flex;flex-direction:column;gap:2px;align-items:center;padding:5px 10px;border-radius:12px;color:var(--mut);font-size:9.5px;font-weight:700}
.bn i{font-style:normal;font-size:17px}
.bn.on{color:var(--pri)}
.bn.fab{background:var(--pri);color:#fff;width:50px;height:50px;border-radius:50%;margin-top:-22px;box-shadow:0 8px 20px color-mix(in srgb,var(--pri) 45%,transparent);display:grid;place-items:center}
.bn.fab i{font-size:24px}

@media (max-width:1100px){.sbox kbd{display:none}.top{gap:10px}.tacts{gap:6px}}
/* ================= IN TEM ================= */
@media print{
  .gal,.picks{display:none!important}
  body{background:#fff}
  .stage-wrap{padding:0}.stage{max-width:none;height:auto;box-shadow:none;border-radius:0}
  .shell{position:static;background:#fff;color:#000;height:auto;overflow:visible}
  .shell>*{display:none!important}
  .shell .printarea{display:block!important}
  .printarea .pbar,.printarea .btn{display:none!important}
  .printarea .psheet{border:0;background:none;padding:0}
  .printarea .plabels{display:block}
  .printarea .lbl{width:4in;height:2in;box-shadow:none;border:1px solid #000;border-radius:0;margin:0 0 4px;page-break-inside:avoid}
  .printarea .lbl b{font-size:30px!important}
  @page{size:4in 6in portrait;margin:.1in}
}
/* ================= MỞ ĐẦU KHỐI SKINS ================= */
/* =====================================================================
   10 MẪU NGHIỆP VỤ LOGISTIC — trung tính, lấy đúng bảng màu :root của
   index.html (navy #172b48, chữ #303844, phụ #97a0ad, viền #eef0f3,
   nền #f5f6f9) và chỉ dùng cam #ee4d2d cho 3 việc: nút chính, điều
   hướng đang chọn, vòng focus. Trạng thái = icon + chữ trên nền pastel
   đã hạ bão hoà (quy tắc Carbon/Spectrum), đỏ #b42318 dành riêng cho
   vi phạm SLA. Không mesh, không gradient nền, không kính mờ, không
   mỗi màn một màu. Phân cách bằng hairline, số liệu tabular-nums.
   ===================================================================== */

/* ---------- BỘ TOKEN CHUNG ---------- */
.shell{--o:#ee4d2d;--o-ink:#fff;--o-hi:#c93b1f;--o-tint:#fdece7;--o-line:#ffd9cd;
  --navy:#172b48;--ink:#303844;--mut:#97a0ad;--line:#eef0f3;--line2:#e2e8f0;--bg:#f5f6f9;--card:#fff;--soft:#f7f8fa;
  --slate:#334155;--slate-mut:#64748b;--slate-dark:#1e293b;
  --green:#11c964;--green-ink:#166534;--green-bg:#e9f4ec;--green-line:#bfe0c8;
  --blue:#3274f7;--blue-ink:#1d4ed8;--blue-bg:#eaf1fd;--blue-line:#bcd2f7;
  --amber:#f79009;--amber-ink:#92400e;--amber-bg:#fdf4e7;--amber-line:#f0d9ad;
  --red:#b42318;--red-bg:#fdecea;--red-line:#f5c6c0;
  --grey-ink:#475569;--grey-bg:#f1f5f9;--grey-line:#e2e8f0;
  --r:10px;--r-sm:8px;--r-lg:12px;--pad:14px;--gap:10px;--fs:12.5px;--navw:224px;--dw:420px;
  --sh:0 1px 2px rgba(16,24,40,.04);--sh-lg:0 16px 40px rgba(23,43,72,.16);--scrim:rgba(23,43,72,.42);
  --acc:var(--navy);--pri:var(--o);--navbg:var(--card);--chip:var(--grey-bg);
  --grid:repeat(auto-fill,minmax(230px,1fr));--fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums}
/* Nhãn trạng thái: icon + chữ (WCAG 1.4.1 — màu không tải thông tin một mình) */
.st{font-weight:700;border:1px solid transparent}
.st::before{font-size:9px;line-height:1;margin-right:5px;vertical-align:1px}
.st-amber{background:var(--grey-bg);border-color:var(--grey-line);color:var(--grey-ink)}
.st-amber::before{content:"○"}
.st-green{background:var(--green-bg);border-color:var(--green-line);color:var(--green-ink)}
.st-green::before{content:"✓"}
.st-blue{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-ink)}
.st-blue::before{content:"▸"}
.st-grey{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink)}
.st-grey::before{content:"◔"}
.st-red{background:var(--slate-dark);border-color:var(--slate-dark);color:#e2e8f0}
.st-red::before{content:"▪"}
/* Đỏ chỉ dành cho vi phạm SLA / quá hạn */
.age.hot,.agecell.hot i{color:var(--red)}
.age.hot{background:var(--red-bg);border-color:var(--red-line)}
.age.warn{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber-ink)}
.age.mid,.age.ok,.age.na{background:var(--grey-bg);border-color:var(--grey-line);color:var(--grey-ink)}
/* Mã đơn mono + navy để mắt quét nhanh */
.code,td.mono,.rowx .rmain b,.irow .itxt b{font-family:var(--fm)}
/* Nút: bo góc nhỏ, không bóng, chỉ 1 màu đầy */
.shell .btn{border-radius:var(--r-sm);font-weight:700;box-shadow:none;color:var(--navy)}
.shell .btn.pri{background:var(--o);border-color:var(--o);color:var(--o-ink)}
.shell .btn.pri:hover{background:var(--o-hi);border-color:var(--o-hi);filter:none}
.shell .btn.sec{background:var(--card);border-color:var(--line2);color:var(--navy)}
.shell .btn.ghost{color:var(--slate-mut)}
.shell input:focus,.shell select:focus,.shell textarea:focus{outline:2px solid var(--o-line);border-color:var(--o);box-shadow:none}
/* Lọc đang bật = navy, không phải màu theo trạng thái */
.chip{border-color:var(--line2);color:var(--slate-mut);font-weight:700}
.chip:hover{color:var(--navy);border-color:var(--slate-mut)}
.chip.on,.chip.c-chua_xu_ly.on,.chip.c-da_tim_bill.on,.chip.c-thanh_ly.on,.chip.k.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on b,.chip.c-chua_xu_ly.on b,.chip.c-da_tim_bill.on b,.chip.c-thanh_ly.on b,.chip.k.on b{color:#fff}
.chip.clr{background:var(--grey-bg);border-color:var(--grey-line);color:var(--grey-ink)}
/* Tile KPI: bỏ hết gradient/cầu vồng, chỉ còn khối chữ nhật trung tính */
.tile{border-radius:var(--r);box-shadow:none;background:var(--card);border:1px solid var(--line2)}
.tile:hover{transform:none;border-color:var(--slate-mut);box-shadow:none}
.tile b{color:var(--slate-mut);font-weight:700}
.tile strong{color:var(--navy)}
.tile .ti::before{background:var(--grey-bg);color:var(--slate);border:1px solid var(--grey-line);border-radius:var(--r-sm)}
.tile.t-ca .ti::before{background:var(--grey-bg);color:var(--slate);border-color:var(--grey-line)}
.tile.t-hot .ti::before{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.tile.t-res .ti::before{background:var(--green-bg);color:var(--green-ink);border-color:var(--green-line)}
.tile.t-in .ti::before{background:var(--blue-bg);color:var(--blue-ink);border-color:var(--blue-line)}
.tile.t-print .ti::before,.tile.t-fb .ti::before,.tile.t-bl .ti::before,.tile.t-liq .ti::before{background:var(--grey-bg);color:var(--slate);border-color:var(--grey-line)}
/* Sidebar/header dùng viền kẻ thay vì bóng */
.side,.top{box-shadow:none}
.top{border-bottom:1px solid var(--line2)}
.side{border-right:1px solid var(--line2);background:var(--card)}
.nv.on{background:var(--o-tint);color:var(--o-hi);font-weight:800;box-shadow:inset 3px 0 0 var(--o)}
.dash .chart,.dash .live,.dash .agesum{border:1px solid var(--line2);box-shadow:none}

/* ---------- 1 · TRIAGE LEDGER — bảng nghiệp vụ dense + drawer (Flexport/Linear) ---------- */
.shell.v1{--pad:12px;--fs:12px;--dw:430px}
.shell.v1 .tblwrap{border:1px solid var(--line2);border-radius:var(--r);background:var(--card)}
.shell.v1 table{min-width:1080px;font-size:12px}
.shell.v1 thead th{position:sticky;top:0;z-index:2;background:var(--grey-bg);color:var(--slate-mut);
  font:700 10px/1 var(--ff);letter-spacing:.07em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.shell.v1 tbody td{padding:0 10px;height:34px;border-bottom:1px solid var(--line);color:var(--ink)}
.shell.v1 tbody tr:hover{background:var(--soft)}
.shell.v1 tbody tr.on{background:var(--o-tint);box-shadow:inset 3px 0 0 var(--o)}
.shell.v1 td.mono{font-size:11.5px;color:var(--navy);white-space:nowrap}
.shell.v1 td.desc{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbdhint{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 10px;border:1px solid var(--line2);
  border-radius:var(--r);background:var(--card);font-size:11px;color:var(--slate-mut);margin-bottom:8px}
.kbdhint kbd{font:700 10px var(--fm);background:var(--grey-bg);border:1px solid var(--grey-line);border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--slate)}

/* ---------- 2 · WORK QUEUE — hàng việc, không phải dashboard (Linear/ServiceNow) ---------- */
.shell.v2{--pad:0;--gap:0}
.shell.v2 .content{padding:0;gap:0;flex-direction:row;overflow:hidden}
.wq{display:flex;flex:1 1 auto;min-width:0;height:100%}
.wqrail{flex:none;width:206px;border-right:1px solid var(--line2);background:var(--soft);padding:12px 10px;overflow:auto}
.wqrail h5{margin:0 0 6px;font:700 9.5px var(--ff);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.wqrail button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--slate-mut);margin-bottom:2px;text-align:left}
.wqrail button b{margin-left:auto;font:700 11px var(--fm);color:var(--mut)}
.wqrail button.on{background:var(--card);color:var(--navy);font-weight:800;box-shadow:inset 0 0 0 1px var(--line2)}
.wqrail button.on b{color:var(--o)}
.wqrail .asof{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--mut);line-height:1.5}
.wqcol{flex:1 1 46%;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line2);overflow:hidden}
.wqtool{flex:none;display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:11px;color:var(--slate-mut)}
.wqtool b{font-size:12.5px;color:var(--navy)}
.wqlist{flex:1 1 auto;overflow:auto}
.wqrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.wqrow:hover{background:var(--soft)}
.wqrow.on{background:var(--o-tint);box-shadow:inset 3px 0 0 var(--o)}
.wqrow input{width:15px;height:15px;flex:none;margin-top:2px;accent-color:var(--navy)}
.wqmain{flex:1 1 auto;min-width:0}
.wqmain b{display:block;font:700 12px var(--fm);color:var(--navy)}
.wqmain em{display:block;font-style:normal;font-size:11.5px;color:var(--slate-mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.wqmain s{display:inline-block;text-decoration:none;font-size:10.5px;color:var(--slate-mut);margin-top:4px}
.wqmain s.late{color:var(--red);font-weight:700}
.wqbulk{flex:none;display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:1px solid var(--line2);background:var(--slate-dark);color:#e2e8f0;font-size:11.5px;font-weight:700}
.wqbulk .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.wqbulk .btn.pri{background:var(--o);border-color:var(--o)}
.wqprev{flex:1 1 40%;min-width:0;overflow:auto;padding:16px 18px;background:var(--card)}
@media (max-width:1000px){.shell.v2 .wqrail{display:none}.shell.v2 .wqprev{display:none}.shell.v2 .wqcol{flex:none;width:100%}}

/* ---------- 3 · SCAN RECONCILIATION — quét + xếp hạng đơn nghi ngờ (Manhattan/Dynamics) ---------- */
.shell.v3{--pad:12px}
.rec{display:flex;flex-direction:column;gap:10px}
.recin{display:flex;gap:10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--card);padding:10px}
.recin input{flex:1 1 auto;border:1px dashed var(--o-line);background:var(--o-tint);border-radius:var(--r-sm);
  font:700 21px/1.2 var(--fm);color:var(--navy);padding:13px 16px;letter-spacing:.02em}
.recin input::placeholder{color:#b9705c;font-size:14px;font-weight:600;letter-spacing:0}
.recin .hint{flex:none;align-self:center;width:132px;font:600 10.5px/1.6 var(--ff);color:var(--slate-mut)}
.recg{display:flex;gap:10px;align-items:flex-start}
.reclog{flex:1 1 40%;min-width:0;border:1px solid var(--line2);border-radius:var(--r);background:var(--card);overflow:hidden}
.reccand{flex:1 1 60%;min-width:0;display:flex;flex-direction:column;gap:8px}
.reccand>h4,.reclog>h4{margin:0;padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--soft);
  font:700 10px var(--ff);letter-spacing:.07em;text-transform:uppercase;color:var(--slate-mut);border-radius:var(--r) var(--r) 0 0}
.reclog ul{margin:0;padding:0;list-style:none;max-height:290px;overflow:auto}
.reclog li{display:flex;gap:9px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font:12px var(--fm)}
.reclog li:last-child{border-bottom:0}
.reclog li i{font-style:normal;font-size:10px;color:var(--mut);margin-left:auto}
.reclog li.miss{color:var(--red)}
.reccard{display:flex;gap:11px;align-items:center;border:1px solid var(--line2);border-radius:var(--r);background:var(--card);padding:11px 12px;text-align:left}
.reccard:hover{border-color:var(--slate-mut)}
.reccard.on{border-color:var(--o);box-shadow:inset 3px 0 0 var(--o);background:var(--o-tint)}
.reccard .score{flex:none;width:52px;text-align:center;font:800 14px/1 var(--fm);color:var(--slate)}
.reccard .score s{display:block;text-decoration:none;font:700 8.5px var(--ff);letter-spacing:.06em;color:var(--mut);margin-top:3px}
.reccard.hi .score{color:var(--green-ink)}
.reccard .rb{flex:1 1 auto;min-width:0}
.reccard .rb b{display:block;font:700 12.5px var(--fm);color:var(--navy)}
.reccard .rb em{display:block;font-style:normal;font-size:11.5px;color:var(--slate-mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reccard .rb s{display:inline-block;text-decoration:none;font-size:10.5px;color:var(--slate-mut);margin-top:3px}
@media (max-width:1000px){.recg{flex-direction:column}.reclog,.reccand{flex:none;width:100%}}

/* ---------- 4 · FIELD DIFF — đối chiếu hiện trường vs hồ sơ đơn (Stripe/C-SharpCorner) ---------- */
.diff{border:1px solid var(--line2);border-radius:var(--r);background:var(--card);overflow:hidden}
.diff>header{display:grid;grid-template-columns:1fr 152px 1fr;gap:0;border-bottom:1px solid var(--line2);background:var(--soft)}
.diff>header div{padding:9px 12px;font:700 9.5px var(--ff);letter-spacing:.08em;text-transform:uppercase;color:var(--slate-mut)}

/* =====================================================================
   mockups/03-logistics-neutral-gallery.html
   10 mẫu giao diện "Đơn mất bill" (SPX) thiết kế theo nghiệp vụ logistic — bảng màu trung tính lấy đúng :root của index.html.

'use strict';

/* ---------- 1. TIỆN ÍCH ---------- */
var VN_TZ_TODAY = new Date(2026, 9, 12, 8, 30, 0); // 12/10/2026 08:30 — "hôm nay" của demo
function pad(n){ return (n<10?'0':'')+n; }
function dmy(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function dmyhm(d){ return dmy(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function hm(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function parseVn(s){ var m=/^(\d{2})\/(\d{2})\/(\d{4})[ T](\d{2}):(\d{2})(?::(\d{2}))?/.exec(String(s||'')); if(!m) return null; return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0)); }
function daysOld(s){ var d=parseVn(s); if(!d) return 0; return Math.max(0, Math.floor((VN_TZ_TODAY-d)/864e5)); }
function hoursOld(s){ var d=parseVn(s); if(!d) return 0; return Math.max(0, Math.round((VN_TZ_TODAY-d)/36e5)); }
function vnd(n){ n=Number(n)||0; return n.toLocaleString('vi-VN')+' đ'; }
function nsq(n){ return (Number(n)||0).toLocaleString('vi-VN'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function cl(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\u0111/g,'d').replace(/[^a-z0-9 _-]/g,'').trim(); }
function has(q,s){ return cl(s).indexOf(cl(q))>=0; }
function seedRand(seed){ var x=seed%2147483647; if(x<=0)x+=2147483646; return function(){ x=x*16807%2147483647; return (x-1)/2147483646; }; }
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)%arr.length]; }

/* QR thật (thư viện qrcode-generator) — fallback: mã giả nếu thiếu mạng */
function qrSvg(text,px){
  px=px||120;
  try{
    if(typeof qrcode==='function'){
      var q=qrcode(0,'M'); q.addData(String(text)); q.make();
      var n=q.getModuleCount(), cell=Math.floor(px/n), sz=cell*n, d='';
      for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(q.isDark(r,c)) d+='M'+(c*cell)+' '+(r*cell)+'h'+cell+'v'+cell+'h-'+cell+'z';
      return '<svg viewBox="0 0 '+sz+' '+sz+'" width="'+px+'" height="'+px+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="'+sz+'" height="'+sz+'" fill="#fff"/><path d="'+d+'" fill="#101820"/></svg>';
    }
  }catch(e){}
  var rng=seedRand(text.length*77+5), s='<svg viewBox="0 0 100 100" width="'+px+'" height="'+px+'" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#fff"/>', i;
  for(i=0;i<900;i++){ if(rng()>0.55) s+='<rect x="'+(i%30*3.3)+'" y="'+(Math.floor(i/30)*3.3)+'" width="3.3" height="3.3"/>'; }
  return s+'<rect x="6" y="6" width="20" height="20" fill="none" stroke="#101820" stroke-width="4"/><rect x="74" y="6" width="20" height="20" fill="none" stroke="#101820" stroke-width="4"/><rect x="6" y="74" width="20" height="20" fill="none" stroke="#101820" stroke-width="4"/></svg>';
}

/* ---------- 4. STORE + HÀNH VI (giả lập google.script.run) ---------- */
var DB, Store={
  latency:180, failMode:false, seqBox:0, seqItem:0,
  init:function(){ DB=buildData(); this.failMode=false; this.latency=180; },
  call:function(name,args,fn){
    var self=this;
    return new Promise(function(res,rej){
      var wait = self.latency + Math.floor(Math.random()*120);
      setTimeout(function(){
        if(self.failMode && /^(resolveItem|liquidateBatch|createBox|createItem|adminEditItem|editItem|addFeedback|enqueuePrintJob)$/.test(name)){
          rej({message:'Server lỗi giả lập (chế độ demo): '+name}); return;
        }
        try{ res(fn()); }catch(e){ rej(e); }
      },wait);
    });
  }
};
Store.init();

/* Truy vấn */
function findItem(code){ var k=String(code||'').trim().toUpperCase(); if(!k) return null; for(var i=0;i<DB.items.length;i++) if(DB.items[i].code.toUpperCase()===k) return DB.items[i]; return null; }
function histOf(code){ return DB.hist[code]||[]; }
function photos(it){ var out=[]; (it.slots||[]).forEach(function(s){ if(s.url) out.push({slot:s.slot,url:s.url,slotLabel:slotLabel(s.slot)}); }); (it.extras||[]).forEach(function(u,i){ out.push({slot:'bo_sung_'+(i+1),url:u,slotLabel:slotLabel('bo_sung_'+(i+1))}); }); return out; }
function slotLabel(s){ return {ngoai_quan:'Ngoại quan',san_pham:'Sản phẩm',bo_sung:'Bổ sung',bo_sung_1:'Bổ sung 1',bo_sung_2:'Bổ sung 2'}[s]||s; }

  var key=pad(VN_TZ_TODAY.getDate())+'-'+pad(VN_TZ_TODAY.getMonth()+1)+'-'+VN_TZ_TODAY.getFullYear();

  return kind+'.'+key+'.'+(n+(kind==='Box'?Store.seqBox:Store.seqItem));

/* ---------- 4b. HÀNH VI (mutation, optimistic + rollback như app thật) ---------- */
function toast(msg,type){ App.toast.push({m:msg,t:type||'ok',id:Math.random().toString(36).slice(2)}); renderToast(); setTimeout(function(){ App.toast=App.toast.filter(function(x){return x.m!==msg;}); renderToast(); },3200); }
function renderToast(){ var el=document.getElementById('toasts'); if(el) el.innerHTML=App.toast.map(function(t){ return '<div class="tst tst-'+t.t+'">'+esc(t.m)+'</div>'; }).join(''); }
var PENDING={};
function markPending(code,from,to,bill){ var it=findItem(code); PENDING[code]={from:from,to:to,bill:bill||'',billFrom:it?it.bill:''}; }
/* Ứng trước giao diện ngay nhưng GIỮ snapshot PENDING tới khi server trả lời (mới xóa ở done/rollback) — badge “đang đồng bộ” hiển thị trong lúc chờ + rollback có dữ liệu */
function commitPending(code){ var p=PENDING[code]; if(!p) return;
  var it=findItem(code); if(!it) return; it.status=p.to; it.statusLabel=stLabel(p.to); if(p.bill) it.bill=p.bill; }
function donePending(code){ delete PENDING[code]; }
function rollback(code){ var p=PENDING[code]; if(!p) return; delete PENDING[code]; var it=findItem(code); if(it){ it.status=p.from; it.statusLabel=stLabel(p.from); it.bill=p.billFrom||''; } }
function isPending(code){ return !!PENDING[code]; }

function actResolve(code,bill){
  var it=findItem(code); if(!it) return Promise.reject({message:'Không tìm thấy đơn'});
  if(!bill) return Promise.reject({message:'Vui lòng nhập mã bill để xử lý.'});
  if(it.status!=='chua_xu_ly') return Promise.reject({message:'Đơn đang ở trạng thái '+stLabel(it.status)+' — chỉ Resolve khi còn Lưu kho.'});
  markPending(code,it.status,'da_tim_bill',bill); commitPending(code);
  logHist(code,'chua_xu_ly','da_tim_bill',ME_EMAIL,bill,bill,'');
  render();
  return Store.call('resolveItem',[code,bill],function(){ return {ok:true}; })
    .then(function(r){ donePending(code); return r; }, function(e){ rollback(code); render(); throw e; });
}
function actAdminStatus(code,to,bill,reason){
  var it=findItem(code); if(!it) return Promise.reject({message:'Không tìm thấy đơn'});
  if(!String(reason||'').trim()) return Promise.reject({message:'Đổi trạng thái phải điền Lý do.'});
  var from=it.status; markPending(code,from,to,bill); commitPending(code);
  logHist(code,from,to,'ADMIN đổi trạng thái',bill||'',bill||'',reason);
  render();
  return Store.call('adminEditItem',[{code:code,toStatus:to,reason:reason}],function(){ return {ok:true}; })
    .then(function(r){ donePending(code); return r; }, function(e){ rollback(code); render(); throw e; });

function kpis(){
  var k={open:0,over72:0,today:0,resolveToday:0,liq:0,queued:0,fb:0,backlog:0,ca:0,caOver:0,byHour:[],byKind:{Box:0,Item:0},age:[]};
  var today=dmy(VN_TZ_TODAY);
  DB.items.forEach(function(it){
    var created=parseVn(it.createdAt), isToday=it.createdAt.indexOf(today)>=0;
    if(it.status==='chua_xu_ly'){ k.open++; k.byKind[it.kind]=(k.byKind[it.kind]||0)+1; k.age.push(hoursOld(it.createdAt)); if(hoursOld(it.createdAt)>=72) k.over72++; }
    if(isToday) k.today++;
    if(it.status==='da_tim_bill'&&isToday) k.resolveToday++;
    if(it.status==='thanh_ly'&&isToday) k.liq++;
    histOf(it.code).forEach(function(h){ if(it.status==='da_tim_bill'&&String(h.at).indexOf(today)>=0&&h.to==='da_tim_bill') { k.resolveToday=k.resolveToday; } });
    if(created && created.getDay()===VN_TZ_TODAY.getDay()){ k.ca++; if(hoursOld(it.createdAt)>=72) k.caOver++; }
  });
  for(var h=0;h<24;h++) k.byHour.push(0);
  DB.items.forEach(function(it){ var c=parseVn(it.createdAt); if(c) k.byHour[c.getHours()]++; });
  DB.printQ.forEach(function(j){ if(j.status==='pending'||j.status==='printing') k.queued++; });
  k.fb=DB.feedback.length; k.backlog=DB.backlog.length;
  k.rate = k.today? Math.round(100*k.resolveToday/Math.max(1,k.today)) : 0;
  k.ageMed = k.age.length? (function(){ var a=k.age.slice().sort(function(x,y){return x-y;}); return a[Math.floor(a.length/2)]; })() : 0;
  k.oldest = k.age.length? Math.max.apply(null,k.age) : 0;
  return k;
}

function gunFire(raw,from){
  var code=normCode(raw); if(!code) return;
  var known=findItem(code); if(known) code=known.code;
  if(App.scan) return routeScan(code);
  if(App.tab==='liq'){
    var chk=liqFilter(code);
    if(chk.bad){ if(/Đã có trong lô/.test(chk.bad)){ beep('dup'); App.liqLog='⚠ '+chk.bad+' — '+code+' (không chặn)'; } else { beep('bad'); App.liqLog='✕ '+chk.bad; } }
    else { App.liq.push(code); beep('ok'); App.liqLog='✓ Đã thêm '+code+' vào lô ('+App.liq.length+')'; }
    pushRecent(code); render(); return;
  }
  if(App.tab==='print'){
    if(!/^(Box|Item)\./i.test(code)){ beep('bad'); toast('Mã không đúng định dạng Box./Item. — không in','err'); return; }
    App.printCodes=[code]; beep('ok'); pushRecent(code);
    if(App.printAuto){ App.printCodes=[code]; render(); doPrint(); return; }
    render(); return;
  }
  var it=findItem(code);
  if(it){ beep('ok'); pushRecent(code); App.sel=it.code; App.lightbox=-1; render(); return; }
  if(/^SPXVN/.test(code) && App.sel){ actResolve(App.sel,code).then(function(){ toast('Resolve '+App.sel+' bằng bill '+code,'ok'); }).catch(function(e){ toast(e.message,'err'); }); return; }
  beep('bad'); pushRecent(code);
  App.q=code; render();
  toast('Không có đơn “'+code+'” — tạo mới?','err');
}

function runCmd(c){
  if(!c) return;
  App.pal=''; App.palSel=0;
  if(c.indexOf('tab:')===0) setTab(c.slice(4));
  else if(c.indexOf('f:')===0){ App.status=c.slice(2); setTab('list'); }
  else if(c.indexOf('k:')===0){ App.kind=c.slice(2); setTab('list'); }
  else if(c.indexOf('go:')===0){ App.sel=c.slice(3); setTab('list'); }
  else if(c.indexOf('vp:')===0){ setVp(c.slice(3)); render(); return; }
  else if(c==='new'){ App.create.open=true; App.tab='create'; App.create.saved=''; App.create.shots=[]; App.create.code=nextCode(App.create.kind); }
  else if(c==='pr'){ App.printCodes=App.sel?[App.sel]:[]; setTab('print'); return; }
  else if(c==='v'){ App.v=App.v>=10?1:App.v+1; buildPicks(); pickVariant(App.v); return; }
  else if(c==='rf'){ App.status='all'; App.kind='both'; App.q=''; }
  render();
}

function onChange(e){

  if(n==='sort'){ App.sort=e.target.value==='new'?'new':e.target.value; App.sortDir=e.target.value==='new'?-1:1; render(); }
  else if(n==='auto'){ App.printAuto=e.target.checked; render(); }
  else if(n==='poll'){ if(e.target.checked) startPolling(true); else { clearInterval(App.polling); App.polling=null; App.queueLog=''; } render(); }
  else if(n==='bulkKind'){ App.bulkKind=e.target.value; render(); }

function onKey(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); App.pal=App.pal?'':'_open_'; App.palSel=0; render(); var p=document.getElementById('palIn'); if(p)p.focus(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='p'){ if(App.printCodes.length){ e.preventDefault(); doPrint(); } return; }
  if(e.key==='Escape'){
    if(App.lightbox>=0){ App.lightbox=-1; } else if(App.pal){ App.pal=''; } else if(App.scan){ App.scan=null; stopStream(); }
    else if(App.edit){ App.edit=''; } else if(App.intro){ App.intro=false; } else if(App.fbOpen){ App.fbOpen=false; }
    else if(App.sel){ App.sel=''; App.pageDetail=false; } else return;
    render(); return;
  }
  if(App.pal){
    if(e.key==='ArrowDown'){ App.palSel=Math.min(App.palSel+1,9); render(); e.preventDefault(); return; }
    if(e.key==='ArrowUp'){ App.palSel=Math.max(0,App.palSel-1); render(); e.preventDefault(); return; }
    if(e.key==='Enter'){ var c=document.querySelectorAll('.cmd')[App.palSel]; if(c) runCmd(c.getAttribute('data-c')); e.preventDefault(); return; }
  }
  if(e.key==='Enter'&&e.target.getAttribute('data-gun')){ e.preventDefault(); gunFire(e.target.value); return; }
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); var q=document.getElementById('q'); if(q)q.focus(); }
}

/* Phản hồi quét: beep + rung + flash (giống máy quét công nghiệp) */
var AC=null;
function beep(kind){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type='square'; o.frequency.value= kind==='bad'?330: kind==='dup'?520:880;
    g.gain.value=0.06; o.connect(g); g.connect(AC.destination); o.start();
    o.stop(AC.currentTime+(kind==='bad'?0.24:0.09));
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(kind==='bad'?[80,40,80]:kind==='dup'?60:25); }catch(e){}
}
function relTime(s){
  var d=parseVn(s); if(!d) return s; var m=Math.floor((VN_TZ_TODAY-d)/6e4);
  if(m<1) return 'vừa xong'; if(m<60) return m+' phút trước';
  if(m<1440) return Math.floor(m/60)+' giờ trước'; return Math.floor(m/1440)+' ngày trước';
}

/* Lưới/hiển thị theo tab */
function filtered(){
  var out=DB.items.filter(function(it){
    if(App.status!=='all' && it.status!==App.status) return false;
    if(App.kind!=='both' && it.kind!==App.kind) return false;
    if(App.q && !(has(App.q,it.code)||has(App.q,it.description)||has(App.q,it.bill)||has(App.q,it.note)||has(App.q,it.createdBy))) return false;
    if(App.hour!=null && parseVn(it.createdAt) && parseVn(it.createdAt).getHours()!==App.hour) return false;
    if(App.bucket){ var h=hoursOld(it.createdAt), b=h<24?0:h<72?1:h<168?2:3; if(b!==App.bucketIdx) return false; }
    return true;
  });
  var dir=App.sortDir<0?-1:1;
  out.sort(function(a,b){
    if(App.sort==='code') return dir*a.code.localeCompare(b.code);
    if(App.sort==='kind') return dir*(a.kind<b.kind?-1:1);
    if(App.sort==='status') return dir*a.status.localeCompare(b.status);
    if(App.sort==='desc') return dir*a.description.localeCompare(b.description);
    if(App.sort==='age') return dir*(hoursOld(a.createdAt)-hoursOld(b.createdAt));
    if(App.sort==='by') return dir*a.createdBy.localeCompare(b.createdBy);
    if(App.sort==='bill') return dir*(String(a.bill)||'').localeCompare(String(b.bill)||'');
    return dir*(parseVn(b.createdAt)-parseVn(a.createdAt));
  });
  return out;
}

function isTodayIt(it){ return it.createdAt.indexOf(dmy(VN_TZ_TODAY))>=0; }

function wqItems(k){

  if(k==='late') return base.filter(function(it){ return hoursOld(it.createdAt)>=72; });

/* Vị trí lưu kho dẫn từ ghi chú nghiệp vụ (Kệ A1/B2/C4 · ô chờ thanh lý · chờ xe) */
function binOf(it){
  var n=String(it.note||'');
  var m=/K[eệ]\s*([A-Z]\d{1,2})/i.exec(n); if(m) return m[1].toUpperCase();
  if(/thanh ly/i.test(n)) return 'LOT';
  if(/ch[eơ] xe/i.test(n)) return 'DOCK';
  if(/c[eư]a xu[eấ]t/i.test(n)) return 'DOCK';
  return 'UN';
}
var BIN_HINT={UN:'Chưa xếp giá',LOT:'Ô chờ thanh lý',DOCK:'Chờ xe / cửa xuất'};
function binsAll(){
  var map={};
  DB.items.forEach(function(it){
    if(it.status!=='chua_xu_ly') return;
    var b=binOf(it); var o=map[b]||(map[b]={id:b,n:0,hot:0,med:0,ages:[]});
    o.n++; o.ages.push(hoursOld(it.createdAt)); if(hoursOld(it.createdAt)>=168) o.hot++;
  });
  var ids=Object.keys(map).filter(function(k){ return k!=='UN'; }).sort();
  if(map.UN) ids.push('UN');
  ids.forEach(function(k){ var o=map[k]; o.ages.sort(function(a,b){return a-b;}); o.med=o.ages.length?o.ages[Math.floor(o.ages.length/2)]:0; });
  return ids.map(function(k){ return map[k]; });
}
/* Độ khớp khi quét/đối chiếu: mã > bill > kệ > mô tả > người tạo */
function scoreMatch(it,q){
  if(!q) return 0;
  var s=cl(q), out=0;
  if(cl(it.code)===s) out=100;
  else if(cl(it.code).indexOf(s)>=0||s.indexOf(cl(it.code))>=0) out=82;
  else if(it.bill&&cl(it.bill).indexOf(s)>=0) out=74;
  else if(binOf(it)&&cl(binOf(it)).indexOf(s)>=0&&s.length<=4) out=48;
  else if(cl(it.description).indexOf(s)>=0) out=36;
  else if(cl(it.createdBy).indexOf(s)>=0) out=30;
  else if(cl(it.note).indexOf(s)>=0) out=26;
  if(out&&hoursOld(it.createdAt)>=72) out=Math.min(99,out+3);
  return out;
}

/* ---------- 4 · FIELD DIFF (hồ sơ đơn vs ghi nhận hiện trường) ---------- */
function fieldObs(it){
  /* Giá trị "hiện trường" tất định theo mã đơn — mockup, không random để mỗi lần mở vẫn giống nhau */
  var h=Math.abs(hashStr(it.code)), ps=photos(it).length, out={};
  out.bill = it.bill&&h%4===0 ? '' : it.bill;
  out.note = it.note ? (h%3===0 ? it.note.replace(/K[eệ]\s*[A-Z]\d{1,2}/i,'Kệ A3') : it.note) : (h%5===0?'Kệ B2':'');
  out.kind = it.kind;
  out.desc = h%7===2 ? it.description.replace(/,\s.*$/,'') : it.description;
  out.photo = it.kind==='Box' ? Math.min(ps, h%6===1?1:ps) : ps;
  out.status = it.status;
  return out;
}
function diffHtml(){
  var pool=openItems().slice(0,10);
  var it=App.sel?findItem(App.sel):(pool[0]||null);

  var ob=fieldObs(it), ps=photos(it);
  var rows=[
    ['Mã đơn',it.code,it.code],
    ['Loại hàng',it.kind==='Box'?'Thùng (Box)':'Kiện (Item)',ob.kind==='Box'?'Thùng (Box)':'Kiện (Item)'],
    ['Mô tả',it.description,ob.desc],
    ['Bill',it.bill||'— chưa gắn bill',ob.bill||'— không thấy bill trên tem'],
    ['Vị trí lưu',it.note||'— chưa ghi',ob.note||'— hiện trường không thấy ghi chú'],
    ['Ảnh hồ sơ',ps.length+' ảnh ('+ps.map(function(p){return p.slotLabel;}).join(', ')+')',ob.photo+' ảnh chụp tại hiện trường'],
    ['Người tạo',whoShort(it.createdBy),whoShort(it.createdBy)],
    ['Tạo lúc',it.createdAt,it.createdAt],
    ['Trạng thái',stLabel(it.status),stLabel(ob.status)]

  var ndiff=0;
  var body=rows.map(function(r){

/* Tab Backlog (bảng 16 cột, mặc định 10) */
function backlogView(){
  var b=App.bl, rows=DB.backlog.slice();
  if(b.q) rows=rows.filter(function(r){ return has(b.q,Object.keys(r).map(function(k){return r[k];}).join(' ')); });
  ['product_name','return_sort_code','buyer_sort_code'].forEach(function(kf){ if(b.sf[kf]) rows=rows.filter(function(r){ return has(b.sf[kf],r[kf]); }); });
  if(b.status) rows=rows.filter(function(r){ return r.status_desc===b.status; });
  if(b.aging) rows=rows.filter(function(r){ return r.aging_leadtime===b.aging; });
  if(b.sk){ var d=b.skDir<0?-1:1; rows.sort(function(x,y){ var a=x[b.sk],c=y[b.sk]; var na=Number(a),nc=Number(c);
    if(!isNaN(na)&&!isNaN(nc)) return d*(na-nc); return d*String(a).localeCompare(String(c)); }); }
  else rows.sort(function(x,y){ return parseVn(y.created_time)-parseVn(x.created_time); });
  var KEYS=['shipment_id','status_desc','pickup_station_name','created_time','last_touch_at','product_name','return_sort_code','buyer_sort_code','aging_leadtime','cogs',
    'station_name','next_station_name','lh_trip_number','inbound_time','last_touch_by','seller_sort_code'];
  var TITLES={shipment_id:'Shipment ID',status_desc:'Status',station_name:'Current station',next_station_name:'Next station',pickup_station_name:'Pickup station',created_time:'Created time',lh_trip_number:'LH trip',inbound_time:'Inbound',last_touch_at:'Last touch',last_touch_by:'Last touch by',product_name:'Product name',seller_sort_code:'Seller sort',return_sort_code:'Return sort',buyer_sort_code:'Buyer sort',aging_leadtime:'Aging leadtime',cogs:'COGS'};
  var cols=KEYS.slice(0,b.col), per=50, pages=Math.max(1,Math.ceil(rows.length/per));
  if(b.page>pages) b.page=1;
  var view=rows.slice((b.page-1)*per,(b.page-1)*per+per);
  var totalCogs=rows.reduce(function(s,r){ return s+(Number(r.cogs)||0)*11; },0);
  var statuses=[],agings=[];
  DB.backlog.forEach(function(r){ if(statuses.indexOf(r.status_desc)<0) statuses.push(r.status_desc); if(agings.indexOf(r.aging_leadtime)<0) agings.push(r.aging_leadtime); });
  agings.sort();
  return '<div class="pane bl">'+
    '<div class="bl-meta"><span class="upd">Last update <b>'+esc(DB.backlog.length?'10/10/2026 18:53:19':'')+'</b></span>'+
      '<span class="cnt">Dòng lọc: <b>'+rows.length+'</b>/'+DB.backlog.length+' · Tổng COGS <b>'+vnd(totalCogs)+'</b></span>'+
      '<span class="subnote">Read-only — WebApp không ghi sheet Backlog</span></div>'+
    '<div class="bl-search"><span>🔍</span><input data-in="blQ" value="'+esc(b.q)+'" placeholder="Tìm toàn cục: shipment, sản phẩm, sort code, station…"><button class="btn mini" data-act="blReset">Xóa lọc</button></div>'+
    '<div class="colbar"><span class="colg"><b>Cột hiển thị</b><button class="btn mini ghost" data-act="blColDn">−</button><span class="coln">'+b.col+'/16</span><button class="btn mini ghost" data-act="blColUp">＋</button>'+
      '<button class="colbtn'+(b.sfOpen?' open':'')+'" data-act="blCols">Bộ lọc cột</button></span>'+
      '<div class="scrollrow show">'+['product_name','return_sort_code','buyer_sort_code'].map(function(kf){
        return '<input class="pill" data-in="blSf_'+kf+'" value="'+esc(b.sf[kf]||'')+'" placeholder="'+TITLES[kf]+'…">'; }).join('')+
        '<select class="pill" data-in="blStatus"><option value="">Mọi Status</option>'+statuses.map(function(s){ return '<option'+(b.status===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select>'+
        '<select class="pill" data-in="blAging"><option value="">Mọi Aging</option>'+agings.map(function(s){ return '<option'+(b.aging===s?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div></div>'+
    '<div class="tblwrap wide"><table class="bltbl"><thead><tr>'+cols.map(function(k){
      return '<th data-act="blSort" data-k="'+k+'">'+TITLES[k]+'<i>'+(b.sk===k?(b.skDir<0?'▾':'▴'):'')+'</i></th>'; }).join('')+'</tr></thead><tbody>'+
      view.map(function(r){ return '<tr data-act="blSel" data-id="'+esc(r.shipment_id)+'" class="'+(b.sel===r.shipment_id?'sel':'')+'">'+cols.map(function(k){
        var v=r[k];
        if(k==='cogs') return '<td class="num">'+vnd(v)+'</td>';
        if(k==='aging_leadtime') return '<td class="ageb '+ageClass(v)+'">'+esc(v)+'</td>';
        if(k==='shipment_id') return '<td class="sid">'+esc(v)+'</td>';
        if(k==='status_desc') return '<td><span class="bstat">'+esc(v)+'</span></td>';
        return '<td title="'+esc(v)+'">'+esc(v)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table>'+
      (view.length?'':'<div class="empty">Không có dòng khớp bộ lọc.</div>')+'</div>'+
    '<div class="pager"><span class="rng">Trang <b>'+b.page+'</b>/'+pages+' · '+(rows.length?(b.page-1)*per+1:0)+'–'+Math.min(rows.length,b.page*per)+'</span>'+
      '<button class="btn mini pg" data-act="blPg" data-p="'+(b.page-1)+'"'+(b.page<2?' disabled':'')+'>‹</button>'+
      '<button class="btn mini pg" data-act="blPg" data-p="'+(b.page+1)+'"'+(b.page>=pages?' disabled':'')+'>›</button></div>'+
    (b.sel?blDetail(b.sel):'')+'</div>';
}
function ageClass(v){ var m=/(\d+)\s*(day|hour)/.exec(String(v)); if(!m) return 'a0';

     note:'Ca sau mở lên là hiểu ngay: cột trái "Việc của ca tôi" (phát sinh trong 12 giờ) kèm nút Resolve, cột phải "Chưa bàn giao" (tồn trên 12 giờ, chậm nhất bao nhiêu ngày) kèm nút xếp lô. Bên cạnh là ô ghi chú bàn giao và hai dòng ký — bấm "Ký bàn giao" thì dòng ký ghi tên admin + giờ hiện trường. Không cần đọc biểu đồ, chỉ cần biết việc nào đang đổ sang ca mình.'},
  9:{name:'Dock Map',tag:'Sơ đồ ô kệ · bấm ô là ra đơn',nav:'sidebar',list:'dock',detail:'drawer',per:48,
     note:'Người tìm hàng không nghĩ theo danh sách mà theo chỗ đặt. Lưới ô sinh từ chính ghi chú nghiệp vụ (Kệ A1/B2/C4, ô chờ thanh lý, chờ xe/cửa xuất, chưa xếp giá): mỗi ô hiện số đơn + số quá 7 ngày + thanh tải nhỏ, ô có đơn quá hạn viền đỏ. Bấm ô là cột phải liệt kê đơn trong ô; bấm "Chọn cả ô vào lô thanh lý" gom nhanh cả nhóm. Cách xếp giá của Manhattan Omni.'},
  10:{name:'Handheld PDA',tag:'Máy cầm tay · một việc một màn',nav:'bottom',list:'pda',detail:'sheet',per:24,big:true,
     note:'Màn hình device ngoài kho, đi găng tay vẫn bấm được: 3 bước rõ (Quét → Đối chiếu → Xác nhận), mỗi bước đúng một việc — ô chờ quét to, sau khi quét hiện 1 ảnh + vị trí + tuổi tồn và 3 lựa chọn nghiệp vụ (đã thấy bill / không có bill thì xếp lô / in lại tem). Ảnh thumbnail, không lưới, không pop-up chồng pops, phím cao 48px. Cuối màn là 5 việc kế tiếp để không phải quét mò.'}
};

function curV(){ return VARIANTS[App.v]; }

/* ---------- 7. RENDER ---------- */
function tabheadHtml(){
  if(App.tab==='create') return '';
  var t={list:'Danh sách đơn mất bill',backlog:'Backlog vận hành',liq:'Thanh lý theo lô',print:'In mã QR',fb:'Góp ý nội bộ',role:'Phân quyền truy cập'};
  var cnt={list:filtered().length,backlog:DB.backlog.length,liq:App.liq.length+' đơn trong lô',print:DB.printQ.length+' job',fb:DB.feedback.length+' tin',role:DB.users.length+' user'};
  return '<div class="tabhead"><h2>'+t[App.tab]+'</h2><span>'+cnt[App.tab]+'</span>'+
    (App.tab==='liq'&&App.liqStep===2?'<button class="btn ghost sm" data-act="liqBack">‹ Quay lại sửa lô</button>':'')+
    (App.tab==='liq'&&App.liq.length?'<b class="lotbadge">Tổng '+App.liq.length+' đơn đã quét</b>':'')+
    (App.tab==='print'?'<s>Quét là tự in · điện thoại gửi việc về đây</s>':'')+
    (App.tab==='role'?'<s>Đăng nhập: '+esc(ME_EMAIL)+' · ADMIN</s>':'')+'</div>';
}
function contentView(){
  if(App.tab==='backlog') return backlogView();
  if(App.tab==='liq') return liqView();
  if(App.tab==='print') return (VARIANTS[App.v].list==='bench'||App.v===6)?benchHtml():printView();
  if(App.tab==='fb') return feedbackView();
  if(App.tab==='role') return roleView();
  if(App.tab==='create') return '<div class="tabhead"><h2>Tạo đơn mới</h2></div>'+createView();
  return toolsHtml()+listHtml();
}
function render(){
  var V=curV(), ae=document.activeElement, keep=ae&&ae.getAttribute?ae.getAttribute('data-in'):'';
  var caret=null; try{ caret=ae&&ae.selectionStart; }catch(e){}
  App.navMode=V.nav;
  var detailInner=detailHtml(V);
  var isDrawer=(V.detail==='drawer'||V.detail==='inline');
  var shell='<div class="shell v'+App.v+' nav-'+V.nav+' det-'+V.detail+' list-'+V.list+(V.dark?' dark':'')+(V.big?' big':'')+(V.cls?' '+V.cls:'')+(App.dens?' dens-'+App.dens:'')+(isPhone()?' mob':'')+'">'+
    (V.nav==='sidebar'||V.nav==='rail'?sideHtml():'')+
    '<div class="main">'+topHtml(V)+((V.nav==='top'||V.nav==='none')?topnavHtml(V):'')+
      '<div class="body">'+
        '<div class="content'+(V.list==='wall'?' nowrap':'')+'">'+
          tabheadHtml()+
          contentView()+
        '</div>'+
        (isDrawer?detailInner:'')+
      '</div>'+
      (V.nav==='bottom'||isPhone()?bottomHtml(V):'')+
    '</div>'+
    (!isDrawer&&App.sel?detailInner:'')+
    printSheetHtml()+scanModal()+editModal()+lightbox()+palette()+introModal()+fbModal()+
    '<div class="toasts" id="toasts"></div></div>';
  document.getElementById('app').innerHTML=shell;
  if(App.wide) document.querySelector('.drawer')&&document.querySelector('.drawer').classList.add('wide');
  renderToast(); updateNote();
  if(keep){ var el=document.querySelector('[data-in="'+keep+'"]'); if(el){ el.focus(); if(caret!=null&&el.setSelectionRange){ try{ el.setSelectionRange(caret,caret); }catch(e){} } } }
  if(App.pal){ var p=document.getElementById('palIn'); if(p&&document.activeElement!==p){ p.focus(); } }
  if(App.stream) attachStream();
}
/* Khởi động */
buildPicks(); pickVariant(1);
</script>
